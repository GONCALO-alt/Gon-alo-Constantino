# Configuração do Netlify (alojamento gratuito). No Netlify, define a «Base directory» como `study-ai`.
# Instruções completas no README: «Publicar grátis no Netlify (com a IA Gemini)».

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# A API (/api/...) é uma função do Netlify.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Aplicação de página única: qualquer outro endereço abre a app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Os cabeçalhos de segurança e de cache estão em public/_headers (comum ao Netlify e ao Cloudflare).
