<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="STUDY AI — o teu assistente pessoal de estudos com inteligência artificial." />
    <meta name="application-name" content="STUDY AI" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="STUDY AI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>STUDY AI</title>
    <style>
      /* Fundo escuro desde o primeiro instante (evita o ecrã branco ao abrir a app). */
      html, body { background: #09090b; margin: 0; }
      /* Mensagem enquanto a app carrega (substituída pela app quando abre). */
      .boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        color: #fafafa; font: 600 17px/1.4 -apple-system, system-ui, 'Segoe UI', sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      .boot b { color: #facc15; }
      .boot small { font-weight: 400; font-size: 14px; color: #a1a1aa; opacity: 0; animation: boot-show 0.3s 8s forwards; }
      @keyframes boot-show { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div>A abrir a <b>STUDY AI</b>…</div>
        <small>Está a demorar? Fecha o separador e abre o endereço outra vez.</small>
      </div>
    </div>
    <noscript><div class="boot">A STUDY AI precisa de JavaScript ligado no navegador.</div></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
