<title>LiveVerse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="LiveVerse: rede social de criadores com simulador de lives. Seguidores, espectadores e métricas são fictícios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: three-column creator network (nav · feed · rail), collapsing to one column + bottom nav on phones. Dark-only by design. */
:root {
  color-scheme: dark;
  --bg: #08070f;
  --bg-2: #0e0c1a;
  --surface: #14111f;
  --surface-2: #1b1730;
  --surface-3: #241f3d;
  --line: #2b2547;
  --line-2: #3a3260;
  --fg: #efecff;
  --fg-2: #c9c3ea;
  --muted: #8f88b5;
  --purple: #9b6bff;
  --blue: #4d8dff;
  --pink: #ff4fa8;
  --accent: var(--purple);
  --accent-2: var(--pink);
  --live: #ff3b5c;
  --good: #3ee0a1;
  --warn: #ffc24b;
  --grad: linear-gradient(120deg, var(--purple), var(--blue) 55%, var(--pink));
  --f-display: "Chakra Petch", "Rajdhani", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  --r-lg: 22px;
}
:root[data-accent="blue"] { --accent: var(--blue); --accent-2: var(--purple); }
:root[data-accent="pink"] { --accent: var(--pink); --accent-2: var(--blue); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg);
}
.bg-glow {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(600px 400px at 10% -5%, color-mix(in oklab, var(--purple) 22%, transparent), transparent 70%),
    radial-gradient(500px 380px at 95% 10%, color-mix(in oklab, var(--pink) 14%, transparent), transparent 70%),
    radial-gradient(700px 500px at 60% 110%, color-mix(in oklab, var(--blue) 14%, transparent), transparent 70%);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; letter-spacing: .01em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- Shell ---------- */
.app {
  position: relative; z-index: 1;
  display: grid; grid-template-columns: 240px minmax(0, 1fr) 320px; gap: 24px;
  max-width: 1360px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 72px;
}
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; padding-block: 18px 44px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; scrollbar-width: none; }
.logo { display: flex; align-items: center; gap: 10px; padding: 6px 10px 10px; text-decoration: none; }
.logo-mark { width: 36px; height: 36px; border-radius: 11px; background: var(--grad); display: grid; place-items: center; box-shadow: 0 6px 24px -6px var(--purple); }
.logo-mark svg { width: 20px; height: 20px; }
.logo b { font-family: var(--f-display); font-size: 22px; letter-spacing: .04em; }
.logo b span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.nav-link {
  display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 12px; text-decoration: none;
  color: var(--fg-2); font-weight: 600; transition: background .2s, color .2s, transform .2s; position: relative;
}
.nav-link svg { width: 22px; height: 22px; flex: none; }
.nav-link:hover { background: var(--surface-2); color: var(--fg); }
.nav-link.on { color: var(--fg); background: linear-gradient(90deg, color-mix(in oklab, var(--accent) 22%, transparent), transparent); }
.nav-link.on svg { color: var(--accent); }
.badge-count { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--pink); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.side .btn-primary { margin-top: 14px; justify-content: center; padding: 13px; }
.side-me { margin-top: auto; display: flex; align-items: center; gap: 2px; padding: 8px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); flex: none; }
.side-me .icon-btn { width: 34px; height: 34px; flex: none; }
.side-me-link { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; flex: 1; }
.side-me-link div { min-width: 0; }
.side-me-link strong, .side-me-link small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-me-link small { color: var(--muted); }
.side-me div { min-width: 0; }
.side-me strong, .side-me small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-me small { color: var(--muted); }
main { min-width: 0; padding-block: 20px; }
main:focus { outline: none; }
.app.wide { grid-template-columns: 240px minmax(0, 1fr); }
.app.wide .rail { display: none; }
@media (max-width: 820px) { .app.wide { grid-template-columns: minmax(0, 1fr); } }
.rail { padding-block: 20px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; overflow-y: auto; scrollbar-width: none; }
.bottom-nav { display: none; }
.simbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; text-align: center; font-size: 12px; color: var(--muted);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
}
.simbar b { color: var(--warn); font-weight: 700; }

@media (max-width: 1180px) { .app { grid-template-columns: 220px minmax(0, 1fr); } .rail { display: none; } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); padding-bottom: 130px; }
  .side { display: none; }
  .bottom-nav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 28px; z-index: 45; justify-content: space-around;
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px));
    background: color-mix(in oklab, var(--surface) 92%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  }
  .bottom-nav .nav-link { flex-direction: column; gap: 2px; padding: 6px 8px; font-size: 10.5px; }
  .bottom-nav .nav-link svg { width: 22px; height: 22px; }
  .bottom-nav .badge-count { position: absolute; top: 0; right: 4px; margin: 0; }
  .simbar { bottom: 0; }
}

/* ---------- Primitives ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--fg);
  padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; transition: transform .15s, background .2s, border-color .2s, box-shadow .2s;
  white-space: nowrap;
}
.btn svg { width: 18px; height: 18px; }
.btn:hover { background: var(--surface-3); border-color: var(--accent); }
.btn:active { transform: scale(.96); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 8px 26px -10px var(--purple); background-size: 160% 100%; background-position: 0 0; }
.btn-primary:hover { background-position: 100% 0; border-color: transparent; box-shadow: 0 10px 30px -8px var(--pink); }
.btn-live { background: var(--live); border-color: transparent; color: #fff; box-shadow: 0 8px 26px -10px var(--live); }
.btn-live:hover { background: #ff5574; border-color: transparent; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
.btn-ghost:hover { background: var(--surface-2); border-color: transparent; color: var(--fg); }
.btn-danger { color: #ff8aa0; border-color: color-mix(in oklab, var(--live) 50%, transparent); background: transparent; }
.btn-danger:hover { background: color-mix(in oklab, var(--live) 18%, transparent); border-color: var(--live); }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-xs { padding: 4px 10px; font-size: 12px; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; display: inline-grid; place-items: center; border: 0; background: transparent; color: var(--fg-2); transition: background .2s, color .2s; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn svg { width: 20px; height: 20px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.panel { padding: 16px; }
.panel-title { font-family: var(--f-display); font-size: 17px; font-weight: 700; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.panel-title small { margin-left: auto; font-family: var(--f-body); font-weight: 600; font-size: 12px; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.spacer { flex: 1; }
.sim-tag {
  display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 6px; color: var(--warn); background: color-mix(in oklab, var(--warn) 13%, transparent); border: 1px solid color-mix(in oklab, var(--warn) 30%, transparent);
  vertical-align: middle; white-space: nowrap;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-2); transition: all .2s;
}
button.chip:hover { border-color: var(--accent); color: var(--fg); }
.chip.on { background: color-mix(in oklab, var(--accent) 22%, transparent); border-color: var(--accent); color: var(--fg); }
.pill-live { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 6px; background: var(--live); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .08em; }
.pill-live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1.2s infinite; }
.pill-soon { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 6px; background: var(--warn); color: #241a00; font-size: 11px; font-weight: 800; letter-spacing: .06em; animation: glow 1.6s infinite; }
.pill-state { display: inline-flex; padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 800; letter-spacing: .06em; background: var(--surface-3); color: var(--fg-2); }
@keyframes pulse { 50% { opacity: .3; } }
@keyframes glow { 50% { box-shadow: 0 0 0 4px color-mix(in oklab, var(--warn) 25%, transparent); } }
.verified { display: inline-grid; place-items: center; width: 18px; height: 18px; vertical-align: -3px; }
.verified svg { width: 18px; height: 18px; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.input, select.input, textarea.input {
  width: 100%; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; color: var(--fg); transition: border-color .2s, box-shadow .2s;
}
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 25%, transparent); }
textarea.input { resize: vertical; min-height: 80px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }
.switch { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
.switch input { appearance: none; width: 40px; height: 22px; border-radius: 11px; background: var(--surface-3); position: relative; transition: background .2s; cursor: pointer; flex: none; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg-2); transition: transform .2s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); background: #fff; }

.page-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head h1 { font-size: 30px; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tab { border: 0; background: transparent; padding: 12px 14px; font-weight: 700; color: var(--muted); position: relative; white-space: nowrap; transition: color .2s; }
.tab:hover { color: var(--fg); }
.tab.on { color: var(--fg); }
.tab.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px; background: var(--grad); }
.tab .num { font-size: 11px; color: var(--muted); margin-left: 4px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); border: 1px dashed var(--line-2); border-radius: var(--r-lg); }
.empty b { display: block; color: var(--fg); font-family: var(--f-display); font-size: 18px; margin-bottom: 4px; }

/* ---------- Avatars & game icons ---------- */
.av { --h: 270; width: var(--s, 44px); height: var(--s, 44px); border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: calc(var(--s, 44px) * .38); color: #fff;
  background: linear-gradient(140deg, hsl(var(--h) 85% 62%), hsl(calc(var(--h) + 50) 80% 48%)); overflow: hidden; text-decoration: none; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.av.ring { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
.av.ring-live { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--live); }
.gicon { width: var(--s, 28px); height: var(--s, 28px); border-radius: 8px; display: inline-grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: calc(var(--s, 28px) * .36); color: #fff; flex: none; background: var(--gc); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .18); letter-spacing: -.02em; }

/* ---------- Composer ---------- */
.composer { padding: 16px; margin-bottom: 16px; }
.composer-top { display: flex; gap: 12px; }
.composer-top > div { flex: 1; min-width: 0; }
.composer textarea { width: 100%; background: transparent; border: 0; resize: none; font-size: 17px; min-height: 64px; color: var(--fg); padding: 8px 0; }
.composer textarea:focus { outline: none; }
.ptypes { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; margin-bottom: 8px; }
.ptypes .chip { flex: none; }
.cmp-extra { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 10px; }
.cmp-extra:empty { display: none; }
.composer-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }
.count { font-size: 12px; color: var(--muted); }
.count.over { color: var(--live); }
.photo-prev { position: relative; border-radius: 14px; overflow: hidden; max-height: 260px; }
.photo-prev img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
.photo-prev button { position: absolute; top: 8px; right: 8px; background: rgb(0 0 0 / .6); color: #fff; }
.sched-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.sched-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); font-size: 13px; }
.sched-item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag-preview { font-size: 13px; color: var(--muted); }
.tag-preview b { color: var(--blue); font-weight: 600; }

/* ---------- Posts ---------- */
.feed { display: flex; flex-direction: column; gap: 12px; }
.post { padding: 16px; display: flex; gap: 12px; transition: border-color .2s, transform .2s; animation: rise .35s ease both; }
.post:hover { border-color: var(--line-2); }
.post.pinned { border-color: color-mix(in oklab, var(--accent) 60%, transparent); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.post-body { flex: 1; min-width: 0; }
.post-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; }
.post-head a { text-decoration: none; }
.post-head strong { font-weight: 800; }
.post-head .muted { font-size: 13px; }
.post-meta-top { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.post-meta-top svg { width: 14px; height: 14px; }
.post-text { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.post-text .ht { color: var(--blue); font-weight: 600; background: none; border: 0; padding: 0; cursor: pointer; }
.post-text .ht:hover { text-decoration: underline; }
.post-text .mn { color: var(--pink); font-weight: 600; }
.post-kind { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; background: var(--surface-3); color: var(--fg-2); }
.post-media { margin-top: 10px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
.post-media img { display: block; width: 100%; max-height: 420px; object-fit: cover; }
.post-actions { display: flex; align-items: center; gap: 2px; margin-top: 10px; margin-left: -8px; flex-wrap: wrap; }
.pa { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; transition: color .2s, background .2s, transform .15s; }
.pa svg { width: 18px; height: 18px; }
.pa:hover { background: var(--surface-2); color: var(--fg); }
.pa:active { transform: scale(.9); }
.pa.like.on { color: var(--pink); }
.pa.like.on svg { fill: currentColor; animation: pop .35s; }
.pa.rp.on { color: var(--good); }
.pa.save.on { color: var(--warn); }
.pa.save.on svg { fill: currentColor; }
.pa.pin.on { color: var(--accent); }
.pa.views { cursor: default; }
.pa.views:hover { background: transparent; color: var(--muted); }
@keyframes pop { 40% { transform: scale(1.35); } }
.game-strip { margin-top: 10px; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: linear-gradient(100deg, color-mix(in oklab, var(--gc) 30%, var(--surface-2)), var(--surface-2)); border: 1px solid var(--line); }
.game-strip strong { font-family: var(--f-display); font-size: 17px; display: block; }
.replies { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.reply { display: flex; gap: 8px; font-size: 14px; }
.reply > div { background: var(--bg-2); border-radius: 12px; padding: 7px 11px; min-width: 0; overflow-wrap: anywhere; }
.reply strong { font-size: 13px; }
.reply-form { display: flex; gap: 8px; }
.reply-form input { flex: 1; min-width: 0; }
.poll { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.poll-opt { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg-2); padding: 9px 12px; text-align: left; display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
.poll-opt i { position: absolute; inset: 0 auto 0 0; background: color-mix(in oklab, var(--accent) 26%, transparent); transition: width .6s; z-index: 0; }
.poll-opt span, .poll-opt b { position: relative; z-index: 1; }
.poll-opt.mine { border-color: var(--accent); }
button.poll-opt:hover { border-color: var(--accent); }
.ach-banner { margin-top: 10px; display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; background: radial-gradient(circle at 0 0, color-mix(in oklab, var(--warn) 28%, transparent), transparent 60%), var(--surface-2); border: 1px solid color-mix(in oklab, var(--warn) 35%, transparent); }
.ach-banner .ach-ico { font-size: 34px; }
.ach-banner strong { font-family: var(--f-display); font-size: 18px; display: block; }
.recap { margin-top: 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.recap div { background: var(--bg-2); border-radius: 12px; padding: 10px; border: 1px solid var(--line); }
.recap b { display: block; font-family: var(--f-mono); font-size: 16px; }
.recap small { color: var(--muted); font-size: 11px; }
@media (max-width: 560px) { .recap { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.menu-wrap { position: relative; margin-left: auto; }

.ev-title { font-size: clamp(18px, 6.4cqi, 30px); overflow-wrap: anywhere; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; text-shadow: 0 2px 18px rgb(0 0 0 / .6); }

.cd b { display: block; font-family: var(--f-mono); font-size: clamp(18px, 3.2vw, 26px); font-weight: 700; line-height: 1.1; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

.ev-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

/* ---------- Events page ---------- */
.ev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

.ev-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); text-align: left; width: 100%; transition: border-color .2s; }

/* ---------- Studio ---------- */

.screen { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--r-lg); overflow: hidden; background: #05040a; border: 1px solid var(--line-2); isolation: isolate; }

  background: radial-gradient(circle at 30% 40%, color-mix(in oklab, var(--gc) 75%, transparent), transparent 55%), radial-gradient(circle at 80% 70%, color-mix(in oklab, var(--pink) 45%, transparent), transparent 50%), linear-gradient(135deg, #0d0a22, #05040a);
  animation: drift 12s ease-in-out infinite alternate; background-size: 140% 140%; }

.fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.burst { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); text-align: center; animation: burst 2.2s cubic-bezier(.2, .9, .2, 1) forwards; }
.burst .e { font-size: clamp(56px, 12vw, 120px); line-height: 1; filter: drop-shadow(0 10px 30px rgb(0 0 0 / .6)); }
.burst .t { font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 5vw, 48px); letter-spacing: .06em; text-transform: uppercase; color: #fff; padding: 4px 18px; border-radius: 12px; background: linear-gradient(90deg, var(--pink), var(--purple), var(--blue)); box-shadow: 0 0 40px -4px var(--pink); white-space: nowrap; }
@keyframes burst { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; } 30% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { transform: translate(-50%, -62%) scale(1); opacity: 0; } }
.particle { position: absolute; bottom: -40px; font-size: 26px; animation: floatup var(--d, 2.4s) ease-out forwards; }

  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

.msg { overflow-wrap: anywhere; animation: rise .2s ease both; line-height: 1.4; }
.msg b { font-weight: 800; }
.msg.sys { padding: 6px 10px; border-radius: 10px; background: color-mix(in oklab, var(--accent) 16%, transparent); border: 1px solid color-mix(in oklab, var(--accent) 35%, transparent); font-weight: 600; margin: 3px 0; }
.msg.gift { padding: 6px 10px; border-radius: 10px; background: color-mix(in oklab, var(--warn) 14%, transparent); border: 1px solid color-mix(in oklab, var(--warn) 35%, transparent); font-weight: 600; margin: 3px 0; }
.msg.hype { font-weight: 700; }
.msg.me b { color: var(--pink); }
.chat-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
.chat-form input { flex: 1; min-width: 0; }
.timeline { display: flex; flex-direction: column; gap: 0; max-height: 420px; overflow-y: auto; scrollbar-width: thin; }
.tl { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); animation: rise .25s ease both; }
.tl:last-child { border-bottom: 0; }
.tl .ico { width: 30px; height: 30px; flex: none; border-radius: 9px; display: grid; place-items: center; background: var(--bg-2); font-size: 15px; }
.tl > div { flex: 1; min-width: 0; font-size: 13.5px; }
.tl time { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.tl .clipped { color: var(--good); font-size: 12px; font-weight: 700; }
.setup { padding: 20px; }
.setup h2 { font-size: 24px; margin-bottom: 4px; }
.live-pill { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 14px; background: color-mix(in oklab, var(--live) 18%, var(--surface)); border: 1px solid color-mix(in oklab, var(--live) 45%, transparent); text-decoration: none; font-weight: 700; font-size: 14px; margin-top: 10px; white-space: nowrap; }
.live-pill .pill-live { flex: none; }
.live-float { position: fixed; z-index: 44; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 14px 36px -10px var(--live); display: none; }
@media (max-width: 820px) { .live-float { display: flex; } }
.soon-banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-radius: var(--r-lg); margin-bottom: 16px; background: linear-gradient(100deg, color-mix(in oklab, var(--warn) 22%, var(--surface)), var(--surface)); border: 1px solid color-mix(in oklab, var(--warn) 45%, transparent); }
.soon-banner > div { flex: 1; min-width: 0; }
.soon-banner strong { font-family: var(--f-display); font-size: 17px; display: block; }
.summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 14px 0; }
@media (max-width: 560px) { .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.past-live { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.past-live > div:nth-child(2) { flex: 1; min-width: 0; }
.past-live strong { display: block; font-family: var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.poll-live { margin-top: 10px; padding: 12px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); }

/* ---------- Notifications ---------- */
.notif { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); width: 100%; text-align: left; transition: border-color .2s; }
.notif:hover { border-color: var(--line-2); }
.notif.unread { border-color: color-mix(in oklab, var(--accent) 55%, transparent); background: linear-gradient(100deg, color-mix(in oklab, var(--accent) 12%, var(--surface)), var(--surface)); }
.notif .ico { width: 38px; height: 38px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 18px; background: var(--bg-2); }
.notif > div { flex: 1; min-width: 0; }
.notif time { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ---------- Modal & toasts ---------- */
.modal { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgb(3 2 8 / .72); backdrop-filter: blur(6px); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.modal-card { width: min(640px, 100%); max-height: 100%; overflow-y: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: 0 30px 80px -20px rgb(0 0 0 / .8); animation: rise .25s; }
.modal-card.wide { width: min(900px, 100%); }
.modal-head { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: color-mix(in oklab, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 20px; flex: 1; min-width: 0; }
.modal-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { position: sticky; bottom: 0; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 16px; background: color-mix(in oklab, var(--surface) 94%, transparent); border-top: 1px solid var(--line); }
.cover-picks { display: flex; gap: 8px; flex-wrap: wrap; }
.cover-pick { width: 74px; height: 44px; border-radius: 10px; border: 2px solid transparent; background: var(--cover); background-size: cover; background-position: center; padding: 0; }
.cover-pick.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
.upload { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.confirm-box { padding: 12px; border-radius: 14px; border: 1px solid color-mix(in oklab, var(--live) 50%, transparent); background: color-mix(in oklab, var(--live) 10%, transparent); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.confirm-box span { flex: 1; min-width: 180px; font-weight: 600; }
.toasts { position: fixed; z-index: 90; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; width: min(360px, calc(100vw - 32px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line-2); box-shadow: 0 16px 40px -12px rgb(0 0 0 / .8); animation: slidein .3s ease both; font-size: 14px; font-weight: 600; }
.toast .ico { font-size: 20px; }
.toast.out { animation: slideout .3s forwards; }
@keyframes slidein { from { transform: translateX(30px); opacity: 0; } }
@keyframes slideout { to { transform: translateX(30px); opacity: 0; } }
.color-picks { display: flex; gap: 8px; }
.color-pick { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; }
.color-pick.on { border-color: #fff; }
.agenda-edit { display: flex; flex-direction: column; gap: 6px; }
.agenda-edit .row { flex-wrap: nowrap; }
.agenda-edit select, .agenda-edit input { min-width: 0; }
.watch { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 0; }
.watch .chat { height: auto; max-height: 420px; border-left: 1px solid var(--line); }
@media (max-width: 760px) { .watch { grid-template-columns: minmax(0, 1fr); } .watch .chat { height: 300px; border-left: 0; border-top: 1px solid var(--line); } }
.watch .screen { border-radius: 0; border: 0; }


/* ===================== Menu, relógio, explorar, mensagens, moderação ===================== */
.clock { display: flex; flex-direction: column; padding: 10px 14px; border-radius: 14px; background: linear-gradient(110deg, color-mix(in oklab, var(--accent) 16%, var(--surface)), var(--surface)); border: 1px solid var(--line); flex: none; }
.clock b { font-family: var(--f-mono); font-size: 24px; font-weight: 700; letter-spacing: .02em; line-height: 1.1; }
.clock small { color: var(--muted); font-size: 12px; font-weight: 600; }
.clock.big b { font-size: 30px; }
.create-wrap { position: relative; flex: none; }
.create-btn { width: 100%; justify-content: center; padding: 12px; }
.create-wrap .create-menu { position: absolute; left: 0; right: -40px; top: calc(100% + 8px); z-index: 30; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 16px; padding: 6px; box-shadow: 0 24px 60px -14px rgb(0 0 0 / .8); animation: rise .18s; }
.create-menu { display: flex; flex-direction: column; gap: 2px; }
.create-menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border: 0; background: transparent; border-radius: 12px; text-align: left; transition: background .15s; }
.create-menu button:hover { background: var(--surface-3); }
.create-menu b { display: block; font-size: 14px; }
.create-menu small { display: block; color: var(--muted); font-size: 12px; }
.cm-ico { width: 38px; height: 38px; flex: none; border-radius: 12px; display: grid; place-items: center; background: color-mix(in oklab, var(--c) 22%, transparent); color: var(--c); }
.cm-ico svg { width: 20px; height: 20px; }
.nav-groups { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 0 14px 4px; opacity: .8; }
.side .nav-link { padding: 9px 14px; }
.topbar { display: none; }
@media (max-width: 820px) {
  .topbar { display: flex; align-items: center; gap: 4px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 46;
    padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
    background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .topbar .logo { padding: 0; gap: 8px; }
  .topbar .logo-mark { width: 30px; height: 30px; border-radius: 9px; }
  .topbar .logo b { font-size: 18px; }
  .top-clock { margin-left: 8px; font-size: 13px; color: var(--fg-2); padding: 3px 8px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
  .top-ic { position: relative; }
  .top-ic .badge-count { position: absolute; top: 0; right: 0; margin: 0; min-width: 17px; height: 17px; font-size: 10px; }
  .topbar .pill-live { text-decoration: none; margin-right: 4px; }
  .bottom-nav { align-items: center; }
  .bottom-nav .nav-link { flex: 1; min-width: 0; justify-content: center; border: 0; background: transparent; position: relative; }
  .bottom-nav button.nav-link { color: var(--fg-2); font-weight: 600; }
  .bottom-nav .nav-link.on { background: transparent; }
  .bottom-nav .nav-link.on::after { content: ""; position: absolute; bottom: -2px; width: 18px; height: 3px; border-radius: 3px; background: var(--grad); }
  .nav-fab { width: 52px; height: 52px; flex: none; border-radius: 18px; border: 0; display: grid; place-items: center; color: #fff; background: var(--grad); box-shadow: 0 10px 26px -8px var(--purple); margin: -18px 4px 0; transition: transform .15s; }
  .nav-fab:active { transform: scale(.92); }
  .nav-fab svg { width: 26px; height: 26px; }
  main { padding-top: 12px; }
}
.modal.as-sheet { place-items: end center; padding: 0; }
.modal-card.sheet { width: min(560px, 100%); border-radius: 26px 26px 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); animation: sheetup .28s cubic-bezier(.2, .9, .2, 1); max-height: 92%; }
@keyframes sheetup { from { transform: translateY(40%); opacity: 0; } }
.sheet-grip { width: 44px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 10px auto 4px; }
.sheet-top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
.sheet-top .side-me-link { flex: 1; min-width: 180px; }
.sheet-body { padding: 12px 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.tile-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px; border-radius: 16px; background: var(--bg-2); border: 1px solid var(--line); text-decoration: none; font-weight: 700; font-size: 13px; transition: border-color .2s, transform .15s; }
.tile svg { width: 24px; height: 24px; color: var(--accent); }
.tile:active { transform: scale(.96); }
.tile.on { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 16%, var(--bg-2)); }
.tile .badge-count { position: absolute; top: 6px; right: 6px; margin: 0; }

/* Explorar */
.search-bar { position: relative; margin-bottom: 12px; }
.search-bar svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.search-bar .input { padding: 13px 14px 13px 44px; border-radius: 999px; font-size: 15px; }
.search-bar.small { margin: 0 12px 8px; }
.search-bar.small .input { padding: 9px 12px 9px 40px; font-size: 14px; }
.search-bar.small svg { left: 12px; width: 18px; height: 18px; }
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
.page-head + .search-bar + .chip-row { margin-bottom: 18px; }
.ex-sec { margin-bottom: 26px; }
.ex-title { font-size: 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.ex-title .num { font-size: 13px; color: var(--muted); font-weight: 500; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.cat { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; border-radius: 18px; border: 1px solid var(--line); text-align: left; overflow: hidden; background: radial-gradient(circle at 100% 0, color-mix(in oklab, var(--gc) 40%, transparent), transparent 65%), var(--surface); transition: transform .2s, border-color .2s; }
.cat:hover { transform: translateY(-3px); border-color: var(--gc); }
.cat b { font-family: var(--f-display); font-size: 16px; }
.cat small { color: var(--muted); font-size: 12px; }
.cat .pill-live { position: absolute; top: 12px; right: 12px; }
.creator-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.creator { overflow: hidden; display: flex; flex-direction: column; animation: rise .35s ease both; }
.creator-banner { height: 70px; background: var(--cover); background-size: cover; }
.creator-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.creator-body > .av { margin-top: -28px; box-shadow: 0 0 0 4px var(--surface); }
.creator-body > .av.ring-live { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--live); }
.creator-name { text-decoration: none; font-family: var(--f-display); font-size: 17px; }
.trend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.trend-card { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: left; transition: border-color .2s; }
.trend-card:hover { border-color: var(--blue); }
.trend-card b { color: var(--blue); font-size: 16px; }
.trend-card small { color: var(--muted); font-size: 12px; }

/* Mensagens */
.dm { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 14px; height: calc(100vh - 80px); min-height: 480px; }
.dm-list { display: flex; flex-direction: column; overflow: hidden; }
.dm-list-head { display: flex; align-items: center; padding: 14px 12px 10px 16px; }
.dm-list-head h1 { font-size: 24px; flex: 1; }
.dm-threads { flex: 1; overflow-y: auto; padding: 0 6px; scrollbar-width: thin; }
.dm-row { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; text-decoration: none; transition: background .15s; }
.dm-row:hover { background: var(--surface-2); }
.dm-row.on { background: color-mix(in oklab, var(--accent) 18%, var(--surface-2)); }
.dm-row > div { flex: 1; min-width: 0; }
.dm-row strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.dm-prev { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dm-row.unread .dm-prev { color: var(--fg); font-weight: 700; }
.dm-row .badge-count { margin: 0; }
.dm-pane { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.dm-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.dm-back { display: none; }
.dm-status { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.dm-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
.dm-msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; scrollbar-width: thin; }
.dm-day { align-self: center; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 10px; border-radius: 999px; background: var(--bg-2); margin: 8px 0; }
.bubble { max-width: min(78%, 520px); padding: 9px 13px 6px; border-radius: 18px; display: flex; flex-direction: column; gap: 4px; animation: rise .2s ease both; overflow-wrap: anywhere; }
.bubble time { font-size: 10.5px; opacity: .7; align-self: flex-end; font-family: var(--f-mono); }
.bubble.them { align-self: flex-start; background: var(--surface-3); border-bottom-left-radius: 6px; }
.bubble.me { align-self: flex-end; background: var(--grad); color: #fff; border-bottom-right-radius: 6px; }
.bubble.me .ht, .bubble.me .mn { color: #fff; text-decoration: underline; }
.bubble.typing { flex-direction: row; gap: 4px; padding: 12px 14px; }
.bubble.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-2); animation: blink 1.2s infinite; }
.bubble.typing span:nth-child(2) { animation-delay: .2s; }
.bubble.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
.dm-share { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 9px 11px; border-radius: 12px; border: 1px solid rgb(255 255 255 / .2); background: rgb(0 0 0 / .22); color: inherit; font-weight: 700; font-size: 13px; }
.dm-share small { font-weight: 600; opacity: .75; font-size: 11px; }
.dm-quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 12px 0; }
.dm-quick .chip { flex: none; }
.dm-form { display: flex; gap: 8px; padding: 10px 12px 12px; }
.dm-form input { flex: 1; min-width: 0; border-radius: 999px; }
.dm-form .btn { padding: 9px 14px; }
.dm-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 30px; }
.dm-empty > svg { width: 48px; height: 48px; color: var(--accent); }
.dm-empty b { font-family: var(--f-display); font-size: 20px; }
.dm-pick { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px; border: 0; background: transparent; width: 100%; text-align: left; }
.dm-pick:hover { background: var(--surface-2); }
.dm-pick > span:nth-child(2) { flex: 1; min-width: 0; }
.dm-pick small { display: block; color: var(--muted); }
@media (max-width: 820px) {
  .dm { grid-template-columns: minmax(0, 1fr); height: calc(100dvh - 190px); min-height: 420px; }
  .dm.has-active .dm-list { display: none; }
  .dm:not(.has-active) .dm-pane { display: none; }
  .dm-back { display: inline-grid; }
}

/* Moderação */
.chat-badges { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 14px; }
.chat-badges:not(:empty) { padding: 6px 14px; border-bottom: 1px solid var(--line); }
.mini-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--surface-3); color: var(--fg-2); }
.chat-pinned { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; font-size: 13px; background: color-mix(in oklab, var(--accent) 14%, var(--surface)); border-bottom: 1px solid var(--line); }
.chat-pinned span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.chat-pinned .icon-btn { width: 28px; height: 28px; }
.msg { position: relative; border-radius: 8px; padding: 1px 4px; margin: 0 -4px; }
.msg[data-act] { cursor: pointer; }
.msg[data-act]:hover, .msg.open { background: var(--surface-2); }
.msg-time { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); margin-right: 6px; }
.msg-tools { display: none; position: absolute; right: 2px; top: 50%; transform: translateY(-50%); gap: 2px; padding: 2px; border-radius: 10px; background: var(--surface-3); border: 1px solid var(--line-2); box-shadow: 0 8px 20px -8px rgb(0 0 0 / .8); }
.msg:hover .msg-tools, .msg.open .msg-tools, .msg:focus-within .msg-tools { display: flex; }
.msg-tools button { width: 28px; height: 26px; border: 0; background: transparent; border-radius: 7px; font-size: 13px; }
.msg-tools button:hover { background: var(--surface-2); }
.msg.removed { color: var(--muted); font-style: italic; font-size: 12.5px; }
.msg.sys.modmsg { background: color-mix(in oklab, var(--blue) 14%, transparent); border-color: color-mix(in oklab, var(--blue) 35%, transparent); }
.mod-panel { display: flex; flex-direction: column; gap: 14px; }
.mod-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.mod-stats div { padding: 8px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); min-width: 0; }

const acc = id => id === 'me' ? S.me : (S.accounts.find(a => a.id === id) || { id, name: 'Conta fictícia', handle: 'conta', hue: 200, followers: 0 });
function avatar(a, size = 44, cls = '') {
  const initials = esc((a.name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase());
  const inner = a.avatar ? `<img src="${a.avatar}" alt="">` : initials;
  return `<a class="av ${cls}" href="#${a.id === 'me' ? 'perfil' : 'conta-' + a.id}" style="--s:${size}px;--h:${a.hue || 270}" aria-label="Perfil de ${esc(a.name)}">${inner}</a>`;
}
const nameLine = a => `<strong>${esc(a.name)}</strong>${a.verified ? VERIFIED : ''}`;
const gicon = (g, size = 28) => { const G = GAMES[g] || GAMES.chat; return `<span class="gicon" style="--gc:${G.color};--s:${size}px" title="${esc(G.name)}">${G.glyph}</span>`; };
const followingCount = () => S.me.followingBase + S.accounts.filter(a => a.followed).length;
const totalLives = () => S.lives.length + 24; // 24 lives anteriores à app (simuladas)
const totalViews = () => S.me.viewsBase + S.lives.reduce((s, l) => s + (l.views || 0), 0);
function career(xp = S.me.xp) {
  let i = 0; while (i + 1 < CAREER.length && xp >= CAREER[i + 1][0]) i++;
  const cur = CAREER[i][0], next = CAREER[i + 1] ? CAREER[i + 1][0] : null;
  return { level: i + 1, name: CAREER[i][1], xp, cur, next, pct: next ? (xp - cur) / (next - cur) * 100 : 100 };
}
function addXP(n) {
  const before = career().level; S.me.xp += Math.round(n);
  const after = career();
  if (after.level > before) { notify('🎖️', `Subiste para o nível de carreira ${after.level}: ${after.name}!`); toast('🎖️', `Nível ${after.level} — ${after.name}`); }
}
function coverCSS(c) {
  if (!c) return COVERS[0];
  if (c.type === 'img') return `url("${c.v}") center/cover`;
  return COVERS[c.v % COVERS.length];
}

/* ---------- Notificações e toasts ---------- */
function notify(ic, text, link) {
  S.notifs.unshift({ id: uid(), icon: ic, text, t: Date.now(), read: false, link: link || null });
  S.notifs = S.notifs.slice(0, 120);
  save(); paintBadges();
}
function toast(ic, text, ms = 3600) {
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast'; el.innerHTML = `<span class="ico">${ic}</span><span>${esc(text)}</span>`;
  box.prepend(el);
  while (box.children.length > 4) box.lastChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, ms);
}

/* ---------- Conquistas ---------- */
function unlock(id) {
  if (S.ach[id]) return;
  const a = ACHIEVEMENTS.find(x => x.id === id); if (!a) return;
  S.ach[id] = Date.now();
  addXP(80);
  notify(a.icon, `Conquista desbloqueada: ${a.name}. Podes anunciá-la no feed.`, { ach: id });
  toast(a.icon, `Conquista desbloqueada: ${a.name}`);
  if (S.live) addTimeline('achievement', `Conquista desbloqueada: ${a.name}`, a.icon);
  save();
}
function checkAch() {
  const mine = S.posts.filter(p => p.author === 'me' && p.status === 'published');
  if (mine.length) unlock('first_post');
  if (S.pinned) unlock('pinned');
  if (S.events.some(e => e.owner === 'me')) unlock('first_event');
  if (S.events.some(e => e.owner === 'me' && e.interested >= 1000)) unlock('event_1k');
  if (S.lives.length || S.live) unlock('first_live');
  const peak = Math.max(0, ...S.lives.map(l => l.peak), S.live ? S.live.peak : 0);
  if (peak >= 1000) unlock('live_1k');
  if (peak >= 10000) unlock('live_10k');
  if (peak >= 100000) unlock('live_100k');
  if (S.stats.reactions >= 25) unlock('reactions_25');
  if (S.stats.clipsMade >= 1) unlock('first_clip');
  if (S.stats.clipsMade >= 10) unlock('clips_10');
  if (S.stats.polls >= 1) unlock('poll');
  if (S.me.followers >= 25000) unlock('followers_25k');
  if (S.live && S.live.gifts >= 10000) unlock('gifts_10k');
}

/* ---------- Eventos: estado e simulação ---------- */
function eventStatus(ev, now = Date.now()) {
  if (ev.cancelled) return 'cancelled';
  if (ev.owner === 'me') {
    if (S.live && S.live.eventId === ev.id) return 'live';
    if (ev.endedAt) return 'ended';
    if (now < ev.start - 5 * MIN) return 'scheduled';
    if (now < ev.start + 6 * HOUR) return 'soon';
    return 'ended';
  }
  if (now < ev.start) return 'scheduled';
  if (now < ev.start + (ev.dur || 2 * HOUR)) return 'live';
  return 'ended';
}
const STATUS_LABEL = { scheduled: 'Agendado', soon: 'A começar em breve', live: 'Em direto', ended: 'Terminado', cancelled: 'Cancelado' };

function simulateEvents(now) {
  for (const ev of S.events) {
    const st = eventStatus(ev, now);
    const lvl = LEVELS[ev.level] || LEVELS.media;
    if (st === 'scheduled' || st === 'soon') {
      const cap = lvl.max * 0.22;
      if (ev.interested < cap && Math.random() < .55) {
        ev.interested += Math.max(1, Math.round(rand(.2, 1) * lvl.max / 3500 * (MODES[ev.mode]?.hype || 1)));
        ev.reminderUsers = Math.round(ev.interested * .42);
      }
    }
    if (ev.owner === 'me') ownEventNotifications(ev, st, now);
    else if (ev.myReminder) otherEventNotifications(ev, st, now);
  }
}
function ownEventNotifications(ev, st, now) {
  const n = ev.notified || (ev.notified = {});
  const left = ev.start - now;
  const lvl = LEVELS[ev.level] || LEVELS.media;
  const link = { ev: ev.id };
  if (st === 'cancelled' || st === 'ended') return;
  if (ev.interested >= 1000 && !n.k1) { n.k1 = 1; notify('🔔', `1.000 utilizadores fictícios estão interessados no teu evento «${ev.title}».`, link); toast('🔔', '1.000 utilizadores fictícios interessados no teu evento!'); checkAch(); }
  if (ev.interested >= Math.max(2500, lvl.max * .05) && !n.trend) { n.trend = 1; notify('📈', `O teu evento «${ev.title}» está a ser tendência na simulação.`, link); toast('📈', 'O teu evento está a ser tendência na simulação.'); }
  if (!ev.reminders) return;
  if (left <= 30 * MIN && left > 5 * MIN && !n.m30) { n.m30 = 1; notify('⏰', `O teu evento «${ev.title}» começa daqui a 30 minutos!`, link); toast('⏰', 'O teu evento começa daqui a 30 minutos!'); }
  if (left <= 5 * MIN && left > 0 && !n.m5) { n.m5 = 1; n.m30 = 1; notify('⏰', `O teu evento «${ev.title}» começa daqui a 5 minutos!`, link); toast('⏰', 'O teu evento começa daqui a 5 minutos!'); }
  if (left <= 0 && st === 'soon' && !n.start) { n.start = 1; n.m5 = 1; n.m30 = 1; notify('🎬', `Chegou a hora de «${ev.title}». Carrega em «Começar live».`, link); toast('🎬', 'Chegou a hora do teu evento! Começa a live.'); }
  if (left <= -2 * MIN && st === 'soon' && !n.wait) { n.wait = 1; notify('👥', 'A tua comunidade está à espera da tua live!', link); toast('👥', 'A tua comunidade está à espera da tua live!'); }
}
function otherEventNotifications(ev, st, now) {
  const n = ev.notified || (ev.notified = {});
  const a = acc(ev.owner), left = ev.start - now, link = { ev: ev.id };
  if (st === 'scheduled' && left <= 30 * MIN && !n.m30) { n.m30 = 1; notify('⏰', `${a.name} entra em direto daqui a 30 minutos: «${ev.title}».`, link); }
  if (st === 'live' && !n.live) { n.live = 1; n.m30 = 1; notify('🔴', `${a.name} está agora em direto: «${ev.title}».`, link); toast('🔴', `${a.name} está em direto!`); }
}

function eventPostText(ev) {
  const lvl = LEVELS[ev.level] || LEVELS.media;
  const when = dayLabel(ev.start).toUpperCase();
  return `🎮 LIVE ${when} — ${hhmm(ev.start)}\n\n${ev.title} 🔥\n\n${ev.desc}\n\nO objetivo: chegar aos ${dots(lvl.max)} espectadores virtuais!\n\nVenham participar na simulação, votar no chat, enviar presentes virtuais e acompanhar a diversão. #${(GAMES[ev.game]?.name || 'live').replace(/[^\p{L}\d]/gu, '').toLowerCase()} #LiveVerse`;
}

const UI = {

  if (['feed', 'eventos', 'estudio', 'clips', 'notificacoes', 'explorar', 'mensagens'].includes(h)) return { name: h };

function postText(p) { if (p.type === 'event' && p.text == null) { const ev = S.events.find(e => e.id === p.eventId); return ev ? eventPostText(ev) : ''; } return p.text || ''; }

/* ---------- Cartão de publicação ---------- */
const KIND = { game: '🎮 Anúncio de jogo', live: '🔴 Anúncio de live', event: '📅 Evento', poll: '📊 Sondagem', achievement: '🏆 Conquista', photo: '🖼️ Foto', clip: '🎬 Clip' };
function postCard(p) {
  const a = acc(p.author), mine = p.author === 'me', pinned = S.pinned === p.id;
  const text = postText(p);
  let extra = '';

    extra = `<div class="game-strip" style="--gc:${G.color}">${gicon(p.game, 44)}<div><span class="small muted">${p.type === 'live' ? (isLive ? 'Em direto agora' : 'Live anunciada') : 'A jogar'}</span><strong>${esc(G.name)}</strong></div>${isLive ? `<a class="btn btn-live btn-sm" href="#estudio" style="margin-left:auto">${icon('studio')} Estúdio</a>` : p.type === 'live' ? '<span class="pill-state" style="margin-left:auto">LIVE</span>' : ''}</div>`;
  }
  if (p.type === 'poll' && p.poll) {
    const total = p.poll.options.reduce((s, o) => s + o.v, 0) || 1; const done = p.poll.myVote != null || Date.now() > p.poll.ends;
    extra = `<div class="poll">${p.poll.options.map((o, i) => done
      ? `<div class="poll-opt ${p.poll.myVote === i ? 'mine' : ''}"><i style="width:${(o.v / total * 100).toFixed(1)}%"></i><span>${esc(o.t)}${p.poll.myVote === i ? ' ✓' : ''}</span><b class="num">${Math.round(o.v / total * 100)}%</b></div>`
      : `<button class="poll-opt" data-act="vote" data-id="${p.id}" data-i="${i}"><span>${esc(o.t)}</span></button>`).join('')}
      <span class="tiny muted">${dots(total)} votos ${SIM('fictícios')} · ${Date.now() > p.poll.ends ? 'Sondagem terminada' : 'Termina em ' + cdShort(p.poll.ends - Date.now())}</span></div>`;
  }
  if (p.type === 'achievement') { const x = ACHIEVEMENTS.find(z => z.id === p.achId); if (x) extra = `<div class="ach-banner"><span class="ach-ico">${x.icon}</span><div><span class="tiny muted">CONQUISTA DESBLOQUEADA</span><strong>${esc(x.name)}</strong><span class="small muted">${esc(x.desc)}</span></div></div>`; }
  if (p.type === 'photo' && p.img) extra = `<div class="post-media"><img src="${p.img}" alt="Fotografia publicada" loading="lazy"></div>`;
  if (p.type === 'clip') { const c = S.clips.find(z => z.id === p.clipId); if (c) extra = clipMini(c); }
  if (p.recap) extra += `<div class="recap"><div><b>${fmt(p.recap.peak)}</b><small>pico de espectadores</small></div><div><b>${fmt(p.recap.followers)}</b><small>novos seguidores</small></div><div><b>${fmt(p.recap.gifts)}</b><small>moedas virtuais</small></div><div><b>${durLabel(p.recap.dur)}</b><small>duração</small></div></div><span class="tiny muted">Resumo de live simulada ${SIM()}</span>`;
  const open = UI.openReplies.has(p.id);
  return `<article class="card post ${pinned ? 'pinned' : ''}" data-post="${p.id}">
    ${avatar(a, 46)}
    <div class="post-body">
      ${pinned ? `<div class="post-meta-top">${icon('pin')} Publicação fixada</div>` : p.reposted ? `<div class="post-meta-top">${icon('repost')} Repostaste</div>` : ''}
      <div class="post-head"><a href="#${mine ? 'perfil' : 'conta-' + a.id}">${nameLine(a)}</a><span class="muted">@${esc(a.handle)} · <time data-ago="${p.createdAt}" title="${new Date(p.createdAt).toLocaleString('pt-PT')}">${ago(p.createdAt)}</time></span>${KIND[p.type] ? `<span class="post-kind">${KIND[p.type]}</span>` : ''}
        <div class="menu-wrap"><button class="icon-btn" data-act="menu" data-id="${p.id}" aria-label="Mais opções">${icon('more')}</button>${UI.menu === p.id ? postMenu(p) : ''}</div></div>
      ${text ? `<p class="post-text">${richText(text)}</p>` : ''}
      ${extra}
      <div class="post-actions">
        <button class="pa" data-act="reply-toggle" data-id="${p.id}" aria-label="Responder">${icon('reply')}<span>${fmt(p.replies.length + (p.replyBase || 0))}</span></button>
        <button class="pa rp ${p.reposted ? 'on' : ''}" data-act="repost" data-id="${p.id}" aria-label="Repostar">${icon('repost')}<span>${fmt(p.reposts)}</span></button>
        <button class="pa like ${p.liked ? 'on' : ''}" data-act="like" data-id="${p.id}" aria-label="Gostar">${icon('heart')}<span>${fmt(p.likes)}</span></button>
        <button class="pa save ${p.saved ? 'on' : ''}" data-act="save" data-id="${p.id}" aria-label="Guardar">${icon('save')}</button>
        ${mine ? `<button class="pa pin ${pinned ? 'on' : ''}" data-act="pin" data-id="${p.id}" aria-label="${pinned ? 'Desafixar' : 'Fixar no perfil'}">${icon('pin')}</button>` : ''}
        <span class="pa views" title="Visualizações simuladas">${icon('eye')}<span data-views="${p.id}">${fmt(p.views)}</span></span>
      </div>
      ${open ? `<div class="replies">${p.replies.map(r => { const ra = acc(r.author); return `<div class="reply">${avatar(ra, 30)}<div><strong>${esc(ra.name)}</strong> <time class="muted tiny" data-ago="${r.t}">${ago(r.t)}</time><br>${richText(r.text)}</div></div>`; }).join('')}
        <form class="reply-form" data-form="reply" data-id="${p.id}"><input class="input" id="reply-${p.id}" name="t" maxlength="280" placeholder="Escreve uma resposta…" autocomplete="off"><button class="btn btn-sm btn-primary">Responder</button></form></div>` : ''}

function postMenu(p) {

  return `<div class="menu">
    ${mine ? `<button data-act="pin" data-id="${p.id}">${icon('pin')} ${S.pinned === p.id ? 'Desafixar do perfil' : 'Fixar no perfil'}</button>` : `<button data-act="follow" data-id="${p.author}">${icon('users')} ${acc(p.author).followed ? 'Deixar de seguir' : 'Seguir'} @${esc(acc(p.author).handle)}</button>`}

}

/* ---------- Cartão de evento (premium) ---------- */
function eventCard(ev, opts = {}) {
  const st = eventStatus(ev), a = acc(ev.owner), G = GAMES[ev.game] || GAMES.chat, M = MODES[ev.mode] || MODES.casual, L = LEVELS[ev.level] || LEVELS.media;
  const mine = ev.owner === 'me', now = Date.now();
  const whenTxt = st === 'live' ? '<span class="pill-live">EM DIRETO</span>' : st === 'soon' ? '<span class="pill-soon">A COMEÇAR EM BREVE</span>' : st === 'cancelled' ? '<span class="pill-state">CANCELADO</span>' : st === 'ended' ? '<span class="pill-state">TERMINADO</span>'
    : `<span class="ev-when">🎮 LIVE ${dayLabel(ev.start).toUpperCase()} — ${hhmm(ev.start)}</span>`;
  let mid;
  if (st === 'scheduled' && ev.countdown) {
    const { d, h, m, s } = cdParts(ev.start - now);
    mid = `<div class="cd" data-cd="${ev.start}" aria-label="Contagem decrescente"><div><b data-p="d">${pad(d)}</b><small>dias</small></div><div><b data-p="h">${pad(h)}</b><small>horas</small></div><div><b data-p="m">${pad(m)}</b><small>min</small></div><div><b data-p="s">${pad(s)}</b><small>seg</small></div></div>`;
  } else if (st === 'scheduled') mid = `<div class="cd-state off">${whenLabel(ev.start).toUpperCase()}</div>`;
  else if (st === 'soon') mid = `<div class="cd-state soon">A COMEÇAR EM BREVE</div>`;
  else if (st === 'live') mid = `<div class="cd-state live">EM DIRETO · <span data-watchers="${ev.id}">${fmt(mine ? S.live.viewers : (ev.viewers || 1000))}</span> espectadores virtuais</div>`;
  else if (st === 'cancelled') mid = `<div class="cd-state off">EVENTO CANCELADO</div>`;
  else mid = `<div class="cd-state off">TERMINADO${ev.peak ? ' · PICO DE ' + fmt(ev.peak) : ''}</div>`;
  const faces = S.accounts.slice(0, 4).map(x => avatar(x, 24).replace('<a ', '<span ').replace('</a>', '</span>')).join('');
  let actions = '';
  if (st === 'scheduled' || st === 'soon') actions += `<button class="btn ${ev.myReminder ? '' : 'btn-primary'}" data-act="remind" data-id="${ev.id}">${icon(ev.myReminder ? 'check' : 'bell')} ${ev.myReminder ? 'LEMBRETE ATIVO' : 'LEMBRAR-ME'}</button>`;
  if (!opts.inModal) actions += `<button class="btn" data-act="event-open" data-id="${ev.id}">${icon('eye')} VER EVENTO</button>`;
  if (mine && st === 'soon') actions += `<button class="btn btn-live" data-act="start-event" data-id="${ev.id}">${icon('studio')} COMEÇAR LIVE</button>`;
  if (mine && st === 'live') actions += `<a class="btn btn-live" href="#estudio">${icon('studio')} IR PARA O ESTÚDIO</a>`;
  if (!mine && st === 'live') actions += `<button class="btn btn-live" data-act="watch" data-id="${ev.id}">${icon('play')} ASSISTIR</button>`;
  return `<div class="ev-card ${opts.standalone ? 'standalone' : ''} ${st === 'cancelled' ? 'ev-cancelled' : ''}">
    <div class="ev-cover" style="--cover:${esc(coverCSS(ev.cover))}"><div class="grid-lines"></div>
      <div class="ev-top">${whenTxt}<span class="ev-mode">MODO ${esc(M.name.toUpperCase())}</span></div>
      <div><div class="ev-title">${esc(ev.title)} ${st === 'scheduled' || st === 'soon' ? '🔥' : ''}</div>
        <div class="ev-sub">${gicon(ev.game, 26)}<span>${esc(G.name)}</span><span>·</span><span>${mine ? 'O teu evento' : '@' + esc(a.handle)}</span></div></div>
    </div>
    <div class="ev-info">
      ${mid}
      <div class="ev-stats">
        <div><small>Meta de audiência</small><b>Até ${fmt(L.max)}</b><small>espectadores virtuais</small></div>
        <div><small>Interessados ${SIM()}</small><b data-int="${ev.id}">${dots(ev.interested)}</b><small>pessoas fictícias</small></div>
        <div><small>Lembretes ${SIM('sim.')}</small><b data-rem="${ev.id}">${dots(ev.reminderUsers || 0)}</b><small>${ev.reminders ? 'ativos' : 'desligados'}</small></div>
      </div>
      <div class="ev-faces"><span class="faces">${faces}</span><span><b data-int="${ev.id}">${dots(ev.interested)}</b> pessoas fictícias interessadas${ev.myInterest ? ', incluindo tu' : ''}</span></div>
      ${actions ? `<div class="ev-actions">${actions}</div>` : ''}
    </div></div>`;
}

      <span class="sim-tag">${c.media ? 'Media tua' : 'Clip simulado'}</span>${gicon(c.game, 26)}<span class="dur">0:${pad(c.secs || 30)}</span><span class="play">${icon('play')}</span></div>
    <div class="clip-body">
      <strong>${esc(c.title)}</strong>

        ${c.streamer === 'me' ? `<button class="pa ${c.onProfile ? 'pin on' : ''}" data-act="clip-profile" data-id="${c.id}" title="${c.onProfile ? 'Remover do perfil' : 'Adicionar ao perfil'}">${icon(c.onProfile ? 'check' : 'plus')}<span>${c.onProfile ? 'No perfil' : 'Perfil'}</span></button>` : ''}

        ${c.streamer === 'me' ? `<div class="row"><label class="btn btn-xs upload">${icon('image')} Anexar a minha media<input type="file" accept="video/*,image/*" data-file="clip-media" data-id="${c.id}" id="cm-${c.id}"></label>${c.streamer === 'me' ? `<button class="btn btn-xs btn-danger" data-act="clip-del" data-id="${c.id}">${icon('trash')} Eliminar</button>` : ''}</div><span class="tiny muted">Vídeos anexados ficam só nesta sessão do navegador.</span>` : ''}</div>` : ''}
    </div></article>`;
}
function clipCommentList(c) {
  const seedTxt = ['MOMENTO LENDÁRIO', 'vi isto em direto 😭', 'replay infinito', 'isto merece 1M de views', 'o chat foi à loucura', 'top clip'];
  const base = seedTxt.slice(0, 3).map((t, i) => ({ u: NAME_A[(c.id.charCodeAt(1) + i) % NAME_A.length] + NAME_B[i], t }));
  return [...base, ...(c.commentsList || [])];
}
function clipMini(c) {
  const G = GAMES[c.game] || GAMES.chat;
  return `<div class="clip-mini"><div class="clip-thumb" style="--gc:${G.color}"><span class="emo">${c.emoji || '🎬'}</span><span class="dur">0:${pad(c.secs || 30)}</span></div>
    <div><span class="tiny muted">CLIP SIMULADO · ${esc(G.name.toUpperCase())}</span><strong style="display:block;font-family:var(--f-display)">${esc(c.title)}</strong><span class="small muted">${esc(c.type)} · ${fmt(c.likes)} gostos · popularidade ${c.popularity}</span></div></div>`;
}
function viewClips() {
  let list = [...S.clips].sort((a, b) => b.createdAt - a.createdAt);

}
