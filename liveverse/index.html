.pill-live { background: var(--live); border-radius: 4px; letter-spacing: .06em; }
.pill-soon { border-radius: 4px; }
.tab.on::after { background: var(--purple); }
.ev-mode { background: var(--purple); box-shadow: none; }
.cd b { background: none; -webkit-background-clip: border-box; background-clip: border-box; color: var(--fg); }
.goal-bar i { background: var(--purple); }
.lvl { background: var(--surface-2); }
.lvl-num { background: var(--purple); }
.prof-top .av { box-shadow: 0 0 0 5px var(--surface), 0 0 0 8px var(--purple); }
.post-text .ht, .trend-card b { color: var(--purple-soft); }
.post-text .mn { color: var(--purple-soft); }
.bubble.me { background: var(--purple); }
.nav-fab { background: var(--purple); box-shadow: 0 8px 22px -8px var(--purple); border-radius: 14px; }
.create-btn { border-radius: 6px; }
.rbtn { border-radius: 8px; background: var(--surface-2); }
.rbtn:hover { background: color-mix(in oklab, var(--purple) 18%, var(--surface-2)); box-shadow: none; }
.screen { border-radius: 8px; border-color: #000; background: #000; }
.chat { border-radius: 8px; }
.chat-head { background: var(--surface); }
.chat-list { background: var(--surface); }
.msg.sys { background: color-mix(in oklab, var(--purple) 18%, transparent); border-color: color-mix(in oklab, var(--purple) 40%, transparent); }
.surprise, .soon-banner { border-radius: var(--r-lg); }
.modal-card { border-radius: 10px; background: var(--surface); }
.toast { border-radius: 8px; background: var(--surface-3); }
.simbar { background: var(--bg-2); }
.topbar { background: var(--surface); }
.bottom-nav { background: var(--surface); }
.scene-btn.on { background: color-mix(in oklab, var(--purple) 26%, var(--bg-2)); border-color: var(--purple); box-shadow: none; }
.cam { background: var(--purple); }
.alert { box-shadow: 0 0 40px -6px var(--ac, var(--purple)); }
.train { background: linear-gradient(90deg, color-mix(in oklab, var(--purple) 70%, rgb(0 0 0 / .7)), rgb(0 0 0 / .7)); box-shadow: 0 0 24px -4px var(--purple); }
.live-pill { border-radius: 6px; }
/* Canais na barra lateral */
.side-channels { display: flex; flex-direction: column; gap: 1px; margin-top: 4px; }
.side-channels .nav-label { padding-top: 6px; }
.chan { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px; text-decoration: none; border: 0; background: transparent; width: 100%; text-align: left; }
.chan:hover { background: var(--surface-2); }
.chan > span:nth-child(2) { flex: 1; min-width: 0; line-height: 1.25; }
.chan strong { display: block; font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chan small { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chan-v { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--fg-2); white-space: nowrap; }
.chan-v i { width: 8px; height: 8px; border-radius: 50%; background: var(--live); }
.chan-off { font-size: 12.5px; color: var(--muted); }
.chan .av.off { filter: grayscale(.85); opacity: .7; }

/* ===================== Live limpa ===================== */
.live-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 14px; margin-bottom: 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.lt-title { min-width: 0; max-width: 260px; }
.lt-title strong { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lt-title small { color: var(--muted); font-size: 12px; }
.lt-stat { position: relative; display: flex; flex-direction: column; min-width: 92px; }
.lt-stat small { font-size: 11px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 4px; }
.lt-stat b { font-size: 24px; font-weight: 800; line-height: 1.1; color: var(--fg); transition: color .3s; }
.lt-fol b { color: var(--purple-soft); }
.lt-spark { width: 160px; height: 40px; flex: none; }
.lt-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.controls-panel { margin-top: 12px; }
.bump { animation: bump .5s ease; }
@keyframes bump { 30% { transform: scale(1.12); color: #8af5e4; } }
.lt-fol .bump, .hud-num .bump { animation-name: bumpp; }
@keyframes bumpp { 30% { transform: scale(1.14); color: #e3ceff; } }
.num-pop { position: absolute; right: -6px; top: -4px; font-family: var(--f-mono); font-size: 12px; font-weight: 800; color: #3ef2d6; pointer-events: none; animation: numpop 1.4s ease-out forwards; white-space: nowrap; text-shadow: 0 2px 8px rgb(0 0 0 / .6); }
.num-pop.fol { color: #d6b8ff; }
@keyframes numpop { 0% { transform: translate(0, 6px) scale(.7); opacity: 0; } 15% { transform: translate(0, 0) scale(1.1); opacity: 1; } 100% { transform: translate(6px, -26px) scale(1); opacity: 0; } }
.hud-num { position: relative; display: inline-flex; align-items: center; gap: 6px; font-size: 14px !important; }
.hud-num b { font-size: 15px; display: inline-block; }
.hud-num .num-pop { top: -14px; right: -2px; }
.theater-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding: 8px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.tb-reacts { display: flex; gap: 6px; flex-wrap: wrap; }
.tb-scene { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.tb-scene svg { width: 18px; height: 18px; }
.tb-scene select { width: auto; padding: 7px 10px; font-weight: 700; }
.studio.theater .theater-bar { margin-top: 0; }
.fol-big { font-size: clamp(54px, 12vw, 120px); font-weight: 900; line-height: 1; color: #fff; text-shadow: 0 0 50px var(--purple); position: relative; display: inline-block; }
.fol-big .num-pop, .scene-card .num-pop { font-size: 22px; top: -10px; right: -40px; }
.fol-goal { width: min(320px, 70%); display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.fol-goal .goal-bar { height: 10px; background: rgb(255 255 255 / .15); }
.fol-list { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 90%; font-size: 12px; }
.fol-list span { padding: 3px 9px; border-radius: 999px; background: rgb(0 0 0 / .35); border: 1px solid rgb(255 255 255 / .15); animation: rise .3s; }
.screen .hud .sim-tag { opacity: .85; }
@media (max-width: 760px) {
  .live-top { gap: 10px; padding: 8px 10px; }
  .lt-title { max-width: none; flex: 1 1 100%; }
  .lt-stat b { font-size: 20px; }
  .lt-spark { width: 110px; height: 34px; }
  .lt-actions { width: 100%; }
  .lt-actions .btn { flex: 1; justify-content: center; padding-inline: 8px; }
  .studio-main > .theater-bar { order: 1; }
  .studio-main > [data-surprise] { order: 1; }
  .tb-react { width: 40px; height: 38px; font-size: 18px; }
}
@media (max-width: 560px) { .hud-num { font-size: 12px !important; } .hud-num b { font-size: 13px; } }

.live-top { flex-wrap: nowrap; }
.lt-actions { margin-left: auto; flex-wrap: nowrap; }
.lt-spark { width: 130px; }
.theater-bar .tb-full { display: none; }
.studio.theater .theater-bar .tb-full { display: inline-flex; }
@media (max-width: 1100px) { .live-top { flex-wrap: wrap; } }
@media (max-width: 760px) {
  .live-top { flex-wrap: wrap; row-gap: 8px; }
  .lt-title { display: none; }
  .lt-stat { min-width: 0; }
  .lt-spark { flex: 1; min-width: 60px; width: auto; height: 34px; }
  .lt-actions { width: 100%; margin-left: 0; }
  .lt-actions .btn { font-size: 13px; padding: 8px 6px; gap: 5px; }
  .lt-actions .btn svg { width: 16px; height: 16px; }
  .tb-reacts { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; width: 100%; }
  .tb-react { flex: none; }
  .theater-bar .spacer { display: none; }
  .tb-scene { flex: 1; }
  .tb-scene select { width: 100%; }
}

/* ===================== Página inicial, canal e chat ao estilo de plataforma de streaming ===================== */
.tw-tabs { display: flex; gap: 22px; margin: 0 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tw-tabs button { border: 0; background: none; padding: 10px 0 12px; font-size: 18px; font-weight: 700; color: var(--muted); position: relative; white-space: nowrap; }
.tw-tabs button.on { color: var(--fg); }
.tw-tabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; border-radius: 2px; background: var(--purple); }
.tw-cats { margin-bottom: 14px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.tw-cats .chip { flex: none; border-radius: 999px; padding: 7px 14px; font-size: 14px; }
.tw-cats .chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 22px 16px; margin-bottom: 24px; }
.tw-card { min-width: 0; animation: rise .3s ease both; }
.tw-thumb { position: relative; display: block; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 6px; overflow: hidden; background: #000; text-decoration: none; transition: transform .15s, box-shadow .15s; }
.tw-thumb:hover { transform: translate(4px, -4px); box-shadow: -4px 4px 0 var(--purple); }
.tw-thumb-bg { position: absolute; inset: 0; background: radial-gradient(circle at 35% 45%, color-mix(in oklab, var(--gc) 80%, transparent), transparent 60%), radial-gradient(circle at 80% 80%, color-mix(in oklab, var(--purple) 50%, transparent), transparent 50%), linear-gradient(135deg, #15102a, #050407); }
.tw-thumb-glyph { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: clamp(28px, 6vw, 46px); letter-spacing: .02em; color: rgb(255 255 255 / .85); text-shadow: 0 0 30px var(--gc); }
.tw-thumb-cam { position: absolute; left: 6%; top: 10%; width: 22%; aspect-ratio: 4 / 3; border-radius: 4px; overflow: hidden; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 14px; background: linear-gradient(140deg, hsl(var(--h) 80% 60%), hsl(calc(var(--h) + 50) 75% 42%)); box-shadow: 0 0 0 2px rgb(0 0 0 / .5); }
.tw-thumb-cam img { width: 100%; height: 100%; object-fit: cover; }
.tw-live { position: absolute; right: 8px; top: 8px; display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 4px; background: rgb(0 0 0 / .65); color: #fff; font-size: 12.5px; font-weight: 600; }
.tw-live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--live); }
.tw-viewers { position: absolute; left: 8px; bottom: 8px; padding: 1px 6px; border-radius: 4px; background: rgb(0 0 0 / .65); color: #fff; font-size: 12.5px; font-weight: 600; }
.tw-meta { display: flex; gap: 10px; margin-top: 10px; }
.tw-meta > div { min-width: 0; }
.tw-name { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 15px; text-decoration: none; }
.tw-you { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--purple); color: #fff; }
.tw-title { margin: 1px 0 0; color: var(--fg-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tw-game { display: block; font-size: 13.5px; color: var(--muted); }
.tw-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.tw-tags span { padding: 2px 9px; border-radius: 999px; background: var(--surface-3); color: var(--fg-2); font-size: 12px; font-weight: 600; }
.tw-h { font-size: 18px; margin: 4px 0 12px; display: flex; gap: 8px; align-items: center; }
.tw-h .num { color: var(--muted); font-size: 14px; }
.tw-offline { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px; }
.tw-off { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; }
.tw-off:hover { background: var(--surface-2); }
.tw-off > span:nth-child(2) { flex: 1; min-width: 0; }
.tw-off strong, .tw-off small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tw-off small { color: var(--muted); font-size: 12.5px; }
.av.off { filter: grayscale(.9); opacity: .7; }

/* Página do canal */
.wp { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }

.wp-cam { position: absolute; left: 3%; top: 16%; width: 19%; aspect-ratio: 4 / 3; border-radius: 4px; overflow: hidden; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: clamp(14px, 2.4vw, 26px); background: linear-gradient(140deg, hsl(var(--h) 80% 60%), hsl(calc(var(--h) + 50) 75% 42%)); box-shadow: 0 0 0 2px rgb(0 0 0 / .55); }
.wp-cam img { width: 100%; height: 100%; object-fit: cover; }

.wp-offline strong { font-size: 20px; }

.wp-aud { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgb(0 0 0 / .5); color: #fff; }
.wp-bottom { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 12px; z-index: 3; color: #fff; text-shadow: 0 1px 4px rgb(0 0 0 / .9); }
.tw-uptime { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
.tw-uptime i { width: 9px; height: 9px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 2px rgb(0 0 0 / .4); animation: pulse 1.4s infinite; }
.tw-vw { position: relative; display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 700; }
.tw-vw svg { width: 17px; height: 17px; }
.tw-vw .num-pop { top: -18px; right: -14px; }
.wp-info { display: flex; flex-direction: column; gap: 10px; }
.wp-chan { display: flex; gap: 12px; align-items: flex-start; }
.wp-chan > div { min-width: 0; flex: 1; }
.wp-name { display: inline-flex; align-items: center; gap: 4px; font-size: 18px; font-weight: 800; text-decoration: none; }
.wp-title { margin: 2px 0; font-size: 15px; color: var(--fg); }
.wp-game { color: var(--purple-soft); font-size: 14px; text-decoration: none; font-weight: 600; }
.wp-actions { display: flex; gap: 8px; align-items: center; }
.wp-round { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 0; background: var(--surface-3); color: var(--fg); transition: transform .15s, background .2s; }
.wp-round svg { width: 20px; height: 20px; }
.wp-round:active { transform: scale(.9); }
.wp-round.on { background: var(--purple); color: #fff; }
.wp-gift { flex: 1; justify-content: center; border-radius: 999px; padding: 10px; }
.wp-sub { flex: 1; justify-content: center; border-radius: 999px; padding: 10px; }
.wp-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); height: calc(100vh - 64px); min-height: 420px; }
.wp-chatbox { height: 100%; position: relative; }
.chat { position: relative; }
.lb { display: flex; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; align-items: center; }
.lb-i { display: flex; align-items: center; gap: 6px; flex: none; }
.lb-medal { width: 22px; height: 26px; display: grid; place-items: center; font-size: 12px; color: #1b1300; clip-path: polygon(0 0, 100% 0, 100% 75%, 50% 100%, 0 75%); }
.lb-medal.m1 { background: #f5c33b; } .lb-medal.m2 { background: #c8ccd6; } .lb-medal.m3 { background: #d58b4c; }
.lb-i strong { display: block; font-size: 12.5px; max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-i small { display: flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--purple-soft); font-weight: 700; }

.drop { display: flex; gap: 10px; align-items: center; margin: 8px 10px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line-2); border-bottom: 3px solid var(--purple); }
.drop > div { flex: 1; min-width: 0; }
.drop b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drop small { display: block; font-size: 11.5px; color: var(--muted); }
.drop .goal-bar { height: 4px; margin-top: 4px; }
.drop-ic { font-size: 26px; flex: none; }
.more-pill { position: absolute; left: 50%; bottom: 66px; transform: translateX(-50%); z-index: 4; padding: 7px 14px; border-radius: 999px; border: 0; background: rgb(24 24 27 / .92); color: var(--fg); font-weight: 700; font-size: 13px; box-shadow: 0 6px 20px rgb(0 0 0 / .6); backdrop-filter: blur(6px); }
.msg.plain { color: var(--muted); padding: 4px 0; }
.cbadge.bot { margin-right: 3px; }
.tw-input { position: relative; display: flex; align-items: center; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
.tw-in-gift { width: 42px; height: 40px; flex: none; border-radius: 8px; border: 0; background: color-mix(in oklab, var(--good) 75%, #000); color: #fff; display: grid; place-items: center; }

.tw-in-wrap { position: relative; flex: 1; min-width: 0; }
.tw-in-wrap .input { padding-right: 40px; border-radius: 6px; }
.tw-in-emo { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; }

.cam { left: 12px; top: 12px; right: auto; bottom: auto; width: clamp(80px, 21%, 190px); aspect-ratio: 4 / 3; border-radius: 6px; padding: 2px; background: #000; box-shadow: 0 0 0 2px rgb(0 0 0 / .6), 0 10px 26px -10px #000; animation: none; }

.cam.talk { box-shadow: 0 0 0 2px var(--purple), 0 0 26px -2px var(--purple); }

.cam.cam-big { width: clamp(120px, 30%, 260px); }
.st-bottom { left: 12px; right: auto; }
.screen-chat { bottom: 46px; }
.train { left: auto; right: 12px; top: 40px; }
.hud { justify-content: flex-end; }
.bn-av { width: 24px; height: 24px; display: grid; place-items: center; }

function dayLabel(t) {
  const now = Date.now();
  if (sameDay(t, now)) return 'Hoje';
  if (sameDay(t, now + DAY)) return 'Amanhã';

const acc = id => id === 'me' ? S.me : (S.accounts.find(a => a.id === id) || { id, name: 'Conta fictícia', handle: 'conta', hue: 200, followers: 0 });
function avatar(a, size = 44, cls = '') {
  const initials = esc((a.name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase());
  const inner = a.avatar ? `<img src="${a.avatar}" alt="">` : initials;
  return `<a class="av ${cls}" href="#${a.id === 'me' ? 'perfil' : 'conta-' + a.id}" style="--s:${size}px;--h:${a.hue || 270}" aria-label="Perfil de ${esc(a.name)}">${inner}</a>`;
}
const nameLine = a => `<strong>${esc(a.name)}</strong>${a.verified ? VERIFIED : ''}`;
const gicon = (g, size = 28) => { const G = GAMES[g] || GAMES.chat; return `<span class="gicon" style="--gc:${G.color};--s:${size}px" title="${esc(G.name)}">${G.glyph}</span>`; };
const followingCount = () => S.me.followingBase + S.accounts.filter(a => a.followed).length;
const totalLives = () => S.lives.length;
const totalViews = () => S.me.viewsBase + S.lives.reduce((s, l) => s + (l.views || 0), 0);
function career(xp = S.me.xp) {
  let i = 0; while (i + 1 < CAREER.length && xp >= CAREER[i + 1][0]) i++;
  const cur = CAREER[i][0], next = CAREER[i + 1] ? CAREER[i + 1][0] : null;
  return { level: i + 1, name: CAREER[i][1], xp, cur, next, pct: next ? (xp - cur) / (next - cur) * 100 : 100 };
}
function addXP(n) {
  const before = career().level; S.me.xp += Math.round(n);
  const after = career();
  if (after.level > before) { notify('🎖️', `Subiste para o nível de carreira ${after.level}: ${after.name}!`); if (S.live) (S.live.achQueue = S.live.achQueue || []).push(`Nível ${after.level} — ${after.name}`); else toast('🎖️', `Nível ${after.level} — ${after.name}`); }
}
function coverCSS(c) {
  if (!c) return COVERS[0];
  if (c.type === 'img') return `url("${c.v}") center/cover`;
  return COVERS[c.v % COVERS.length];
}

/* ---------- Notificações e toasts ---------- */
function notify(ic, text, link) {
  S.notifs.unshift({ id: uid(), icon: ic, text, t: Date.now(), read: false, link: link || null });
  S.notifs = S.notifs.slice(0, 120);
  save(); paintBadges();
}
function toast(ic, text, ms = 3600) {
  // durante a live só passam avisos importantes (erros e câmara/ecrã/microfone)
  if (S && S.live && !['⚠️', '📷', '🎮', '🎥', '🎙️', '🔴'].includes(ic)) return;
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast'; el.innerHTML = `<span class="ico">${ic}</span><span>${esc(text)}</span>`;
  box.prepend(el);
  while (box.children.length > 4) box.lastChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, ms);
}

/* ---------- Conquistas ---------- */
function unlock(id) {
  if (S.ach[id]) return;
  const a = ACHIEVEMENTS.find(x => x.id === id); if (!a) return;
  S.ach[id] = Date.now();
  addXP(80);
  notify(a.icon, `Conquista desbloqueada: ${a.name}. Podes anunciá-la no feed.`, { ach: id });
  // durante a live fica em silêncio; aparece tudo junto quando a live termina
  if (S.live) (S.live.achQueue = S.live.achQueue || []).push(a.name);
  else toast(a.icon, `Conquista desbloqueada: ${a.name}`);
  save();
}
function checkAch() {
  const mine = S.posts.filter(p => p.author === 'me' && p.status === 'published');
  if (mine.length) unlock('first_post');
  if (S.pinned) unlock('pinned');
  if (S.events.some(e => e.owner === 'me')) unlock('first_event');
  if (S.events.some(e => e.owner === 'me' && e.interested >= 1000)) unlock('event_1k');
  if (S.lives.length || S.live) unlock('first_live');
  const peak = Math.max(0, ...S.lives.map(l => l.peak), S.live ? S.live.peak : 0);
  if (peak >= 1000) unlock('live_1k');
  if (peak >= 10000) unlock('live_10k');
  if (peak >= 100000) unlock('live_100k');
  if (S.stats.reactions >= 25) unlock('reactions_25');
  if (S.stats.clipsMade >= 1) unlock('first_clip');
  if (S.stats.clipsMade >= 10) unlock('clips_10');
  if (S.stats.polls >= 1) unlock('poll');
  if (S.me.followers >= 25000) unlock('followers_25k');
  if (S.live && S.live.gifts >= 10000) unlock('gifts_10k');
}

/* ---------- Eventos: estado e simulação ---------- */
function eventStatus(ev, now = Date.now()) {
  if (ev.cancelled) return 'cancelled';
  if (ev.owner === 'me') {
    if (S.live && S.live.eventId === ev.id) return 'live';
    if (ev.endedAt) return 'ended';
    if (now < ev.start - 5 * MIN) return 'scheduled';
    if (now < ev.start + 6 * HOUR) return 'soon';
    return 'ended';
  }
  if (now < ev.start) return 'scheduled';
  if (now < ev.start + (ev.dur || 2 * HOUR)) return 'live';
  return 'ended';
}
const STATUS_LABEL = { scheduled: 'Agendado', soon: 'A começar em breve', live: 'Em direto', ended: 'Terminado', cancelled: 'Cancelado' };

function simulateEvents(now) {
  for (const ev of S.events) {
    const st = eventStatus(ev, now);
    const lvl = LEVELS[ev.level] || LEVELS.media;
    if (st === 'scheduled' || st === 'soon') {
      const cap = ev.owner === 'me' ? 6 + S.me.followers * 1.2 + lvl.max * .004 : lvl.max * 0.22;
      if (ev.interested < cap && Math.random() < (ev.owner === 'me' ? .25 : .55)) {
        ev.interested += Math.max(1, Math.round(rand(.2, 1) * (ev.owner === 'me' ? cap / 120 : lvl.max / 3500) * (MODES[ev.mode]?.hype || 1)));
        ev.reminderUsers = Math.round(ev.interested * .42);
      }
    }
    if (ev.owner === 'me') ownEventNotifications(ev, st, now);
    else if (ev.myReminder) otherEventNotifications(ev, st, now);
  }
}
function ownEventNotifications(ev, st, now) {
  const n = ev.notified || (ev.notified = {});
  const left = ev.start - now;
  const lvl = LEVELS[ev.level] || LEVELS.media;
  const link = { ev: ev.id };
  if (st === 'cancelled' || st === 'ended') return;
  if (ev.interested >= 1000 && !n.k1) { n.k1 = 1; notify('🔔', `1.000 utilizadores fictícios estão interessados no teu evento «${ev.title}».`, link); toast('🔔', '1.000 utilizadores fictícios interessados no teu evento!'); checkAch(); }
  if (ev.interested >= Math.max(2500, lvl.max * .05) && !n.trend) { n.trend = 1; notify('📈', `O teu evento «${ev.title}» está a ser tendência na simulação.`, link); toast('📈', 'O teu evento está a ser tendência na simulação.'); }
  if (!ev.reminders) return;
  if (left <= 30 * MIN && left > 5 * MIN && !n.m30) { n.m30 = 1; notify('⏰', `O teu evento «${ev.title}» começa daqui a 30 minutos!`, link); toast('⏰', 'O teu evento começa daqui a 30 minutos!'); }
  if (left <= 5 * MIN && left > 0 && !n.m5) { n.m5 = 1; n.m30 = 1; notify('⏰', `O teu evento «${ev.title}» começa daqui a 5 minutos!`, link); toast('⏰', 'O teu evento começa daqui a 5 minutos!'); }
  if (left <= 0 && st === 'soon' && !n.start) { n.start = 1; n.m5 = 1; n.m30 = 1; notify('🎬', `Chegou a hora de «${ev.title}». Carrega em «Começar live».`, link); toast('🎬', 'Chegou a hora do teu evento! Começa a live.'); }
  if (left <= -2 * MIN && st === 'soon' && !n.wait) { n.wait = 1; notify('👥', 'A tua comunidade está à espera da tua live!', link); toast('👥', 'A tua comunidade está à espera da tua live!'); }
}
function otherEventNotifications(ev, st, now) {
  const n = ev.notified || (ev.notified = {});
  const a = acc(ev.owner), left = ev.start - now, link = { ev: ev.id };
  if (st === 'scheduled' && left <= 30 * MIN && !n.m30) { n.m30 = 1; notify('⏰', `${a.name} entra em direto daqui a 30 minutos: «${ev.title}».`, link); }
  if (st === 'live' && !n.live) { n.live = 1; n.m30 = 1; notify('🔴', `${a.name} está agora em direto: «${ev.title}».`, link); toast('🔴', `${a.name} está em direto!`); }
}

function eventPostText(ev) {
  const lvl = LEVELS[ev.level] || LEVELS.media;
  const when = dayLabel(ev.start).toUpperCase();
  return `🎮 LIVE ${when} — ${hhmm(ev.start)}\n\n${ev.title} 🔥\n\n${ev.desc}\n\nO objetivo: chegar aos ${dots(lvl.max)} espectadores virtuais!\n\nVenham participar na simulação, votar no chat, enviar presentes virtuais e acompanhar a diversão. #${(GAMES[ev.game]?.name || 'live').replace(/[^\p{L}\d]/gu, '').toLowerCase()} #LiveVerse`;
}

function route() {

  if (h.startsWith('canal-')) return { name: 'watch', id: h.slice(6).replace(/-/g, '_') };

  tickCountdowns();
  UI.lastSig = statusSig();

function visiblePosts() { return S.posts.filter(p => p.status === 'published').sort((a, b) => b.createdAt - a.createdAt); }
function viewPosts() {
  let list = visiblePosts();
  if (UI.feedTab === 'following') list = list.filter(p => p.author === 'me' || acc(p.author).followed);
  if (UI.feedTab === 'saved') list = list.filter(p => p.saved);
  if (UI.feedTab === 'events') list = list.filter(p => p.type === 'event' || p.type === 'live');

  return `

  </div>

function soonBanner(list) {

/* ---------- Composer ---------- */

  </section>`;
}
function cmpPlaceholder(t) {

}
function tagPreview(t) { const h = hashtags(t); return h.length ? 'Hashtags: ' + h.map(x => `<b>${esc(x)}</b>`).join(' ') : ''; }
function composerExtra() {

    <div class="row">${c.poll.length < 4 ? `<button class="btn btn-sm" data-act="poll-add">${icon('plus')} Opção</button>` : ''}<label class="field" style="flex-direction:row;align-items:center;gap:8px;margin-left:auto"><span>Duração</span><select class="input" data-cmp="pollHours" id="cmpPollH" style="width:auto">${[1, 6, 24, 72].map(h => `<option value="${h}" ${+c.pollHours === h ? 'selected' : ''}>${h} h</option>`).join('')}</select></label></div></div>`;

/* ---------- Cartão de publicação ---------- */
const KIND = { game: '🎮 Anúncio de jogo', live: '🔴 Anúncio de live', event: '📅 Evento', poll: '📊 Sondagem', achievement: '🏆 Conquista', photo: '🖼️ Foto', clip: '🎬 Clip' };
function postCard(p) {
  const a = acc(p.author), mine = p.author === 'me', pinned = S.pinned === p.id;
  const text = postText(p);
  let extra = '';
  if (p.type === 'event' || (p.type === 'live' && p.eventId)) { const ev = S.events.find(e => e.id === p.eventId); if (ev) extra = eventCard(ev); }
  if (p.type === 'game' || (p.type === 'live' && !p.eventId)) {
    const G = GAMES[p.game] || GAMES.chat; const isLive = p.type === 'live' && S.live && S.live.id === p.liveId;
    extra = `<div class="game-strip" style="--gc:${G.color}">${gicon(p.game, 44)}<div><span class="small muted">${p.type === 'live' ? (isLive ? 'Em direto agora' : 'Live anunciada') : 'A jogar'}</span><strong>${esc(G.name)}</strong></div>${isLive ? `<a class="btn btn-live btn-sm" href="#estudio" style="margin-left:auto">${icon('studio')} Estúdio</a>` : p.type === 'live' ? '<span class="pill-state" style="margin-left:auto">LIVE</span>' : ''}</div>`;
  }
  if (p.type === 'poll' && p.poll) {
    const total = p.poll.options.reduce((s, o) => s + o.v, 0) || 1; const done = p.poll.myVote != null || Date.now() > p.poll.ends;
    extra = `<div class="poll">${p.poll.options.map((o, i) => done
      ? `<div class="poll-opt ${p.poll.myVote === i ? 'mine' : ''}"><i style="width:${(o.v / total * 100).toFixed(1)}%"></i><span>${esc(o.t)}${p.poll.myVote === i ? ' ✓' : ''}</span><b class="num">${Math.round(o.v / total * 100)}%</b></div>`
      : `<button class="poll-opt" data-act="vote" data-id="${p.id}" data-i="${i}"><span>${esc(o.t)}</span></button>`).join('')}
      <span class="tiny muted">${dots(total)} votos ${SIM('fictícios')} · ${Date.now() > p.poll.ends ? 'Sondagem terminada' : 'Termina em ' + cdShort(p.poll.ends - Date.now())}</span></div>`;
  }
  if (p.type === 'achievement') { const x = ACHIEVEMENTS.find(z => z.id === p.achId); if (x) extra = `<div class="ach-banner"><span class="ach-ico">${x.icon}</span><div><span class="tiny muted">CONQUISTA DESBLOQUEADA</span><strong>${esc(x.name)}</strong><span class="small muted">${esc(x.desc)}</span></div></div>`; }
  if (p.type === 'photo' && p.img) extra = `<div class="post-media"><img src="${p.img}" alt="Fotografia publicada" loading="lazy"></div>`;
  if (p.type === 'clip') { const c = S.clips.find(z => z.id === p.clipId); if (c) extra = clipMini(c); }
  if (p.recap) extra += `<div class="recap"><div><b>${fmt(p.recap.peak)}</b><small>pico de espectadores</small></div><div><b>${fmt(p.recap.followers)}</b><small>novos seguidores</small></div><div><b>${fmt(p.recap.gifts)}</b><small>moedas virtuais</small></div><div><b>${durLabel(p.recap.dur)}</b><small>duração</small></div></div><span class="tiny muted">Resumo de live simulada ${SIM()}</span>`;
  const open = UI.openReplies.has(p.id);
  return `<article class="card post ${pinned ? 'pinned' : ''}" data-post="${p.id}">
    ${avatar(a, 46)}
    <div class="post-body">
      ${pinned ? `<div class="post-meta-top">${icon('pin')} Publicação fixada</div>` : p.reposted ? `<div class="post-meta-top">${icon('repost')} Repostaste</div>` : ''}
      <div class="post-head"><a href="#${mine ? 'perfil' : 'conta-' + a.id}">${nameLine(a)}</a><span class="muted">@${esc(a.handle)} · <time data-ago="${p.createdAt}" title="${new Date(p.createdAt).toLocaleString('pt-PT')}">${ago(p.createdAt)}</time></span>${KIND[p.type] ? `<span class="post-kind">${KIND[p.type]}</span>` : ''}
        <div class="menu-wrap"><button class="icon-btn" data-act="menu" data-id="${p.id}" aria-label="Mais opções">${icon('more')}</button>${UI.menu === p.id ? postMenu(p) : ''}</div></div>
      ${text ? `<p class="post-text">${richText(text)}</p>` : ''}
      ${extra}
      <div class="post-actions">
        <button class="pa" data-act="reply-toggle" data-id="${p.id}" aria-label="Responder">${icon('reply')}<span>${fmt(p.replies.length + (p.replyBase || 0))}</span></button>
        <button class="pa rp ${p.reposted ? 'on' : ''}" data-act="repost" data-id="${p.id}" aria-label="Repostar">${icon('repost')}<span>${fmt(p.reposts)}</span></button>
        <button class="pa like ${p.liked ? 'on' : ''}" data-act="like" data-id="${p.id}" aria-label="Gostar">${icon('heart')}<span>${fmt(p.likes)}</span></button>
        <button class="pa save ${p.saved ? 'on' : ''}" data-act="save" data-id="${p.id}" aria-label="Guardar">${icon('save')}</button>
        ${mine ? `<button class="pa pin ${pinned ? 'on' : ''}" data-act="pin" data-id="${p.id}" aria-label="${pinned ? 'Desafixar' : 'Fixar no perfil'}">${icon('pin')}</button>` : ''}
        <span class="pa views" title="Visualizações simuladas">${icon('eye')}<span data-views="${p.id}">${fmt(p.views)}</span></span>
      </div>
      ${open ? `<div class="replies">${p.replies.map(r => { const ra = acc(r.author); return `<div class="reply">${avatar(ra, 30)}<div><strong>${esc(ra.name)}</strong> <time class="muted tiny" data-ago="${r.t}">${ago(r.t)}</time><br>${richText(r.text)}</div></div>`; }).join('')}
        <form class="reply-form" data-form="reply" data-id="${p.id}"><input class="input" id="reply-${p.id}" name="t" maxlength="280" placeholder="Escreve uma resposta…" autocomplete="off"><button class="btn btn-sm btn-primary">Responder</button></form></div>` : ''}
    </div></article>`;
}
function postMenu(p) {
  const mine = p.author === 'me';
  return `<div class="menu">
    ${mine ? `<button data-act="pin" data-id="${p.id}">${icon('pin')} ${S.pinned === p.id ? 'Desafixar do perfil' : 'Fixar no perfil'}</button>` : `<button data-act="follow" data-id="${p.author}">${icon('users')} ${acc(p.author).followed ? 'Deixar de seguir' : 'Seguir'} @${esc(acc(p.author).handle)}</button>`}
    <button data-act="share-dm" data-type="post" data-id="${p.id}">${icon('send')} Enviar por mensagem</button>
    <button data-act="copy-post" data-id="${p.id}">${icon('share')} Copiar texto</button>

/* ---------- Cartão de evento (premium) ---------- */
function eventCard(ev, opts = {}) {
  const st = eventStatus(ev), a = acc(ev.owner), G = GAMES[ev.game] || GAMES.chat, M = MODES[ev.mode] || MODES.casual, L = LEVELS[ev.level] || LEVELS.media;
  const mine = ev.owner === 'me', now = Date.now();
  const whenTxt = st === 'live' ? '<span class="pill-live">EM DIRETO</span>' : st === 'soon' ? '<span class="pill-soon">A COMEÇAR EM BREVE</span>' : st === 'cancelled' ? '<span class="pill-state">CANCELADO</span>' : st === 'ended' ? '<span class="pill-state">TERMINADO</span>'
    : `<span class="ev-when">🎮 LIVE ${dayLabel(ev.start).toUpperCase()} — ${hhmm(ev.start)}</span>`;
  let mid;
  if (st === 'scheduled' && ev.countdown) {
    const { d, h, m, s } = cdParts(ev.start - now);
    mid = `<div class="cd" data-cd="${ev.start}" aria-label="Contagem decrescente"><div><b data-p="d">${pad(d)}</b><small>dias</small></div><div><b data-p="h">${pad(h)}</b><small>horas</small></div><div><b data-p="m">${pad(m)}</b><small>min</small></div><div><b data-p="s">${pad(s)}</b><small>seg</small></div></div>`;
  } else if (st === 'scheduled') mid = `<div class="cd-state off">${whenLabel(ev.start).toUpperCase()}</div>`;
  else if (st === 'soon') mid = `<div class="cd-state soon">A COMEÇAR EM BREVE</div>`;
  else if (st === 'live') mid = `<div class="cd-state live">EM DIRETO · <span data-watchers="${ev.id}">${fmt(mine ? S.live.viewers : (ev.viewers || 1000))}</span> espectadores virtuais</div>`;
  else if (st === 'cancelled') mid = `<div class="cd-state off">EVENTO CANCELADO</div>`;
  else mid = `<div class="cd-state off">TERMINADO${ev.peak ? ' · PICO DE ' + fmt(ev.peak) : ''}</div>`;
  const faces = S.accounts.slice(0, 4).map(x => avatar(x, 24).replace('<a ', '<span ').replace('</a>', '</span>')).join('');
  let actions = '';
  if (st === 'scheduled' || st === 'soon') actions += `<button class="btn ${ev.myReminder ? '' : 'btn-primary'}" data-act="remind" data-id="${ev.id}">${icon(ev.myReminder ? 'check' : 'bell')} ${ev.myReminder ? 'LEMBRETE ATIVO' : 'LEMBRAR-ME'}</button>`;
  if (!opts.inModal) actions += `<button class="btn" data-act="event-open" data-id="${ev.id}">${icon('eye')} VER EVENTO</button>`;
  if (mine && st === 'soon') actions += `<button class="btn btn-live" data-act="start-event" data-id="${ev.id}">${icon('studio')} COMEÇAR LIVE</button>`;
  if (mine && st === 'live') actions += `<a class="btn btn-live" href="#estudio">${icon('studio')} IR PARA O ESTÚDIO</a>`;
  if (!mine && st === 'live') actions += `<button class="btn btn-live" data-act="watch" data-id="${ev.id}">${icon('play')} ASSISTIR</button>`;
  return `<div class="ev-card ${opts.standalone ? 'standalone' : ''} ${st === 'cancelled' ? 'ev-cancelled' : ''}">
    <div class="ev-cover" style="--cover:${esc(coverCSS(ev.cover))}"><div class="grid-lines"></div>
      <div class="ev-top">${whenTxt}<span class="ev-mode">MODO ${esc(M.name.toUpperCase())}</span></div>
      <div><div class="ev-title">${esc(ev.title)} ${st === 'scheduled' || st === 'soon' ? '🔥' : ''}</div>
        <div class="ev-sub">${gicon(ev.game, 26)}<span>${esc(G.name)}</span><span>·</span><span>${mine ? 'O teu evento' : '@' + esc(a.handle)}</span></div></div>
    </div>
    <div class="ev-info">
      ${mid}
      <div class="ev-stats">
        <div><small>Meta de audiência</small><b>Até ${fmt(L.max)}</b><small>espectadores virtuais</small></div>
        <div><small>Interessados ${SIM()}</small><b data-int="${ev.id}">${dots(ev.interested)}</b><small>pessoas fictícias</small></div>
        <div><small>Lembretes ${SIM('sim.')}</small><b data-rem="${ev.id}">${dots(ev.reminderUsers || 0)}</b><small>${ev.reminders ? 'ativos' : 'desligados'}</small></div>
      </div>
      <div class="ev-faces"><span class="faces">${faces}</span><span><b data-int="${ev.id}">${dots(ev.interested)}</b> pessoas fictícias interessadas${ev.myInterest ? ', incluindo tu' : ''}</span></div>
      ${actions ? `<div class="ev-actions">${actions}</div>` : ''}
    </div></div>`;
}

/* ---------- Clips ---------- */

      <span class="sim-tag">${c.media ? 'Media tua' : 'Clip simulado'}</span>${gicon(c.game, 26)}<span class="dur">0:${pad(c.secs || 30)}</span><span class="play">${icon('play')}</span></div>
    <div class="clip-body">
      <strong>${esc(c.title)}</strong>

        <button class="pa" data-act="clip-share" data-id="${c.id}" title="Partilhar no feed">${icon('share')}<span>Partilhar</span></button>

        ${c.streamer === 'me' ? `<button class="pa ${c.onProfile ? 'pin on' : ''}" data-act="clip-profile" data-id="${c.id}" title="${c.onProfile ? 'Remover do perfil' : 'Adicionar ao perfil'}">${icon(c.onProfile ? 'check' : 'plus')}<span>${c.onProfile ? 'No perfil' : 'Perfil'}</span></button>` : ''}
      </div>

        <form class="reply-form" data-form="clip-comment" data-id="${c.id}"><input class="input" id="cc-${c.id}" name="t" maxlength="200" placeholder="Comentar…" autocomplete="off"><button class="btn btn-sm">Enviar</button></form>
        ${c.streamer === 'me' ? `<div class="row"><label class="btn btn-xs upload">${icon('image')} Anexar a minha media<input type="file" accept="video/*,image/*" data-file="clip-media" data-id="${c.id}" id="cm-${c.id}"></label>${c.streamer === 'me' ? `<button class="btn btn-xs btn-danger" data-act="clip-del" data-id="${c.id}">${icon('trash')} Eliminar</button>` : ''}</div><span class="tiny muted">Vídeos anexados ficam só nesta sessão do navegador.</span>` : ''}</div>` : ''}
    </div></article>`;
}
function clipCommentList(c) {
  const seedTxt = ['MOMENTO LENDÁRIO', 'vi isto em direto 😭', 'replay infinito', 'isto merece 1M de views', 'o chat foi à loucura', 'top clip'];
  const base = seedTxt.slice(0, 3).map((t, i) => ({ u: NAME_A[(c.id.charCodeAt(1) + i) % NAME_A.length] + NAME_B[i], t }));
  return [...base, ...(c.commentsList || [])];
}
function clipMini(c) {

   Estúdio e simulador de lives: audiência, chat, presentes, reações,

const LIVE_MS = 650;
const MILESTONES = [100, 500, 1000, 2500, 5000, 10000, 25000, 50000, 75000, 100000, 250000, 500000, 1000000];
const TL_ICON = { scene: '🎬', train: '🚂', surprise: '🎲', mod: '🔨', start: '🔴', milestone: '📈', gift: '🎁', reaction: '⚡', poll_start: '📊', poll_end: '✅', viral: '🌪️', raid: '🛡️', achievement: '🏆', end: '⏹️', follow: '💜' };
let liveTimer = null;
let watchTimer = null;
const STUDIO = { overlay: window.innerWidth < 760, reacts: false, showMore: false, custom: '', fx: true, autoClip: false, media: null, setup: null };

const noEmoji = t => String(t).replace(/^[\p{Extended_Pictographic}\uFE0F\u200D\s]+/u, '');
function fakeUser() { if (S && S.regulars && S.regulars.length && Math.random() < .22) return pick(S.regulars).u; return pick(NAME_A) + pick(NAME_B) + (Math.random() < .3 ? randi(1, 99) : ''); }
function fill(t, ctx) {
  return t.replace('{game}', ctx.gameName).replace('{viewers}', fmt(ctx.viewers).toUpperCase()).replace('{goal}', fmt(ctx.goal)).replace('{G}', ctx.gameName);
}
function liveCtx(L = S.live) { return { gameName: (GAMES[L.game] || GAMES.chat).name, viewers: L.viewers, goal: (LEVELS[L.level] || LEVELS.media).max }; }

/* ---------- Ciclo de vida ---------- */
function startLive({ title, game, mode, level, eventId }) {
  if (S.live) return;
  const now = Date.now();
  const L = LEVELS[level] || LEVELS.media;
  S.live = {
    id: 'live_' + uid(), title: title || 'Live sem título', game, mode, level, eventId: eventId || null,
    start: now, viewers: Math.max(3, Math.round(L.max * .006)), peak: 0, boost: 0, engage: 1, likes: 0, followers: 0, gifts: 0,
    reactions: 0, msgs: 0, milestones: [], timeline: [], clips: [], poll: null, raided: false, chat: [], viralCount: 0,
    scene: 'starting', sceneAt: now, sceneUntil: now + 20000,
  };
  addTimeline('start', 'Live começou: ' + S.live.title, '🔴');
  pushChat({ plain: true, text: `Damos-te as boas-vindas à sala de chat de ${S.me.handle}!` });
  pushChat({ sys: true, text: `🔴 Estás em direto em ${GAMES[game].name} · Modo ${MODES[mode].name}. Audiência simulada.` });
  if (eventId) {
    const ev = S.events.find(e => e.id === eventId);
    if (ev) {
      ev.liveId = S.live.id;
      S.live.viewers = Math.max(S.live.viewers, Math.round(ev.interested * .35));
      notify('🔴', `O teu evento «${ev.title}» está agora em direto!`, { ev: ev.id });
      toast('🔴', 'O teu evento está agora em direto!');
      pushChat({ sys: true, text: `🔔 ${dots(ev.reminderUsers)} lembretes fictícios enviados — a comunidade está a chegar!` });
    }
  }
  S.stats.livesStarted = (S.stats.livesStarted || 0) + 1;
  checkAch(); save();
  runLive();
  location.hash = '#estudio';
  render();
}
function runLive() { clearInterval(liveTimer); if (S.live) liveTimer = setInterval(liveTick, LIVE_MS); }

function endLive() {
  const L = S.live; if (!L) return;
  clearInterval(liveTimer); liveTimer = null;
  immersiveEnd(L); if (STUDIO.theater) setTheater(false);
  if (MEDIA.rec) recStop();
  const now = Date.now();
  addTimeline('end', 'Live terminada', '⏹️');
  const rec = {
    id: L.id, title: L.title, game: L.game, mode: L.mode, level: L.level, eventId: L.eventId, start: L.start, end: now,
    peak: Math.round(L.peak), views: Math.round(L.peak * rand(1.5, 2.1) + L.followers * 3), followers: Math.round(L.followers), gifts: Math.round(L.gifts),
    likes: Math.round(L.likes), reactions: L.reactions, timeline: L.timeline, clips: L.clips,
  };
  S.lives.push(rec);
  if (L.eventId) { const ev = S.events.find(e => e.id === L.eventId); if (ev) { ev.endedAt = now; ev.peak = rec.peak; } }
  addXP(Math.min(1500, (now - L.start) / MIN * 6 + rec.peak / 400 + 40));
  S.live = null;
  STUDIO.summary = rec.id;
  if (L.achQueue && L.achQueue.length) { const q = L.achQueue; setTimeout(() => toast('🏆', `Nesta live desbloqueaste: ${q.slice(0, 3).join(', ')}${q.length > 3 ? ` e mais ${q.length - 3}` : ''}`, 6500), 600); }
  STUDIO.media = null;
  notify('⏹️', `Live terminada: pico de ${fmt(rec.peak)} espectadores virtuais e ${fmt(rec.followers)} novos seguidores fictícios.`);
  checkAch(); save(); render();
}

/* ---------- Tick da simulação ---------- */
function liveTick() {
  const L = S.live; if (!L) return;
  const now = Date.now(), e = (now - L.start) / 1000;
  const lvl = LEVELS[L.level] || LEVELS.media, M = MODES[L.mode] || MODES.casual;
  const base = lvl.max * (0.05 + 0.68 * (1 - Math.exp(-e / (70 + lvl.max / 4000)))) * Math.min(1.15, M.hype * .85) * sceneFactor(L);
  L.boost *= 0.985;
  const target = Math.min(lvl.max * 1.12, base + L.boost) * rand(.985, 1.015);
  L.viewers = Math.max(1, L.viewers + (target - L.viewers) * 0.07);
  if (L.viewers > L.peak) L.peak = L.viewers;
  L.engage = 1 + (L.engage - 1) * 0.96;

  for (const m of MILESTONES) {
    if (L.viewers >= m && !L.milestones.includes(m)) {
      L.milestones.push(m);
      addTimeline('milestone', `Marco de audiência: ${dots(m)} espectadores virtuais`, '📈');
      activityPush(L, 'milestone', `Marco de ${dots(m)} espetadores`);
      if (m >= 1000) crowd(.7);
      if (m >= 500) sound('milestone');
      if (m >= lvl.max) { notify('🎯', `Meta atingida: ${dots(m)} espectadores virtuais em «${L.title}»!`); fxBurst('🎯', 'META ATINGIDA!'); }
      checkAch();
    }
  }
  // seguidores, gostos
  const fGain = L.viewers * 0.00005 * L.engage * rand(.3, 1.4);
  L.followers += fGain; S.me.followers += fGain;
  L.likes += L.viewers * 0.0006 * L.engage * rand(.5, 1.5);
  // chat
  const rate = (L.viewers < 30 ? .25 : L.viewers < 1000 ? .8 : L.viewers < 20000 ? 1.4 : 2.1) * Math.min(2.2, L.engage) * chatRateFactor();
  let n = Math.floor(rate) + (Math.random() < rate % 1 ? 1 : 0);
  while (n--) pushChat({ user: fakeUser(), text: S.mod.emoteOnly ? pick(EMOTES) : ambientLine(L) });
  maybeTroll(L);
  surpriseTick(L); surpriseCheck(L); immersiveTick(L);
  // presentes
  if (Math.random() < (0.05 + Math.log10(L.viewers + 1) * 0.025 * L.engage) * (L.train ? 2.5 : 1) * (L.scene === 'starting' ? .3 : 1)) giftEvent();
  // raid espontânea
  if (!L.raided && e > 120 && Math.random() < 0.0025) raid();
  // sondagem
  if (L.poll && !L.poll.done) {

function pushChat(m) {
  const L = S.live; if (!L) return;
  m.id = uid(); m.color = m.color || regColor(m.user) || pick(NAME_COLORS); m.t = Date.now();
  if (!modFilter(m)) return;

    const overlay = list.dataset.chatlist === 'overlay';

      list.insertAdjacentHTML('beforeend', overlayMsgHTML(m));
      while (list.children.length > 6) list.firstElementChild.remove();

function makeClip({ title, game, type, emoji, hype = .5, liveId, viewers = 1000 }) {

function clipFromTimeline(id) {

  if (!it) { for (const l of S.lives) { const f = (l.timeline || []).find(x => x.id === id); if (f) { it = f; liveRec = l; break; } } }

/* ---------- Reações ao jogo ---------- */
function inferMood(text) {
  const t = text.toLowerCase();
  if (/clutch|1\s*(v|vs|contra)\s*\d/.test(t)) return { moods: ['clutch'], hype: .75, fol: true, viral: .45, emoji: '🎯', fx: 'CLUTCH!' };
  if (/ganhei|vit[oó]ria|venci|campe|win|#1|primeiro lugar/.test(t)) return { moods: ['win'], hype: .6, fol: true, viral: .25, emoji: '🏆', fx: 'VITÓRIA!' };
  if (/susto|medo|assust|fantasma|jump|terror|grit/.test(t)) return { moods: ['scary'], hype: .45, fol: true, viral: .25, emoji: '😱', fx: 'QUE SUSTO!' };
  if (/perdi|falhei|morri|derrota|azar|errei/.test(t)) return { moods: ['sad'], hype: .1, fol: false, viral: .05, emoji: '💀', fx: 'NÃÃÃO' };
  if (/haha|bug|engra[cç]|ca[ií]|rid[ií]cul|lol/.test(t)) return { moods: ['funny'], hype: .4, fol: true, viral: .3, emoji: '😂', fx: 'HAHAHA' };
  if (/encontrei|raro|lend[aá]ri|m[ií]tic|diamante|dourad/.test(t)) return { moods: ['rare'], hype: .55, fol: true, viral: .25, emoji: '💎', fx: 'RARO!' };
  return { moods: ['big', 'amazing'], hype: .45, fol: true, viral: .2, emoji: '⚡', fx: 'GRANDE MOMENTO!' };
}
function react(itemId, customText) {
  const L = S.live; if (!L) return;
  const item = itemId === 'custom' ? inferMood(customText) : REACT_ITEMS[itemId];
  if (!item) return;
  const label = itemId === 'custom' ? customText : REACT_LABEL[itemId];
  const ctx = liveCtx(L);
  const mood = item.moods[0];
  // 1. reações no chat (dependem do jogo e do acontecimento)
  let lines = [...moodPool(L.game, mood)];
  if (item.moods[1]) lines = lines.concat(moodPool(L.game, item.moods[1]).slice(0, 4));
  if (itemId === 'custom') {
    const short = customText.length > 40 ? customText.slice(0, 38) + '…' : customText;
    lines.push(`«${short}» ?!`, 'REPETE ISSO', 'CHAT VIRAM ISTO??', 'ISTO TEM DE IR PARA OS CLIPS');
    const vs = customText.match(/(\d+)\s*(?:contra|vs?|x)\s*(\d+)/i);
    if (vs) lines.push(`${vs[1]}v${vs[2]}?!?! INSANO`, `${vs[1]} CONTRA ${vs[2]} 😭😭`, 'CLIP CLIP CLIP');
  }
  const count = Math.round(6 + item.hype * 10 + Math.log10(L.viewers + 1));
  for (let i = 0; i < count; i++) setTimeout(() => { if (S.live === L) pushChat({ user: fakeUser(), text: fill(pick(lines), liveCtx(L)), hype: true }); }, i * rand(90, 260));
  L.lastMood = mood; L.lastMoodAt = Date.now(); avatarEmote(mood);
  if (item.hype >= .6) { giftRain(L, Math.round(item.hype * 5)); crowd(item.hype); }
  // 2. animação
  if (STUDIO.fx) { fxBurst(item.emoji, item.fx); if (mood === 'scary') { const sc = $('#screen'); sc?.classList.remove('shake'); void sc?.offsetWidth; sc?.classList.add('shake'); } }
  // 3. interação
  const lvl = LEVELS[L.level] || LEVELS.media;
  L.boost += item.hype * lvl.max * 0.07;
  L.engage = Math.min(3, L.engage + item.hype * 1.2);
  L.likes += L.viewers * item.hype * 0.05;
  // 4. seguidores
  if (item.fol) {
    const f = Math.round(L.viewers * item.hype * rand(.002, .006) + 1);
    L.followers += f; S.me.followers += f;
    setTimeout(() => { if (S.live !== L) return; activityPush(L, 'follow', `+${dots(f)} novos seguidores`); alertShow('💜', `+${dots(f)} novos seguidores`, 'seguidores fictícios', 'follow'); sound('follow'); }, 900);
  }
  // 5. cronologia
  sound('react');
  L.reactions++; S.stats.reactions = (S.stats.reactions || 0) + 1;
  const it = addTimeline('reaction', 'Reação ao jogo: ' + label, item.emoji, { hype: item.hype, reactLabel: itemId === 'custom' ? 'Acontecimento personalizado' : label, clipTitle: label + ' em ' + ctx.gameName });
  // momento viral
  if (Math.random() < item.viral) setTimeout(() => {
    if (S.live !== L) return;
    L.viralCount++; L.boost += lvl.max * .12; sound('viral'); alertShow('🌪️', 'Momento viral!', label, 'viral');
    addTimeline('viral', `Momento viral: «${label}» está a espalhar-se na simulação`, '🌪️', { hype: .9, reactLabel: 'Momento viral', clipTitle: 'VIRAL: ' + label });
    pushChat({ sys: true, text: '🌪️ MOMENTO VIRAL! Novos espectadores virtuais a chegar.' });
    toast('🌪️', 'Momento viral na simulação!');
    unlock('viral');
  }, 1600);
  // 6. clip opcional
  if (STUDIO.autoClip) setTimeout(() => clipFromTimeline(it.id), 300);
  checkAch(); updateLiveBits(); save();
}

function modFilter(m) {
  // devolve true se a mensagem pode aparecer
  if (m.sys || m.gift || m.me) return true;
  const L = S.live, M = S.mod, now = Date.now();
  if (M.banned.some(b => b.u === m.user)) return false;
  if (L.muted && L.muted[m.user] > now) return false;
  const low = m.text.toLowerCase();
  const word = M.words.find(w => w && low.includes(w.toLowerCase()));
  const spam = M.automod && (m.troll || /(.)\1{9,}/.test(m.text) || /👉|link|http/i.test(m.text));
  if (word || spam) {
    M.stats.blocked++;
    if (now - (L.lastAutoNotice || 0) > 9000) { L.lastAutoNotice = now; setTimeout(() => S.live === L && pushChat({ sys: true, mod: true, text: `🛡️ AutoMod bloqueou uma mensagem de ${m.user}${word ? ' (palavra bloqueada)' : ' (spam)'}` }), 0); }
    paintModStats();
    return false;
  }
  if (M.emoteOnly && !isEmojiOnly(m.text)) return false;
  if (M.subOnly) m.sub = true;
  return true;
}
function chatRateFactor() { const M = S.mod; return (M.slow ? .45 : 1) * (M.subOnly ? .4 : 1); }

function saveAccounts() {
  syncAccountsDraft();
  const D = MODAL.draft, err = $('#accErr');
  for (const a of D) {
    a.name = a.name.trim(); a.handle = a.handle.trim().replace(/^@/, '').toLowerCase();
    if (!a.name || !/^[a-z0-9_.]+$/.test(a.handle)) { err.textContent = `Revê a conta «${a.name || 'sem nome'}»: o nome de utilizador só pode ter letras, números, «_» e «.».`; err.hidden = false; return; }
    if (!a.games.length) a.games = ['fortnite'];
    delete a.isNew;
  }
  const handles = D.map(a => a.handle);
  if (handles.length !== new Set(handles).size || handles.includes(S.me.handle)) { err.textContent = 'Há dois nomes de utilizador iguais. Cada conta precisa de um diferente.'; err.hidden = false; return; }
  if (!D.length) { err.textContent = 'Mantém pelo menos uma conta na simulação.'; err.hidden = false; return; }
  const keep = new Set(D.map(a => a.id));
  const gone = S.accounts.filter(a => !keep.has(a.id)).map(a => a.id);
  if (gone.length) {
    const g = new Set(gone);
    S.posts = S.posts.filter(p => !g.has(p.author));
    S.posts.forEach(p => p.replies = p.replies.filter(r => !g.has(r.author)));
    S.events = S.events.filter(e => !g.has(e.owner));
    S.clips = S.clips.filter(c => !g.has(c.streamer));
    S.dms = S.dms.filter(t => !g.has(t.with));
  }
  S.accounts = D;
  save(); closeModal(); render(); toast('✅', 'Contas guardadas');
}

function audio() {
  if (!S.prefs.sound) return null;

function tone(ctx, { f = 660, t = 0, d = .18, type = 'sine', v = 1, slide = 0 }) {
  const o = ctx.createOscillator(), g = ctx.createGain(), at = ctx.currentTime + t;
  o.type = type; o.frequency.setValueAtTime(f, at); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, at + d);
  const vol = S.prefs.volume * .22 * v;
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(Math.max(vol, .0002), at + .015); g.gain.exponentialRampToValueAtTime(0.0001, at + d);
  o.connect(g).connect(ctx.destination); o.start(at); o.stop(at + d + .05);
}

      r.onend = () => { if (MIC.on) { try { r.start(); } catch (e) { MIC.on = false; paintMic(); } } else { MIC.state = 'idle'; paintMic(); } };

let noiseBuf = null;
function crowd(intensity = .6) {
  if (!S.prefs.crowd) return;
  const ctx = audio(); if (!ctx) return;
  try {
    if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2.2, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = .6;
    const g = ctx.createGain(), t = ctx.currentTime, v = S.prefs.volume * .32 * intensity;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .25); g.gain.setValueAtTime(v, t + .9); g.gain.exponentialRampToValueAtTime(.0001, t + 2.1);
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 7 + Math.random() * 4; lg.gain.value = v * .5; lfo.connect(lg).connect(g.gain);
    src.connect(bp).connect(g).connect(ctx.destination); src.start(t); src.stop(t + 2.2); lfo.start(t); lfo.stop(t + 2.2);
  } catch (e) { }
}

function drawSpark() {
  const c = $('#viewSpark'); const L = S.live; if (!c || !L || !L.hist || L.hist.length < 2) return;
  const ctx = c.getContext('2d'), w = c.width, h = c.height, pts = L.hist.map(p => p[1]);
  const max = Math.max(...pts) * 1.08 || 1, min = Math.min(...pts) * .9;
  const X = i => i / (pts.length - 1) * (w - 6) + 3, Y = v => h - 4 - (v - min) / (max - min || 1) * (h - 8);
  ctx.clearRect(0, 0, w, h);
  const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, 'rgba(145,71,255,.45)'); g.addColorStop(1, 'rgba(145,71,255,0)');
  ctx.beginPath(); pts.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)));
  ctx.lineTo(X(pts.length - 1), h); ctx.lineTo(X(0), h); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); pts.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)));
  ctx.strokeStyle = '#a970ff'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.beginPath(); ctx.arc(X(pts.length - 1), Y(pts[pts.length - 1]), 3.2, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
}

  s.events.filter(e => e.owner === 'me').forEach(e => { e.interested = Math.min(e.interested, 3); e.reminderUsers = 0; e.notified = {}; });

function dropHTML(a, ev) {
  const need = 10 * MIN, got = WATCH.key === a.id ? Date.now() - WATCH.started : 0, pct = Math.min(100, got / need * 100);

  return `<span class="drop-ic">${gicon(ev.game, 34)}</span><div><b>${done ? 'Emblema ganho!' : `Vê 10 minutos e ganha o emblema «${esc(G.name)}»`}</b><small>Recompensa fictícia · ${done ? 'já está no teu perfil' : Math.floor(pct) + '%'}</small><div class="goal-bar"><i style="width:${done ? 100 : pct}%"></i></div></div>`;
}
function leaderboardHTML(g) {
  const top = Object.entries(g || {}).sort((a, b) => b[1] - a[1]).slice(0, 3);
  if (!top.length) return '<span class="tiny muted">Ainda ninguém ofereceu presentes</span>';
  return top.map(([u, n], i) => `<span class="lb-i"><b class="lb-medal m${i + 1}">${i + 1}</b><span><strong>${esc(u)}</strong><small>${icon('gift')} ${dots(n)}</small></span></span>`).join('');
}
function chatInputHTML(id, form, gift, accId) {

    ${gift ? `<button type="button" class="tw-in-gift" data-act="w-giftsub" data-id="${accId}" aria-label="Oferecer subscrição">${icon('gift')}</button>` : ''}

    <div class="emote-pop" data-emotes-for="${id}" hidden>${['😂', '🔥', '💜', '😭', '😱', '🏆', '👀', '💀', '🎉', '👏', 'GG', 'W', 'L', '🐐', '🫡', '🤯', '💎', '⚡', '🍿', '❤️'].map(e => `<button type="button" data-act="emote-insert" data-e="${e}" data-for="${id}">${e}</button>`).join('')}</div>

function wMsg(m) {
  m.id = m.id || uid(); m.t = m.t || Date.now(); m.color = m.color || regColor(m.user) || pick(NAME_COLORS);
  WATCH.chat.push(m); if (WATCH.chat.length > 150) WATCH.chat.shift();
  const list = $('#wpChat'); if (list) appendChat(list, chatMsgHTML(m));
  const ov = $('[data-wchat-overlay]'); if (ov && !m.plain) { ov.insertAdjacentHTML('beforeend', overlayMsgHTML(m)); while (ov.children.length > 7) ov.firstElementChild.remove(); }
}
function appendChat(list, html, max = 150) {
  const near = list.scrollHeight - list.scrollTop - list.clientHeight < 50;
  list.insertAdjacentHTML('beforeend', html);
  while (list.children.length > max) list.firstElementChild.remove();
  const pill = list.parentElement.querySelector('.more-pill');
  if (near) list.scrollTop = list.scrollHeight; else if (pill) pill.hidden = false;
}
function startWatch(a) {
  const ev = channelLive(a);
  if (WATCH.key !== a.id) {
    clearInterval(WATCH.timer);
    Object.assign(WATCH, { key: a.id, acc: a, chat: [], gifters: {}, started: Date.now(), botAt: Date.now(), dropDone: false, chest: false, ptsAt: Date.now(), chestAt: Date.now() });
    if (ev) {
      const seed = Math.max(3, Math.round((ev.viewers || 100) / 80));
      [fakeUser(), fakeUser(), fakeUser()].forEach((u, i) => WATCH.gifters[u] = Math.round(seed * [4, 2, 1.3][i]));
    }
  }
  const list = $('#wpChat');
  if (list) {
    list.innerHTML = '';
    if (!WATCH.chat.length) {
      wMsg({ plain: true, text: `Damos-te as boas-vindas à sala de chat de ${a.handle}!` });
      if (ev) wMsg({ user: 'LiveBot', bot: true, color: '#00c8af', text: `Segue ${a.name} nas redes e ativa as notificações 🔔 · comandos: !discord !setup` });
      else wMsg({ plain: true, text: 'O canal está offline. Podes escrever na mesma.' });
    } else WATCH.chat.slice(-80).forEach(m => list.insertAdjacentHTML('beforeend', chatMsgHTML(m)));
    list.scrollTop = list.scrollHeight;
  }
  clearInterval(WATCH.timer);
  paintWatchLB();
  if (!ev) return;
  WATCH.timer = setInterval(() => watchTick(a), 650);
}
function watchTick(a) {
  const r = route();
  if (r.name !== 'watch' || r.id !== a.id) { clearInterval(WATCH.timer); return; }
  const ev = channelLive(a); if (!ev) { clearInterval(WATCH.timer); render(); return; }
  ev.viewers = Math.max(10, Math.round((ev.viewers || 100) * rand(.996, 1.007)));
  $$('[data-anim="wviewers"]').forEach(el => tweenNum(el, ev.viewers));
  $$('[data-wv]').forEach(el => { if (el.tagName !== 'B') el.textContent = fmt(ev.viewers); });
  $$('[data-wup]').forEach(up => up.textContent = upTime(Date.now() - ev.start));
  $$('[data-wv]').forEach(el => { if (el.tagName === 'B') el.textContent = dots(ev.viewers); });
  pointsTick(a);
  const ctx = { gameName: (GAMES[ev.game] || GAMES.chat).name, viewers: ev.viewers, goal: 100000 };
  const rate = ev.viewers > 5000 ? 1.6 : ev.viewers > 500 ? 1 : .5;
  let n = Math.floor(rate) + (Math.random() < rate % 1 ? 1 : 0);
  while (n--) {
    const pool = Math.random() < .35 ? moodPool(ev.game, pick(['amazing', 'funny', 'win', 'clutch', 'scary', 'sad', 'rare'])) : (ev.game === 'gta6' && Math.random() < .4 ? GTA6_AMBIENT : AMBIENT);
    wMsg({ user: Math.random() < .12 && S.regulars.length ? pick(S.regulars).u : fakeUser(), text: fill(pick(pool), ctx) });
  }
  if (Math.random() < .018) { const u = fakeUser(), k = pick([1, 1, 5, 10]); WATCH.gifters[u] = (WATCH.gifters[u] || 0) + k; wMsg({ gift: true, text: `🎁 ${u} ofereceu ${k} ${k === 1 ? 'subscrição' : 'subscrições'} à comunidade!` }); paintWatchLB(); }
  if (Math.random() < .012) wMsg({ gift: true, text: `⭐ ${fakeUser()} subscreveu por ${randi(2, 30)} meses!` });
  if (Date.now() - WATCH.botAt > 45000) { WATCH.botAt = Date.now(); wMsg({ user: 'LiveBot', bot: true, color: '#00c8af', text: pick([`Segue ${a.name} e ativa as notificações 🔔`, 'Lembrem-se de ser simpáticos no chat 💜', `Vejam os clipes de ${a.handle} na página do canal!`]) }); }
  const drop = $('[data-wdrop]'); if (drop) drop.innerHTML = dropHTML(a, ev);
  if (!WATCH.dropDone && Date.now() - WATCH.started > 10 * MIN) { WATCH.dropDone = true; S.badges = S.badges || {}; if (!S.badges[ev.game]) { S.badges[ev.game] = Date.now(); notify('🎖️', `Ganhaste o emblema «${(GAMES[ev.game] || GAMES.chat).name}» por veres a live de ${a.name} (fictício).`); toast('🎖️', 'Emblema ganho!'); save(); } }
}
function paintWatchLB() { const el = $('[data-wlb]'); if (el) el.innerHTML = leaderboardHTML(WATCH.gifters); }
function stopWatch() { clearInterval(WATCH.timer); }

const TW_ACT = {

  'chat-bottom': b => { const list = b.parentElement.querySelector('.chat-list'); if (list) list.scrollTop = list.scrollHeight; b.hidden = true; },

function mediaError(e, what) {

  if (n === 'NotAllowedError' || n === 'SecurityError') msg = inClaude()
    ? `Dentro do Claude o navegador não deixa usar a ${what}. Abre o LiveVerse no teu site do Cloudflare (ou o ficheiro no Chrome) para a usares.`
    : `Não deste autorização para usar a ${what}. Podes ativá-la nas definições do navegador (ícone do cadeado ao lado do endereço).`;
  else if (n === 'NotFoundError' || n === 'OverconstrainedError') msg = `Não foi encontrada nenhuma ${what} neste dispositivo.`;
  else if (n === 'NotReadableError') msg = `A ${what} está a ser usada por outra aplicação. Fecha-a e tenta outra vez.`;
  else msg = `Não foi possível usar a ${what} neste navegador.`;

}
function camToggle() {
  if (MEDIA.cam) { stopStream('cam'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { mediaError({ name: inClaude() ? 'NotAllowedError' : 'x' }, 'câmara'); return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: MEDIA.facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false })
    .then(st => { MEDIA.cam = st; st.getVideoTracks()[0].addEventListener('ended', () => stopStream('cam')); toast('📷', 'Câmara ligada. Só tu vês este vídeo.'); mediaChanged(); })
    .catch(e => mediaError(e, 'câmara'));
}
function camFlip() {
  MEDIA.facing = MEDIA.facing === 'user' ? 'environment' : 'user';
  if (!MEDIA.cam) return;
  MEDIA.cam.getTracks().forEach(t => t.stop()); MEDIA.cam = null;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: MEDIA.facing }, audio: false })
    .then(st => { MEDIA.cam = st; mediaChanged(); })
    .catch(e => { mediaError(e, 'câmara'); mediaChanged(); });
}
function screenToggle() {
  if (MEDIA.screen) { stopStream('screen'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    toast('⚠️', inClaude() ? 'Dentro do Claude não dá para partilhar o ecrã. Abre o LiveVerse no Cloudflare, no computador.' : 'Este dispositivo não permite partilhar o ecrã (os telemóveis normalmente não deixam). Usa a câmara ou o computador.', 7000);
    return;
  }
  navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 30 } }, audio: true })
    .then(st => { MEDIA.screen = st; st.getVideoTracks()[0].addEventListener('ended', () => stopStream('screen')); toast('🎮', 'A mostrar o ecrã do jogo na live.'); mediaChanged(); })
    .catch(e => { if (e && e.name === 'NotAllowedError' && !inClaude()) return; mediaError(e, 'partilha de ecrã'); });
}

  if (MEDIA.rec && MEDIA.rec._src && MEDIA.rec._src.includes(kind)) recStop();

  mediaChanged();
}

/* ---------- Gravação ---------- */
function recToggle() { if (MEDIA.rec) recStop(); else recStart(); }
function recStart() {
  if (!window.MediaRecorder) { toast('⚠️', 'Este navegador não consegue gravar vídeo.'); return; }
  const src = MEDIA.screen && MEDIA.cam ? 'screen+cam' : MEDIA.screen ? 'screen' : MEDIA.cam ? 'cam' : null;
  if (!src) { toast('🎥', 'Liga a câmara ou mostra o jogo para poderes gravar.'); return; }
  let stream;
  if (src === 'screen+cam') stream = composeStream();
  else stream = MEDIA[src];
  const audio = MEDIA.screen ? MEDIA.screen.getAudioTracks() : [];
  if (audio.length && src === 'screen+cam') audio.forEach(t => stream.addTrack(t));
  const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
  const mimeType = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';

  try { rec = new MediaRecorder(stream, mimeType ? { mimeType } : undefined); } catch (e) { toast('⚠️', 'Não foi possível começar a gravar.'); return; }
  rec._src = src; rec._type = mimeType || 'video/webm';
  MEDIA.chunks = [];
  rec.ondataavailable = ev => { if (ev.data && ev.data.size) MEDIA.chunks.push(ev.data); };
  rec.onstop = () => {
    if (MEDIA.compose) { MEDIA.compose.stop(); MEDIA.compose = null; }
    const blob = new Blob(MEDIA.chunks, { type: rec._type.split(';')[0] });
    if (MEDIA.lastUrl) URL.revokeObjectURL(MEDIA.lastUrl);
    MEDIA.lastUrl = URL.createObjectURL(blob); MEDIA.lastExt = rec._type.includes('mp4') ? 'mp4' : 'webm';
    const secs = Math.max(1, Math.round((Date.now() - MEDIA.recStart) / 1000));
    S.clips.unshift({ id: 'c_' + uid(), title: `Gravação da live · ${hhmm(Date.now())}`, game: S.live ? S.live.game : 'chat', streamer: 'me', type: 'Gravação', emoji: '🎥', popularity: 50, likes: 0, comments: 0, onProfile: false, createdAt: Date.now(), liked: false, commentsList: [], secs: Math.min(59, secs), media: { kind: 'video', url: MEDIA.lastUrl } });
    save(); toast('🎥', 'Gravação guardada nos teus clips. Podes transferi-la no botão «Transferir».', 6000);
    paintMediaBar();
  };
  rec.start(1000); MEDIA.rec = rec; MEDIA.recStart = Date.now();
  clearInterval(MEDIA.recTimer); MEDIA.recTimer = setInterval(() => $$('[data-rec]').forEach(n => n.textContent = durLabel(Date.now() - MEDIA.recStart)), 500);

}
function recStop() { const r = MEDIA.rec; if (!r) return; MEDIA.rec = null; clearInterval(MEDIA.recTimer); try { r.stop(); } catch (e) { } paintMediaBar(); }
function composeStream() {
  // junta o ecrã do jogo com a câmara no canto, como na live
  const c = document.createElement('canvas'); c.width = 1280; c.height = S.prefs.orient === 'v' ? 2276 : 720;
  if (S.prefs.orient === 'v') { c.width = 720; c.height = 1280; }

  const vs = document.createElement('video'), vc = document.createElement('video');

  vs.srcObject = MEDIA.screen; vc.srcObject = MEDIA.cam; vs.play().catch(() => { }); vc.play().catch(() => { });

  const draw = () => {
    if (!on) return;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, c.width, c.height);
    const fit = (v, x, y, w, h, cover) => { const vw = v.videoWidth || 16, vh = v.videoHeight || 9; const s = cover ? Math.max(w / vw, h / vh) : Math.min(w / vw, h / vh); const dw = vw * s, dh = vh * s; ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); ctx.drawImage(v, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh); ctx.restore(); };

    requestAnimationFrame(draw);
  };
  draw();
  const out = c.captureStream(30);
  MEDIA.compose = { stop() { on = false; vs.srcObject = null; vc.srcObject = null; } };
  return out;
}

/* ---------- Envolvimento simulado ---------- */
const REPLY_POOLS = {
  event: ['Lá estarei! 🔥', 'Já ativei o lembrete ⏰', 'Bora aos {goal}!', 'Não vou perder!', 'Contagem decrescente ligada 👀'],
  live: ['A caminho!', 'Já estou no chat 💜', 'Bora!!'],
  poll: ['Votei!', 'Difícil escolher 😅', 'A primeira, claro'],
  achievement: ['Parabéns!! 🏆', 'Mereces!', 'Que orgulho 💜'],
  clip: ['QUE CLIP 😭', 'Replay infinito', 'Isto é lendário'],
  text: ['Top 🔥', 'Concordo totalmente', 'Isso mesmo!', '💜💜', 'Quando é a próxima live?', 'Grande!'],
};
function fakeEngagement(post) {
  const base = Math.max(20, S.me.followers * .01);
  const steps = 6;
  for (let i = 1; i <= steps; i++) setTimeout(() => {
    post.likes += Math.round(base * rand(.05, .25)); post.views += Math.round(base * rand(.4, 1.2)); post.reposts += Math.random() < .5 ? randi(0, Math.ceil(base / 200)) : 0;
    rerenderPost(post.id); save();
  }, i * rand(1500, 3500));
  const nReplies = randi(1, 2);
  for (let i = 0; i < nReplies; i++) setTimeout(() => {
    const a = pick(S.accounts); const ev = post.eventId && S.events.find(e => e.id === post.eventId);
    const pool = REPLY_POOLS[post.type] || REPLY_POOLS.text;
    const text = pick(pool).replace('{goal}', ev ? fmt(LEVELS[ev.level].max) : '100 mil');
    post.replies.push({ id: uid(), author: a.id, text, t: Date.now() });
    notify('💬', `${a.name} respondeu à tua publicação: «${text}»`, { post: post.id });
    rerenderPost(post.id); save();
  }, rand(2500, 6000) + i * 2500);
  setTimeout(() => notify('💜', `${dots(post.likes)} utilizadores fictícios gostaram da tua publicação.`, { post: post.id }), 14000);
}
function rerenderPost(id) {
  const p = S.posts.find(x => x.id === id); if (!p) return;
  $$(`[data-post="${id}"]`).forEach(el => {
    const keep = el.querySelector('.reply-form input'); const val = keep && keep.value; const focused = keep && document.activeElement === keep;
    el.outerHTML = postCard(p);
    if (val || focused) { const n = $(`[data-post="${id}"] .reply-form input`); if (n) { n.value = val || ''; if (focused) n.focus(); } }
  });
  tickCountdowns();
}

/* ---------- Publicar ---------- */
function publishPost() {
  const c = UI.cmp; const text = c.text.trim();
  const fail = t => toast('⚠️', t);
  if (text.length > 500) return fail('O texto tem mais de 500 caracteres.');
  const p = { id: 'p_' + uid(), author: 'me', type: c.type, text, createdAt: Date.now(), likes: 0, liked: false, reposts: 0, reposted: false, saved: false, views: 0, replies: [], status: 'published' };
  if (c.type === 'text' && !text) return fail('Escreve alguma coisa antes de publicar.');
  if (c.type === 'game' || c.type === 'live') { p.game = c.game; if (c.type === 'live' && S.live) { p.liveId = S.live.id; p.game = S.live.game; } if (!text) p.text = c.type === 'live' ? `Vou entrar em direto em ${GAMES[p.game].name}! 🔴 #LiveVerse` : `A jogar ${GAMES[p.game].name} 🎮`; }
  if (c.type === 'event') { if (!c.eventId) return fail('Escolhe um evento ou cria um novo.'); p.eventId = c.eventId; p.text = text || null; }
  if (c.type === 'poll') { const opts = c.poll.map(s => s.trim()).filter(Boolean); if (!text) return fail('Escreve a pergunta da sondagem.'); if (opts.length < 2) return fail('A sondagem precisa de pelo menos 2 opções.'); p.poll = { options: opts.map(t => ({ t, v: 0 })), myVote: null, ends: 0, hours: +c.pollHours }; }
  if (c.type === 'achievement') { if (!c.achId) return fail('Escolhe uma conquista.'); p.achId = c.achId; if (!text) p.text = `Nova conquista desbloqueada: ${ACHIEVEMENTS.find(a => a.id === c.achId).name}! 🏆 #conquista`; }
  if (c.type === 'photo') { if (!c.img) return fail('Escolhe uma fotografia.'); p.img = c.img; }
  if (c.type === 'clip') { if (!c.clipId) return fail('Escolhe um clip.'); p.clipId = c.clipId; }
  if (c.schedule) {
    const at = c.at ? new Date(c.at).getTime() : NaN;
    if (!(at > Date.now() + 30000)) return fail('Escolhe uma data e hora de publicação no futuro.');
    p.status = 'scheduled'; p.scheduledAt = at;
    toast('🕒', `Publicação agendada para ${whenLabel(at)}`);
  } else {
    activatePost(p);
    toast('✅', 'Publicado');
  }
  S.posts.push(p);
  UI.cmp = { ...UI.cmp, type: 'text', text: '', poll: ['', ''], achId: '', img: null, clipId: '', eventId: '', schedule: false, at: '' };
  addXP(12); checkAch(); save(); render();
  if (p.status === 'published') fakeEngagement(p);
}
function activatePost(p) {
  p.status = 'published'; p.createdAt = p.scheduledAt || Date.now();
  if (p.poll && !p.poll.ends) p.poll.ends = p.createdAt + (p.poll.hours || 24) * HOUR;
}

  'cmp-type': b => { UI.cmp.type = b.dataset.k; refreshComposer(); },
  'poll-add': () => { if (UI.cmp.poll.length < 4) UI.cmp.poll.push(''); refreshComposer(); },
  'poll-del': b => { UI.cmp.poll.splice(+b.dataset.i, 1); refreshComposer(); },
  'cmp-img-del': () => { UI.cmp.img = null; refreshComposer(); },
  'publish': () => publishPost(),
  'sched-cancel': b => { S.posts = S.posts.filter(p => p.id !== b.dataset.id); save(); refreshComposer(); toast('🗑️', 'Publicação agendada cancelada'); },
  'menu': b => { const id = b.dataset.id; const prev = UI.menu; UI.menu = prev === id ? null : id; if (prev && prev !== id) rerenderPost(prev); rerenderPost(id); },
  'like': b => { const p = S.posts.find(x => x.id === b.dataset.id); p.liked = !p.liked; p.likes += p.liked ? 1 : -1; save(); rerenderPost(p.id); },
  'repost': b => { const p = S.posts.find(x => x.id === b.dataset.id); p.reposted = !p.reposted; p.reposts += p.reposted ? 1 : -1; if (p.reposted) toast('🔁', 'Repostado no teu perfil'); save(); rerenderPost(p.id); },
  'save': b => { const p = S.posts.find(x => x.id === b.dataset.id); p.saved = !p.saved; toast('🔖', p.saved ? 'Guardado' : 'Removido dos guardados'); save(); rerenderPost(p.id); },
  'pin': b => { const id = b.dataset.id; S.pinned = S.pinned === id ? null : id; UI.menu = null; toast('📌', S.pinned ? 'Fixado no perfil' : 'Desafixado'); checkAch(); save(); render(); },

/* ---------- Ficheiros ---------- */
async function fileToDataURL(file, maxW, maxH, q = .82) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const s = Math.min(1, maxW / img.width, maxH / img.height);
    const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}
async function onFile(input) {
  const file = input.files && input.files[0]; if (!file) return;
  const kind = input.dataset.file;
  try {
    if (kind === 'cmp-photo') { UI.cmp.img = await fileToDataURL(file, 1200, 1200); refreshComposer(); }
    else if (kind === 'avatar') { syncProfileDraft(); MODAL.draft.avatar = await fileToDataURL(file, 320, 320, .85); paintProfileEditor(); }
    else if (kind === 'banner') { syncProfileDraft(); MODAL.draft.banner = await fileToDataURL(file, 1500, 500); paintProfileEditor(); }
    else if (kind === 'ev-cover') { syncEventDraft(); MODAL.draft.cover = { type: 'img', v: await fileToDataURL(file, 1000, 500) }; paintEventEditor(); }
    else if (kind === 'cam-img') { S.prefs.camImg = await fileToDataURL(file, 400, 400, .85); save(); paintScreen(); $$('[data-immpanel]').forEach(el => el.outerHTML = immersivePanelHTML()); toast('🙂', 'Imagem do avatar atualizada'); }
    else if (kind === 'studio-media') { if (STUDIO.media) URL.revokeObjectURL(STUDIO.media.url); STUDIO.media = { kind: file.type.startsWith('video') ? 'video' : 'image', url: URL.createObjectURL(file) }; render(); }
    else if (kind === 'clip-media') { const c = S.clips.find(x => x.id === input.dataset.id); c.media = file.type.startsWith('video') ? { kind: 'video', url: URL.createObjectURL(file) } : { kind: 'image', url: await fileToDataURL(file, 800, 450) }; save(); render(); toast('🎬', 'Media anexada ao clip'); }
  } catch (e) { toast('⚠️', 'Não foi possível ler este ficheiro. Experimenta outra imagem.'); }
}

/* ---------- Ciclo principal ---------- */
function tickCountdowns() {
  const now = Date.now();
  $$('[data-cd]').forEach(el => {
    const { d, h, m, s } = cdParts(+el.dataset.cd - now);
    const set = (k, v) => { const n = el.querySelector(`[data-p="${k}"]`); if (n && n.textContent !== v) n.textContent = v; };
    set('d', pad(d)); set('h', pad(h)); set('m', pad(m)); set('s', pad(s));
  });
  $$('[data-cdtext]').forEach(el => el.textContent = cdShort(+el.dataset.cdtext - now));
}
let tickN = 0;
function tick() {
  if (!S) return;
  const now = Date.now(); tickN++;
  tickClock();
  if (tickN % 15 === 0) tickAgo();
  maybeInboundDM(now);
  // publicações agendadas
  for (const p of S.posts) if (p.status === 'scheduled' && p.scheduledAt <= now) {
    activatePost(p); notify('🕒', 'A tua publicação agendada foi publicada.', { post: p.id }); toast('🕒', 'Publicação agendada publicada'); fakeEngagement(p); checkAch(); save();
  }
  if (tickN % 3 === 0) {
    simulateEvents(now);
    // contadores
    S.events.forEach(ev => { $$(`[data-int="${ev.id}"]`).forEach(n => n.textContent = dots(ev.interested)); $$(`[data-rem="${ev.id}"]`).forEach(n => n.textContent = dots(ev.reminderUsers || 0)); if (ev.owner !== 'me' && eventStatus(ev) === 'live') { ev.viewers = Math.round((ev.viewers || LEVELS[ev.level].max * .3) * rand(.99, 1.012)); $$(`[data-watchers="${ev.id}"]`).forEach(n => n.textContent = fmt(ev.viewers)); } });
    Object.values(SYN).forEach(ev => { ev.viewers = Math.max(10, Math.round(ev.viewers * rand(.993, 1.009))); $$(`[data-chv="${ev.id}"]`).forEach(n => n.textContent = n.closest('.tw-thumb') ? espet(ev.viewers) : fmt(ev.viewers)); });
    S.events.forEach(ev => $$(`[data-chv="${ev.id}"]`).forEach(n => n.textContent = n.closest('.tw-thumb') ? espet(ev.viewers || 0) : fmt(ev.viewers || 0)));
    // visualizações simuladas
    for (const p of S.posts) if (p.status === 'published' && now - p.createdAt < 5 * DAY && Math.random() < .25) {
      p.views += randi(1, p.author === 'me' ? Math.ceil(S.me.followers / 800) : 40);
      if (p.author === 'me' && Math.random() < .2) p.likes += 1;
      $$(`[data-views="${p.id}"]`).forEach(n => n.textContent = fmt(p.views));
    }
    // votos fictícios em sondagens
    for (const p of S.posts) if (p.poll && p.status === 'published' && now < p.poll.ends && Math.random() < .3) { const o = pick(p.poll.options); o.v += randi(1, 6); }
    save();
  }
  // atividade de outras contas
  if (now - S.lastOtherPost > rand(55000, 90000)) {
    S.lastOtherPost = now;
    const a = pick(S.accounts), g = pick(a.games), [line, type] = pick(OTHER_POST_LINES);
    const gname = GAMES[g].name;
    S.posts.push({ id: 'p_' + uid(), author: a.id, type, game: g, text: line.replace('{g}', gname.replace(/[^\p{L}\d]/gu, '').toLowerCase()).replace('{G}', gname).replace('{n}', fmt(a.followers)), createdAt: now, likes: randi(5, 80), liked: false, reposts: randi(0, 10), reposted: false, saved: false, views: randi(100, 900), replies: [], status: 'published' });
    const others = S.posts.filter(p => p.author !== 'me');
    if (others.length > 120) { const old = others.sort((x, y) => x.createdAt - y.createdAt)[0]; if (!old.saved && !old.liked && !old.reposted) S.posts = S.posts.filter(p => p !== old); }
    if (route().name === 'feed' && window.scrollY < 200 && !isTyping()) render();
    save();
  }
  tickCountdowns();
  const sig = statusSig();
  if (sig !== UI.lastSig && !isTyping() && $('#modal').hidden) render();
}
function isTyping() { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox'; }

  document.addEventListener('submit', e => {

      else UI.cmp[k] = t.value;
      if (k === 'text') { const c = $('#cmpCount'); c.textContent = t.value.length + '/500'; c.classList.toggle('over', t.value.length > 500); $('#cmpTags').innerHTML = tagPreview(t.value); t.style.height = 'auto'; t.style.height = Math.min(300, t.scrollHeight) + 'px'; }
    }
    if (t.dataset.setup && STUDIO.setup) {
      STUDIO.setup[t.dataset.setup] = t.value;
      if (t.dataset.setup === 'eventId' && t.value) { const ev = S.events.find(x => x.id === t.value); if (ev) { Object.assign(STUDIO.setup, { title: ev.title, game: ev.game, mode: ev.mode, level: ev.level }); render(); } }
    }
    if (t.dataset.studio) { STUDIO[t.dataset.studio] = t.checked; if (t.dataset.studio === 'overlay') $$('.screen-chat').forEach(x => x.classList.toggle('on', t.checked)); }

    if (t.hasAttribute('data-chipcheck')) t.closest('.chip').classList.toggle('on', t.checked);
  });
  document.addEventListener('change', e => {
    const t = e.target;

function migrate(s) {

  s.ach = s.ach || {}; s.notifs = s.notifs || []; s.clips = s.clips || []; s.lives = s.lives || [];
  s.events.forEach(e => { e.notified = e.notified || {}; e.cover = e.cover || { type: 'preset', v: 0 }; });

  resetToZero(s);
