<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forma Rosto e Corpo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: uma coluna estreita tipo app, cartões só onde há uma coisa para fazer; barra de separadores fixa em baixo. */
:root{
  --bg:#eef2ef; --surface:#ffffff; --sunk:#e1e8e4; --line:#cdd8d2;
  --ink:#10241c; --muted:#53675e; --spruce:#1f5b45; --spruce-ink:#ffffff;
  --apricot:#e8894a; --apricot-soft:#fbe3d2; --good:#2f8a5b; --warn:#c07a12; --bad:#b9463b;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1714; --surface:#15231e; --sunk:#1c2d27; --line:#2a3f37;
  --ink:#e7f0eb; --muted:#9bb0a6; --spruce:#5fbf93; --spruce-ink:#0b1813;
  --apricot:#f0a06a; --apricot-soft:#3a2a1e; --good:#5fbf93; --warn:#e5ad4c; --bad:#e8786c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1714; --surface:#15231e; --sunk:#1c2d27; --line:#2a3f37;
  --ink:#e7f0eb; --muted:#9bb0a6; --spruce:#5fbf93; --spruce-ink:#0b1813;
  --apricot:#f0a06a; --apricot-soft:#3a2a1e; --good:#5fbf93; --warn:#e5ad4c; --bad:#e8786c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2.2rem,8vw,3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.btn{appearance:none;border:0;border-radius:999px;padding:14px 20px;font:600 1rem var(--body);background:var(--spruce);color:var(--spruce-ink);cursor:pointer;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:.875rem}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.opt:focus-visible{outline:3px solid var(--apricot);outline-offset:2px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 14px;font:500 .95rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--spruce);border-color:var(--spruce);color:var(--spruce-ink)}
.opt{appearance:none;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:14px 16px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt b{font-weight:700}
.opt span{color:var(--muted);font-size:.9rem}
.opt[aria-pressed="true"]{border-color:var(--spruce);box-shadow:inset 0 0 0 1.5px var(--spruce)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=number],input[type=text],select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:500 1rem var(--body)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--spruce);border-radius:99px;transition:width .3s}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Hero */
.hero{display:flex;flex-direction:column;gap:20px;padding-top:12px}
.facemark{width:100%;max-width:100%;aspect-ratio:16/10;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:block}
.steps{display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps li b{font-family:var(--mono);color:var(--apricot);min-width:1.5em}
ol.steps{list-style:none;padding:0;margin:0}

/* Scan */
.cam{position:relative;width:100%;aspect-ratio:3/4;max-width:100%;border-radius:20px;overflow:hidden;background:#0b1310}
.cam video,.cam canvas,.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam video{transform:scaleX(-1)}
.cam .guide{position:absolute;inset:12% 18% 16%;border:2px dashed rgba(255,255,255,.55);border-radius:50% 50% 46% 46%;pointer-events:none}
.cam .hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-size:.9rem;text-shadow:0 1px 4px #000}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--apricot);box-shadow:0 0 18px var(--apricot);animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{top:8%}to{top:90%}}
@media (prefers-reduced-motion: reduce){.scanline{animation:none;top:50%}}

/* Score */
.score{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score .big{font-family:var(--display);font-size:2.8rem;font-weight:800;line-height:1}
.score .pot{color:var(--apricot)}
.meter{display:grid;grid-template-columns:7.5rem 1fr 4.5rem;gap:10px;align-items:center;font-size:.9rem}
.meter .bar{height:10px;background:var(--sunk);border-radius:99px;position:relative;overflow:hidden}
.meter .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.meter .bar i.p{background:var(--apricot-soft);border-right:2px solid var(--apricot)}
.meter .bar i.n{background:var(--spruce)}
.meter .v{text-align:right;font-family:var(--mono);font-size:.8rem}
.tip{display:flex;gap:10px;align-items:flex-start}
.tip .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--apricot);margin-top:.5em}

/* App */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.brand{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--apricot)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tab{appearance:none;background:none;border:0;color:var(--muted);font:600 .72rem var(--body);padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--spruce)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:1 0 auto;min-width:44px;appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 6px;font:600 .85rem var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.day small{font-weight:500;color:var(--muted);font-size:.7rem}
.day[aria-pressed="true"]{background:var(--spruce);border-color:var(--spruce);color:var(--spruce-ink)}
.day[aria-pressed="true"] small{color:inherit;opacity:.8}
.day.today{border-color:var(--apricot)}
.ex{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex .sets{font-family:var(--mono);font-size:.82rem;color:var(--muted);white-space:nowrap}
.check{appearance:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.check[aria-pressed="true"]::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.meal{display:flex;flex-direction:column;gap:8px}
.meal .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.meal ul{margin:0;padding-left:18px;color:var(--muted);font-size:.9rem}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.acc{background:var(--apricot-soft);color:var(--ink)}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.macros div{background:var(--sunk);border-radius:12px;padding:10px 4px}
.macros b{display:block;font-family:var(--mono);font-size:1rem}
.macros span{font-size:.72rem;color:var(--muted)}
.water{display:flex;gap:6px;flex-wrap:wrap}
.glass{appearance:none;width:34px;height:42px;border-radius:6px 6px 10px 10px;border:2px solid var(--line);background:var(--surface);cursor:pointer;position:relative;overflow:hidden}
.glass[aria-pressed="true"]{border-color:var(--spruce)}
.glass[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70%;background:var(--spruce);opacity:.55}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:.9rem;z-index:9;max-width:calc(100% - 32px)}
.qhead{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.disclaimer{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
details summary{cursor:pointer;font-weight:600}
.spark{width:100%;height:90px;display:block}
.shop li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.shop{list-style:none;margin:0;padding:0}
.shop li.got span:first-child{text-decoration:line-through;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs" hidden><div class="tabs-in" id="tabsIn"></div></nav>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileIn" accept="image/*" capture="user" hidden>

<script>

/* ============ Estado e armazenamento ============ */
const KEY = "forma.v1";
let S = load() || fresh();
function fresh(){ return { answers:{}, face:null, scans:[], plan:null, log:{}, weights:[], blocked:[], shopGot:{} }; }
function load(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let view = S.plan ? "app" : "home";
let tab = "hoje";
let qi = 0;           // pergunta atual
let selDay = todayIdx();
let mealDay = todayIdx();
const $ = (s, el=document) => el.querySelector(s);
const app = $("#app");
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }
function todayIdx(){ return (new Date().getDay()+6)%7; } // 0 = segunda
function dateKey(d=new Date()){ return d.toISOString().slice(0,10); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function rnd(seed){ let s = seed>>>0 || 1; return ()=>{ s = (s*1664525+1013904223)>>>0; return s/4294967296; }; }
const DAYS = ["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const DSH = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];

/* ============ Perguntas ============ */

    ["acne","Acne / borbulhas"],["digestao","Inchaço / má digestão"],["fome","Fome à noite"],["tempo","Pouco tempo"],["nada","Nada disto"] ]},
  { id:"dieta", title:"Como comes?", type:"one", opts:[

  { id:"intol", title:"Alergias ou intolerâncias?", type:"multi", opts:[

];
const FOODS = [["frango","Frango"],["vaca","Carne de vaca"],["porco","Porco"],["peixe","Peixe"],["atum","Atum"],["ovos","Ovos"],["arroz","Arroz"],["massa","Massa"],["batata","Batata"],["aveia","Aveia"],["iogurte","Iogurte"],["queijo","Queijo"],["pao","Pão"],["fruta","Fruta"],["legumes","Legumes"],["leguminosas","Feijão, grão, lentilhas"],["tofu","Tofu"],["marisco","Marisco"]];

 {id:"tosta_peru",n:"Tosta de queijo fresco e peito de peru",s:["pa","la"],k:400,p:30,t:5,x:["leite","gluten","carne"],m:["pao","queijo"],ing:[["Pão integral",80,"g"],["Queijo fresco",60,"g"],["Fiambre de peru",60,"g"]]},
 {id:"panquecas",n:"Panquecas de aveia e banana",s:["pa"],k:450,p:20,t:15,x:["ovo"],m:["aveia","ovos","fruta"],ing:[["Flocos de aveia",50,"g"],["Ovos",2,"un"],["Banana",1,"un"],["Mel",10,"g"]]},
 {id:"batido_aveia",n:"Batido de aveia, banana e manteiga de amendoim",s:["pa","la"],k:560,p:30,t:4,x:["leite","frutos"],m:["aveia","fruta","iogurte"],ing:[["Leite meio-gordo",300,"ml"],["Flocos de aveia",40,"g"],["Manteiga de amendoim",15,"g"],["Banana",1,"un"],["Proteína em pó (opcional)",15,"g"]]},

 {id:"omelete_claras",n:"Omelete de claras com espinafres e torrada",s:["pa"],k:330,p:32,t:10,x:["ovo","gluten"],m:["ovos","legumes","pao"],ing:[["Claras de ovo",200,"ml"],["Ovos",1,"un"],["Espinafres",60,"g"],["Pão integral",50,"g"]]},
 {id:"skyr_mirtilo",n:"Skyr com aveia e mirtilos",s:["pa","la"],k:340,p:30,t:3,x:["leite"],m:["iogurte","aveia","fruta"],ing:[["Skyr natural",250,"g"],["Flocos de aveia",30,"g"],["Mirtilos",80,"g"]]},
 {id:"chia_manga",n:"Pudim de chia com manga e proteína vegetal",s:["pa"],k:470,p:28,t:5,x:[],m:["fruta"],ing:[["Sementes de chia",30,"g"],["Bebida de aveia",250,"ml"],["Manga",120,"g"],["Proteína de ervilha",25,"g"]]},

function targets(a){
  const w=+a.peso||70, h=+a.altura||175, age=+a.idade||25, male=a.sexo!=="f";
  const bmr = 10*w + 6.25*h - 5*age + (male?5:-161);
  const act = {sed:1.35, leve:1.5, ativo:1.65, muito:1.8}[a.ativ||"leve"];
  const tdee = bmr*act;
  const goal = a.corpo||"saude";
  let adj = {definido:-.15, perder:-.2, atletico:-.05, musculado:.1, forte:.08, saude:0}[goal];
  if(age<18 && adj<0) adj = -.05;          // em crescimento: défice pequeno
  if(age<18 && adj>0) adj = .05;
  let kcal = tdee*(1+adj);
  kcal = Math.max(kcal, male?1600:1300, bmr*1.05);
  kcal = Math.round(kcal/10)*10;
  const pPerKg = {definido:2, perder:1.8, atletico:1.8, musculado:1.9, forte:1.9, saude:1.6}[goal];
  const prot = Math.round(w*pPerKg), fat = Math.round(w*.85);
  const carb = Math.max(80, Math.round((kcal - prot*4 - fat*9)/4));
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), kcal, prot, fat, carb, water:Math.round(w*35/250), adj};
}
function excludedTags(a){
  const x = new Set();
  const d=a.dieta||"tudo";
  if(d==="semporco") x.add("porco");
  if(d==="pesc"){ x.add("carne"); x.add("porco"); }
  if(d==="veg"||d==="vegan"){ ["carne","porco","peixe","marisco"].forEach(t=>x.add(t)); }
  if(d==="vegan"){ x.add("ovo"); x.add("leite"); }
  (a.intol||[]).forEach(t=>{ if(t!=="nenhuma") x.add(t); });
  if((a.intol||[]).includes("peixe")) x.add("peixe");
  return x;
}
function mealOk(m, a){
  const ex = excludedTags(a);
  if(m.x.some(t=>ex.has(t))) return false;
  const hate = a.odeia||[];
  if(m.m.some(f=>hate.includes(f))) return false;
  if(S.blocked.includes(m.id)) return false;

function mealScore(m, a, r){
  let sc = r()*2;
  (a.gosta||[]).forEach(f=>{ if(m.m.includes(f)) sc+=2.5; });
  if(a.cozinha==="pouco" && m.t>20) sc-=3;
  if(a.cozinha==="medio" && m.t>30) sc-=2;
  if((a.afeta||[]).includes("digestao") && m.m.includes("leguminosas")) sc-=1;
  return sc;
}
function candidates(slot, a){
  const s = slot==="ja" ? "al" : slot;
  return MEALS.filter(m=>m.s.includes(s) && mealOk(m,a));
}
function buildMeals(a, seed){
  const r = rnd(seed), t = targets(a), lay = LAYOUTS[a.refeicoes||"4"];
  const used = {}; const week = [];
  for(let d=0; d<7; d++){
    const day = [];
    lay.forEach(([slot,share], i)=>{
      const c = candidates(slot,a);
      const prev = d>0 && week[d-1][i] ? week[d-1][i].id : null;
      const ranked = c.map(m=>({m, s:mealScore(m,a,r) - (used[m.id]||0)*2.2 - (m.id===prev?5:0) - (day.some(x=>x.id===m.id)?9:0)})).sort((x,y)=>y.s-x.s);
      const pick = ranked[0] ? ranked[0].m : null;
      if(pick){ used[pick.id]=(used[pick.id]||0)+1; day.push({id:pick.id, slot, kc:Math.round(t.kcal*share)}); }
      else day.push({id:null, slot, kc:Math.round(t.kcal*share)});
    });
    week.push(day);
  }
  return week;
}
function scaled(entry){
  const m = MEALS.find(x=>x.id===entry.id); if(!m) return null;
  const f = clamp(Math.round(entry.kc/m.k*20)/20, .6, 1.8);
  return {m, f, k:Math.round(m.k*f), p:Math.round(m.p*f), ing:m.ing.map(([nm,q,u])=>{
    if(!q) return [nm,0,u];
    if(u==="un") return [nm, Math.max(1, Math.round(q*f)), u];
    return [nm, Math.round(q*f/5)*5, u];

}

function pickEx(pattern, a, skip){
  const inj = a.afeta||[]; const rank = EQRANK[a.local||"gym"];

    if(goal==="definido"||goal==="perder") return "3 × 10–15";
    return "3 × 8–12";
  };
  const cardioType = ()=>{
    const knee = inj.includes("joelho");
    if(likes.includes("natacao")) return "Natação";
    if(likes.includes("bike")) return "Bicicleta";
    if(likes.includes("corrida") && !knee) return "Corrida leve";
    if(likes.includes("hiit") && !knee) return "HIIT (30 s rápido / 60 s lento)";
    return knee ? "Bicicleta ou elíptica" : "Caminhada rápida (ou inclinada)";
  };
  const wantCardio = {definido:3, perder:3, atletico:2, musculado:1, forte:1, saude:2}[goal];
  const week = [];
  let si = 0;
  for(let d=0; d<7; d++){

      const tpl = TEMPLATES[split[si++]];

      for(const p of tpl.p){

        used.push(e.n);

        exs.push({n:e.n, sets, pat:p});
      }
      if((a.rosto||[]).includes("postura") && !exs.some(e=>e.pat==="neck")) exs.push({n:EX.neck[0].n, sets:"2 × 12", pat:"neck"});
      week.push({type:"forca", name:tpl.n, ex:exs, extra: (goal==="definido"||goal==="perder") ? "No fim: 10–15 min de cardio leve" : ""});
    } else week.push({type:"descanso", name:"Descanso ativo", ex:[]});
  }
  // cardio e desportos nos dias livres
  const free = week.map((w,i)=>w.type==="descanso"?i:-1).filter(i=>i>=0);
  let c = 0;
  const sport = likes.includes("futebol") ? "Futebol com amigos" : null;
  free.forEach((d,k)=>{
    if(sport && k===free.length-1 && d>=5){ week[d] = {type:"cardio", name:sport, ex:[{n:"Jogo ou treino de futebol", sets:"60–90 min"}]}; return; }
    if(c<wantCardio && d!==6){
      const dur = a.tempo==="30" ? "25 min" : goal==="perder"||goal==="definido" ? "35–45 min" : "25–35 min";
      week[d] = {type:"cardio", name:"Cardio", ex:[{n:cardioType(), sets:dur},{n:"Mobilidade: anca, ombros, costas", sets:"10 min"}]}; c++;
    } else {
      const ex=[{n:"Caminhada", sets: inj.includes("tempo") ? "20 min" : "30–45 min"}];
      if(likes.includes("yoga")||inj.includes("costas")||inj.includes("stress")) ex.push({n:"Yoga / alongamentos", sets:"15 min"});
      week[d] = {type:"descanso", name:"Descanso ativo", ex};
    }
  });
  return week;
}

const SHAPES = {
  oval:{n:"Oval", hair:"Quase tudo te fica bem. Laterais curtas com volume em cima é uma aposta segura.", beard:"Barba curta e uniforme, ou barba por fazer."},
  redondo:{n:"Redondo", hair:"Volume em cima e laterais bem curtas para alongar o rosto. Evita franjas retas.", beard:"Barba mais comprida no queixo e curta nas faces, para dar ângulo."},
  quadrado:{n:"Quadrado", hair:"Cortes com textura e algum comprimento em cima suavizam os ângulos.", beard:"Barba curta que siga a linha do maxilar."},
  longo:{n:"Alongado", hair:"Evita muito volume em cima; laterais um pouco mais compridas e franja leve equilibram.", beard:"Barba mais cheia nas faces e curta no queixo."},
  coracao:{n:"Coração", hair:"Comprimento médio com textura; evita laterais rapadas a zero.", beard:"Barba mais cheia no queixo para equilibrar a testa."},
  diamante:{n:"Diamante", hair:"Franja ou volume na testa e laterais com algum comprimento.", beard:"Barba cheia no queixo para alargar a parte de baixo."},
};
let faceApiState = "idle"; // idle | loading | ready | failed
const FA_VER = "1.7.15";
const FA_MODELS = `https://cdn.jsdelivr.net/npm/@vladmandic/face-api@${FA_VER}/model/`;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function withTimeout(p, ms){ return Promise.race([p, new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),ms))]); }
// Primeiro os ficheiros que vêm com a app (pasta faceapi/), depois o CDN.
let faceApiPromise=null;
function ensureFaceApi(){

function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function angleAt(p,a,b){ const v1={x:a.x-p.x,y:a.y-p.y}, v2={x:b.x-p.x,y:b.y-p.y}; return Math.acos((v1.x*v2.x+v1.y*v2.y)/(Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y)))*180/Math.PI; }
function analyseLandmarks(pts, canvas){
  // alinhar pelos olhos
  const eyeL = avg(pts.slice(36,42)), eyeR = avg(pts.slice(42,48));
  const ang = Math.atan2(eyeR.y-eyeL.y, eyeR.x-eyeL.x), c=Math.cos(-ang), s=Math.sin(-ang);
  const o = avg([eyeL,eyeR]);
  const P = pts.map(p=>({x:(p.x-o.x)*c-(p.y-o.y)*s, y:(p.x-o.x)*s+(p.y-o.y)*c}));
  const width = dist(P[0],P[16]);
  const mid = avg([P[27],P[28],P[29],P[30],P[33],P[51],P[57],P[8]]).x;
  const pairs = [[0,16],[1,15],[2,14],[3,13],[4,12],[5,11],[6,10],[17,26],[19,24],[21,22],[36,45],[39,42],[31,35],[48,54]];
  let dev=0; pairs.forEach(([i,j])=>{ dev += Math.abs((P[i].x-mid)+(P[j].x-mid)) + Math.abs(P[i].y-P[j].y); });
  dev /= pairs.length*width;
  const sym = clamp(Math.round(100 - dev*520), 45, 98);
  const brow = avg([P[19],P[24]]);
  const midThird = P[33].y-brow.y, lowThird = P[8].y-P[33].y;
  const thirds = clamp(Math.round(100 - Math.abs(lowThird/midThird-1)*110), 45, 98);
  const eyeW = (dist(P[36],P[39])+dist(P[42],P[45]))/2, inter = dist(P[39],P[42]);
  const eyes = clamp(Math.round(100 - Math.abs(inter/eyeW-1)*90), 45, 98);
  const harmonia = Math.round((sym*.45+thirds*.3+eyes*.25));
  // maxilar: ângulo no canto do maxilar (mais fechado = mais marcado)
  const jawAng = (angleAt(P[4],P[1],P[8])+angleAt(P[12],P[15],P[8]))/2;
  const definicao = clamp(Math.round(90 - (jawAng-122)*1.3), 40, 95);
  // formato
  const faceH = (P[8].y-brow.y)*1.45, cheekW = dist(P[1],P[15]), jawW = dist(P[4],P[12]), foreW = dist(P[17],P[26]);
  const hr = faceH/cheekW, jr = jawW/cheekW, fr = foreW/cheekW;
  let shape = "oval";
  if(hr>1.42) shape="longo";
  else if(hr<1.18 && jr>.86) shape="quadrado";
  else if(hr<1.22) shape="redondo";
  else if(fr>.9 && jr<.78) shape="coracao";
  else if(fr<.8 && jr<.8) shape="diamante";
  else if(jr>.88) shape="quadrado";
  // pele: textura nas maçãs do rosto (depende muito da luz)
  const pele = skinScore(canvas, pts);
  return {harmonia, sym, thirds, eyes, definicao, pele, shape, method:"pontos"};
}
function avg(a){ return {x:a.reduce((s,p)=>s+p.x,0)/a.length, y:a.reduce((s,p)=>s+p.y,0)/a.length}; }
function skinScore(canvas, pts){
  try{
    const ctx = canvas.getContext("2d", {willReadFrequently:true});
    const regions = [[pts[1],pts[31],pts[40]],[pts[15],pts[35],pts[47]]].map(([a,b,e])=>{
      const x=Math.round(Math.min(a.x,b.x)+Math.abs(b.x-a.x)*.25), y=Math.round(e.y+(b.y-e.y)*.35), w=Math.max(8,Math.round(Math.abs(b.x-a.x)*.5)), h=Math.max(8,Math.round((b.y-e.y)*.8));
      return {x,y,w,h};
    });
    let total=0, n=0;
    for(const r of regions){
      const d = ctx.getImageData(r.x,r.y,r.w,r.h).data, W=r.w;
      const L = []; for(let i=0;i<d.length;i+=4) L.push(.299*d[i]+.587*d[i+1]+.114*d[i+2]);
      for(let y=2;y<r.h-2;y++) for(let x=2;x<W-2;x++){
        let s=0; for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++) s+=L[(y+dy)*W+x+dx];
        total += Math.abs(L[y*W+x]-s/25); n++;
      }
    }
    const m = total/Math.max(1,n);
    return clamp(Math.round(100-(m-1.2)*9), 45, 96);
  }catch(e){ return 70; }
}
function potentialOf(f){
  const now = Math.round(f.harmonia*.4 + f.pele*.3 + f.definicao*.3);
  const pele = Math.max(f.pele, Math.min(95, Math.round(f.pele+(100-f.pele)*.6)));
  const def = Math.max(f.definicao, Math.min(94, Math.round(f.definicao+(100-f.definicao)*.55)));
  const harm = Math.max(f.harmonia, Math.min(98, f.harmonia+3));
  const pot = Math.round(harm*.4 + pele*.3 + def*.3);
  return {now, pot, pele, def, harm};
}
async function analyseWithClaude(blob){
  if(!window.claude || !window.claude.use) return null;
  let sample = null; try{ sample = await window.claude.use("sample"); }catch(e){}
  if(!sample) return null;
  try{ const lim = await sample.limits(); if(!lim || !lim.images) return null; }catch(e){}
  const prompt = `Analisa esta foto de um rosto para uma app de bem-estar. Sê construtivo, gentil e realista; nunca humilhes nem compares com outras pessoas. Responde em português de Portugal, APENAS com JSON neste formato:
{"rosto":true,"formato":"oval|redondo|quadrado|longo|coracao|diamante","harmonia":0-100,"pele":0-100,"definicao":0-100,"fortes":["2 a 3 pontos fortes curtos"],"melhorar":["2 a 4 coisas realistas que se podem melhorar com hábitos (pele, sono, % de gordura, cabelo, barba, sobrancelhas, postura)"]}
"harmonia" = proporções e simetria; "pele" = aspeto da pele nesta luz; "definicao" = definição do maxilar e da zona do queixo. Usa valores entre 55 e 92 salvo casos muito claros. Se não houver um rosto nítido, responde {"rosto":false}.`;
  try{
    const r = await sample.json(prompt, {images:[blob], modelTier:"default"});
    if(!r || r.rosto===false) return {fail:true};
    return {harmonia:clamp(+r.harmonia||70,40,98), pele:clamp(+r.pele||70,40,98), definicao:clamp(+r.definicao||70,40,98), shape:SHAPES[r.formato]?r.formato:"oval", fortes:r.fortes||[], melhorar:r.melhorar||[], method:"claude"};
  }catch(e){ return null; }
}

async function analyse(canvas){
  const cam=$("#cam"); if(!cam) return;
  cam.querySelectorAll("video").forEach(v=>v.remove());
  const shown=document.createElement("canvas"); shown.width=canvas.width; shown.height=canvas.height; shown.getContext("2d").drawImage(canvas,0,0);
  cam.prepend(shown); const g=cam.querySelector(".guide"); if(g) g.remove();
  const line=document.createElement("div"); line.className="scanline"; cam.appendChild(line);
  $("#hint").textContent="A analisar…"; $("#camBtns").hidden=true; $("#scanMsg").textContent="";
  let res=null;
  const ok = await ensureFaceApi();
  if(ok){
    try{
      const det = await faceapi.detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions({inputSize:416, scoreThreshold:.4})).withFaceLandmarks();
      if(det){
        const pts = det.landmarks.positions.map(p=>({x:p.x,y:p.y}));
        res = analyseLandmarks(pts, canvas);
        const x=shown.getContext("2d"); const acc=getComputedStyle(document.documentElement).getPropertyValue("--apricot").trim();
        x.fillStyle=acc; const r=Math.max(2,canvas.width/260);

      } else res={fail:true};
    }catch(e){ res=null; }
  }
  if(!res){
    const blob = await new Promise(r=>canvas.toBlob(r,"image/jpeg",.85));
    res = await analyseWithClaude(blob);
  }
  line.remove();
  if(!res){ $("#hint").textContent=""; $("#camBtns").hidden=false; $("#scanMsg").textContent="Aqui não consegui carregar o detetor de rosto. Podes saltar este passo e escolher o formato do rosto mais tarde, em «Rosto»."; return; }
  if(res.fail){ $("#hint").textContent="Não encontrei um rosto"; $("#camBtns").hidden=false; $("#scanMsg").textContent="Tenta outra vez: de frente, mais perto e com mais luz."; return; }
  const thumb = document.createElement("canvas"); const ts=160/Math.max(canvas.width,canvas.height); thumb.width=Math.round(canvas.width*ts); thumb.height=Math.round(canvas.height*ts); thumb.getContext("2d").drawImage(shown,0,0,thumb.width,thumb.height);
  res.date = Date.now(); res.thumb = thumb.toDataURL("image/jpeg",.7);
  const pf = potentialOf(res); res.now=pf.now; res.pot=pf.pot;
  S.face = res; S.scans.push({date:res.date, now:res.now, pot:res.pot}); save();

}

  out.push(["Pele","Limpeza suave de manhã e à noite, hidratante e protetor solar (FPS 30+) todos os dias. Dormir 7–9 horas e beber água fazem diferença visível."]);
  if(goals.includes("inchaco")||!a) out.push(["Menos inchaço","Menos sal e álcool, mais água, dormir bem e não comer muito tarde. O rosto costuma estar mais inchado de manhã."]);
  if(goals.includes("olheiras")) out.push(["Olheiras","Horário de sono regular, protetor solar à volta dos olhos e algo frio de manhã. Se forem muito escuras, podem ser genéticas."]);
  const sh = SHAPES[f.shape]||SHAPES.oval;
  out.push(["Cabelo para rosto "+sh.n.toLowerCase(), sh.hair]);

  out.push(["Sobrancelhas","Arrumar só os pelos soltos entre e por baixo das sobrancelhas já dá um ar mais cuidado."]);
  return out;
}

function renderQuiz(){
  const q=Q[qi], a=S.answers;
  const pct = Math.round(qi/Q.length*100);
  let body="";
  if(q.type==="form"){
    body = `<div class="stack">
      <div class="stack-s"><span class="f" style="font-weight:600;font-size:.9rem">Sexo</span><div class="row">
        ${[["m","Masculino"],["f","Feminino"]].map(([v,l])=>`<button class="chip" data-sexo="${v}" aria-pressed="${a.sexo===v}">${l}</button>`).join("")}</div></div>
      <div class="grid2">
        <label class="f" for="idade">Idade<input id="idade" type="number" inputmode="numeric" min="13" max="90" value="${a.idade||""}" placeholder="18"></label>
        <label class="f" for="altura">Altura (cm)<input id="altura" type="number" inputmode="numeric" min="130" max="230" value="${a.altura||""}" placeholder="175"></label>
        <label class="f" for="peso">Peso (kg)<input id="peso" type="number" inputmode="decimal" min="35" max="250" value="${a.peso||""}" placeholder="70"></label>
        <label class="f" for="ativ">No dia a dia<select id="ativ">
          ${[["sed","Sentado quase sempre"],["leve","Ando um pouco"],["ativo","Ando muito / de pé"],["muito","Trabalho físico"]].map(([v,l])=>`<option value="${v}" ${ (a.ativ||"leve")===v?"selected":""}>${l}</option>`).join("")}
        </select></label>
      </div></div>`;
  } else {
    const opts = q.foods ? FOODS : q.opts;
    const multi = q.type==="multi"; const cur = a[q.id];
    const isOn = v => multi ? (cur||[]).includes(v) : cur===v;
    if(q.foods || (multi && opts.every(o=>!o[2]))) body = `<div class="row">${opts.map(([v,l])=>`<button class="chip" data-v="${v}" aria-pressed="${isOn(v)}">${l}</button>`).join("")}</div>`;
    else if(q.grid) body = `<div class="grid2">${opts.map(([v,l,d])=>`<button class="opt" data-v="${v}" aria-pressed="${isOn(v)}"><b>${l}</b>${d?`<span>${d}</span>`:""}</button>`).join("")}</div>`;
    else body = `<div class="stack-s">${opts.map(([v,l,d])=>`<button class="opt" data-v="${v}" aria-pressed="${isOn(v)}"><b>${l}</b>${d?`<span>${d}</span>`:""}</button>`).join("")}</div>`;
  }
  app.innerHTML = `
  <div class="qhead">
    <div class="row between"><button class="btn ghost sm" id="qback">←</button><span class="eyebrow num">${qi+1} / ${Q.length}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
  </div>
  <div class="stack">
    <div class="stack-s"><h2>${q.title}</h2>${q.sub?`<p class="muted">${q.sub}</p>`:""}</div>
    ${body}
    <button class="btn block" id="qnext">${qi===Q.length-1?"Criar o meu plano":"Seguinte"}</button>
    ${q.type==="multi"?`<p class="small muted">Podes avançar sem escolher nada.</p>`:""}
  </div>`;
  $("#qback").onclick=()=>{ if(qi===0){ view = S.plan?"app":"home"; } else qi--; render(); };
  app.querySelectorAll("[data-sexo]").forEach(b=>b.onclick=()=>{ a.sexo=b.dataset.sexo; app.querySelectorAll("[data-sexo]").forEach(x=>x.setAttribute("aria-pressed", x===b)); });
  app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.v;
    if(q.type==="one"){ a[q.id]=v; app.querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed", x===b)); save(); setTimeout(next, 180); }
    else {
      let arr=a[q.id]||[];
      const exclusive = v==="nada"||v==="nenhuma";
      if(arr.includes(v)) arr=arr.filter(x=>x!==v);
      else arr = exclusive ? [v] : arr.filter(x=>x!=="nada"&&x!=="nenhuma").concat(v);
      a[q.id]=arr; app.querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed", arr.includes(x.dataset.v)));
      save();
    }
  });
  $("#qnext").onclick=next;
  function next(){
    if(q.type==="form"){
      a.idade=$("#idade").value; a.altura=$("#altura").value; a.peso=$("#peso").value; a.ativ=$("#ativ").value;
      if(!a.sexo||!a.idade||!a.altura||!a.peso){ toast("Preenche sexo, idade, altura e peso."); return; }
      if(+a.idade<13){ toast("Esta app é para quem tem 13 anos ou mais."); return; }
    }
    if(q.type==="one" && !a[q.id]){ toast("Escolhe uma opção."); return; }
    save();
    if(qi<Q.length-1){ qi++; render(); }
    else { makePlan(); view="app"; tab="hoje"; selDay=todayIdx(); mealDay=todayIdx(); render(); toast("Plano criado!"); }
  }
}

  const a=S.answers, acne=(a.afeta||[]).includes("acne");
  return `<div class="card stack-s"><h3>Rotina da pele</h3>
    <p><b>Manhã:</b> lavar com gel suave · hidratante leve · protetor solar FPS 30+.</p>
    <p><b>Noite:</b> lavar · ${acne?"produto com ácido salicílico ou peróxido de benzoíla (começa 3× por semana)":"niacinamida ou só hidratante"} · hidratante.</p>
    <p class="small muted">${acne?"Não espremas as borbulhas e muda a fronha 2× por semana. Se a acne for forte ou deixar marcas, vai a um dermatologista.":"Muda a fronha uma vez por semana e não durmas com a cara suja."}</p></div>`;
}
function viewExtras(){
  const t=S.plan.t, a=S.answers, w=S.weights.slice(-12);
  return `<div class="stack">
    <div class="stack-s"><span class="eyebrow">Extras</span><h2>Mais coisas úteis</h2></div>
    <div class="card stack-s"><h3>Registo de peso</h3>
      <div class="row" style="flex-wrap:nowrap"><input id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="${a.peso||70}" aria-label="Peso de hoje em kg"><button class="btn sm" id="wAdd">Guardar</button></div>
      ${w.length>1?sparkSVG(w):`<p class="small muted">Pesa-te de manhã, depois da casa de banho, 1–2 vezes por semana. O gráfico aparece com 2 registos.</p>`}
      ${w.length?`<p class="small muted">Último: <span class="num">${w[w.length-1].v} kg</span> · início: <span class="num">${a.peso} kg</span></p>`:""}
    </div>
    <div class="card stack-s"><h3>Os teus números</h3>
      <div class="row between small"><span>Metabolismo em repouso</span><span class="num">${t.bmr} kcal</span></div>
      <div class="row between small"><span>Gasto diário estimado</span><span class="num">${t.tdee} kcal</span></div>
      <div class="row between small"><span>Objetivo diário</span><span class="num">${t.kcal} kcal</span></div>
      <div class="row between small"><span>Água</span><span class="num">${(t.water*0.25).toFixed(1).replace(".",",")} l</span></div>
    </div>
    <div class="card stack-s"><h3>Dicas para o que te afeta</h3>${affectTips().map(x=>`<div class="tip"><span class="dot"></span><span>${x}</span></div>`).join("")}</div>
    <div class="card stack-s"><h3>Mudar preferências</h3><p class="small muted">Refaz as perguntas. O plano novo usa as respostas novas.</p>
      <button class="btn soft block" id="redo">Refazer perguntas</button>
      ${S.blocked.length?`<button class="btn ghost block" id="unblock">Voltar a mostrar ${S.blocked.length} refeiç${S.blocked.length>1?"ões":"ão"} que tiraste</button>`:""}
    </div>
    <div class="card stack-s"><h3>Tema</h3><div class="row">${[["","Sistema"],["light","Claro"],["dark","Escuro"]].map(([v,l])=>`<button class="chip" data-theme-set="${v}" aria-pressed="${(S.theme||"")===v}">${l}</button>`).join("")}</div></div>
    <div id="resetBox" class="card stack-s"><h3>Apagar tudo</h3><p class="small muted">Apaga o plano, as fotos e os registos deste dispositivo.</p><button class="btn ghost block" id="reset" style="color:var(--bad)">Apagar tudo</button></div>
    <p class="disclaimer">Os valores são estimativas para pessoas saudáveis. Se tens menos de 18 anos, uma doença, estás grávida ou tens historial de distúrbios alimentares, fala com um médico ou nutricionista antes de mudar a alimentação.</p>
  </div>`;
}
function affectTips(){
  const a=S.answers, f=a.afeta||[], out=[];
  if(f.includes("sono")) out.push("<b>Sono:</b> mesma hora de deitar todos os dias, telemóvel fora da cama 30 min antes, quarto escuro e fresco. Café só até às 14h.");
  if(f.includes("stress")) out.push("<b>Stress:</b> 10 minutos de caminhada depois das refeições e respiração lenta (4 s inspirar, 6 s expirar) durante 3 minutos.");
  if(f.includes("fome")) out.push("<b>Fome à noite:</b> põe mais proteína ao jantar e deixa um lanche planeado (iogurte ou skyr) para depois do jantar.");
  if(f.includes("digestao")) out.push("<b>Inchaço:</b> come devagar, menos bebidas com gás e aumenta as leguminosas aos poucos.");
  if(f.includes("tempo")) out.push("<b>Pouco tempo:</b> cozinha a proteína e o arroz para 3 dias de uma vez (domingo e quarta).");
  if(f.includes("acne")) out.push("<b>Acne:</b> há pessoas em quem o leite e os doces pioram a acne. Experimenta reduzir 3–4 semanas e vê se notas diferença.");
  if(f.includes("joelho")||f.includes("costas")||f.includes("ombro")) out.push("<b>Dores:</b> aquece 5–10 min antes de treinar e nunca treines com dor aguda.");
  if(!out.length) out.push("Mantém a consistência: 80% do resultado vem de cumprir o plano na maior parte dos dias, não de ser perfeito.");
  return out;
}
function sparkSVG(w){
  const vs=w.map(x=>x.v), mn=Math.min(...vs)-0.5, mx=Math.max(...vs)+0.5, W=300, H=90, pad=8;
  const X=i=>pad+i*(W-2*pad)/(w.length-1), Y=v=>H-pad-(v-mn)/(mx-mn)*(H-2*pad);
  const path=w.map((x,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(x.v).toFixed(1)}`).join("");
  const last=w[w.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do peso">
    <path d="${path} L${X(w.length-1)},${H-pad} L${X(0)},${H-pad}Z" fill="var(--sunk)"/>
    <path d="${path}" fill="none" stroke="var(--spruce)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(w.length-1)}" cy="${Y(last.v)}" r="4.5" fill="var(--apricot)"/>
    <text x="${W-pad}" y="12" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">${mx.toFixed(1)}</text>
    <text x="${W-pad}" y="${H-12}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">${mn.toFixed(1)}</text></svg>`;
}
function swapMeal(d,i){
  const e=S.plan.meals[d][i], a=S.answers;
  const c=candidates(e.slot,a).filter(m=>m.id!==e.id && !S.plan.meals[d].some(x=>x.id===m.id));
  if(!c.length){ toast("Não há mais opções com as tuas preferências."); return; }
  const r=rnd(Date.now()); const ranked=c.map(m=>({m,s:mealScore(m,a,r)+r()*3})).sort((x,y)=>y.s-x.s);
  e.id = ranked[0].m.id; save(); render(); toast("Trocado por: "+ranked[0].m.n);
}
function bindApp(){
  app.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{ const [k,i]=b.dataset.ex.split("|"); const l=dayLog(k); l.ex[i]=!l.ex[i]; save(); b.setAttribute("aria-pressed",!!l.ex[i]); });
  app.querySelectorAll("[data-meal]").forEach(b=>b.onclick=()=>{ const [k,i]=b.dataset.meal.split("|"); const l=dayLog(k); l.meals[i]=!l.meals[i]; save(); render(); });
  app.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{ const l=dayLog(); l.done[b.dataset.done]=!l.done[b.dataset.done]; save(); b.setAttribute("aria-pressed",!!l.done[b.dataset.done]); });
  app.querySelectorAll("[data-water]").forEach(b=>b.onclick=()=>{ const l=dayLog(), n=+b.dataset.water; l.water = l.water===n ? n-1 : n; save(); render(); });
  app.querySelectorAll("[data-swap]").forEach(b=>b.onclick=()=>{ const [d,i]=b.dataset.swap.split("|").map(Number); swapMeal(d,i); });
  app.querySelectorAll("[data-block]").forEach(b=>b.onclick=()=>{
    const [d,i]=b.dataset.block.split("|").map(Number); const id=S.plan.meals[d][i].id; if(!id) return;
    S.blocked.push(id);
    const a=S.answers;
    S.plan.meals.forEach((day,di)=>day.forEach((e,ii)=>{ if(e.id===id){ const c=candidates(e.slot,a).filter(m=>!day.some(x=>x.id===m.id)); const r=rnd(di*7+ii+Date.now()); const pk=c.map(m=>({m,s:mealScore(m,a,r)})).sort((x,y)=>y.s-x.s)[0]; e.id=pk?pk.m.id:null; } }));
    save(); render(); toast("Tirei essa refeição da semana toda.");
  });
  app.querySelectorAll("[data-tday]").forEach(b=>b.onclick=()=>{ selDay=+b.dataset.tday; render(); });
  app.querySelectorAll("[data-mday]").forEach(b=>b.onclick=()=>{ mealDay=+b.dataset.mday; render(); });
  app.querySelectorAll("[data-shop]").forEach(b=>b.onclick=()=>{ const k=b.dataset.shop; S.shopGot[k]=!S.shopGot[k]; save(); b.setAttribute("aria-pressed",!!S.shopGot[k]); b.closest("li").classList.toggle("got",!!S.shopGot[k]); });
  app.querySelectorAll("[data-shape]").forEach(b=>b.onclick=()=>{ S.face={shape:b.dataset.shape, method:"manual", date:Date.now()}; save(); render(); });
  app.querySelectorAll("[data-theme-set]").forEach(b=>b.onclick=()=>{ S.theme=b.dataset.themeSet; save(); applyTheme(); render(); });
  const on=(id,fn)=>{ const el=$("#"+id); if(el) el.onclick=fn; };
  on("toScan",()=>{ view="scan"; render(); });
  on("newDay",()=>{ const a=S.answers, w=buildMeals(a, Date.now()%100000); S.plan.meals[mealDay]=w[mealDay]; save(); render(); toast("Dia novo pronto."); });
  on("newWeek",()=>{ S.plan.seed=Date.now()%100000; S.plan.meals=buildMeals(S.answers,S.plan.seed); S.shopGot={}; save(); render(); toast("Semana nova de comida."); });
  on("newTrain",()=>{ // baralhar: preferir a 2.ª opção de cada padrão
    const tr=S.plan.train; tr.forEach(w=>w.ex.forEach(e=>{ if(!e.pat) return; const alt=pickEx(e.pat,S.answers,[e.n]); if(alt && !w.ex.some(x=>x.n===alt.n)) e.n=alt.n; })); save(); render(); toast("Troquei os exercícios por alternativas.");
  });
  on("wAdd",()=>{ const v=parseFloat(String($("#wIn").value).replace(",",".")); if(!(v>30&&v<300)){ toast("Escreve o peso em kg."); return; } S.weights.push({d:dateKey(), v}); save(); render(); toast("Peso guardado."); });
  on("redo",()=>{ view="quiz"; qi=0; render(); });
  on("unblock",()=>{ S.blocked=[]; save(); render(); toast("Refeições de volta às opções."); });
  on("reset",()=>{
    $("#resetBox").innerHTML=`<h3>Tens a certeza?</h3><p class="small muted">Isto não se pode desfazer.</p><div class="row"><button class="btn sm" id="resetYes" style="background:var(--bad)">Sim, apagar</button><button class="btn ghost sm" id="resetNo">Cancelar</button></div>`;
    $("#resetYes").onclick=()=>{ const th=S.theme; S=fresh(); S.theme=th; save(); view="home"; render(); };
    $("#resetNo").onclick=()=>render();
  });
}
function applyTheme(){ if(S.theme) document.documentElement.setAttribute("data-theme",S.theme); else document.documentElement.removeAttribute("data-theme"); }
applyTheme();
// Planos antigos guardados sem algum campo: refazer de forma segura
if(S.plan && (!S.plan.meals || !S.plan.train)) { try{ makePlan(); }catch(e){ S.plan=null; view="home"; } }
render();
</script>
