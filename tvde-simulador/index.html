<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b0e13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Motorista TVDE</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>
    <div id="hud" class="hidden">
      <div id="topbar">
        <div class="pill" id="clockPill">🕒 06:00</div>
        <div class="pill" id="statusPill"><span class="dot"></span>Offline</div>
        <div class="pill" id="moneyPill">💶 100,00 €</div>
        <button id="btnPause" aria-label="Pausa">❚❚</button>
      </div>
      <div id="nav" class="hidden"></div>
      <canvas id="minimap"></canvas>
      <div id="actionWrap" class="hidden"><button id="actionBtn"></button></div>
      <button id="radioBtn" aria-label="Rádio">📻</button>
      <button id="phoneBtn" aria-label="Telemóvel">📱</button>
      <div id="toasts"></div>
      <div id="reqMini" class="hidden"></div>
      <div id="say" class="hidden"></div>
      <div id="dialog" class="hidden"></div>
    </div>
    <div id="phone" class="hidden"></div>
    <div id="celebrate" class="hidden"></div>
    <div id="modal" class="hidden"></div>
    <div id="fade" class="hidden"></div>
    <div id="menu" class="hidden"></div>
    <div id="loading"><div class="logo">Motorista TVDE</div><div class="spinner"></div><div id="loadTxt">A carregar...</div></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
