<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shoalmates</title>
  <meta name="description" content="Shoalmates: salas de estudo online com a tua turma.">
  <meta name="theme-color" content="#5a3ce6">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <!-- MENU -->
  <aside id="nav" class="nav" data-i18n-aria="view.inicio">
    <div class="brand">
      <img src="icons/icon.svg" alt="" class="logo">
      <div><b>Shoalmates</b><span data-i18n="brand.tagline">estuda em cardume</span></div>
      <button id="navClose" class="icon-btn nav-close" data-i18n-aria="aria.closeMenu">✕</button>
    </div>

    <button id="addBtn" class="add-btn" data-i18n="nav.add">＋ Adicionar</button>

    <div class="nav-group">
      <span class="nav-label" data-i18n="nav.main">Principal</span>
      <button data-view="chat"><i>🤖</i><span data-i18n="view.chat">Chat</span><em class="nav-tag" data-i18n="nav.ai">IA</em></button>
      <button data-view="plano"><i>🗓️</i><span data-i18n="view.plano">O meu plano</span></button>
      <button data-view="inicio"><i>🏠</i><span data-i18n="view.inicio">Início</span></button>
      <button data-view="estudar"><i>⏱️</i><span data-i18n="view.estudar">Estudar</span></button>
      <button data-view="duelos"><i>⚔️</i><span data-i18n="view.duelos">Duelos</span></button>
    </div>
    <div class="nav-group">
      <span class="nav-label" data-i18n="nav.class">Turma</span>
      <button data-view="salachat"><i>💬</i><span data-i18n="view.salachat">Chat da sala</span><em id="chatDot" class="dot hidden"></em></button>
      <button data-view="apontamentos"><i>📝</i><span data-i18n="view.apontamentos">Apontamentos</span></button>
      <button data-view="calendario"><i>📅</i><span data-i18n="view.calendario">Calendário</span></button>
      <button data-view="liga"><i>🏆</i><span data-i18n="view.liga">Liga</span></button>
    </div>
    <div class="nav-group">
      <span class="nav-label" data-i18n="nav.me">Eu</span>
      <button data-view="loja"><i>🛍️</i><span data-i18n="view.loja">Loja</span></button>
      <button data-view="medalhas"><i>🏅</i><span data-i18n="view.medalhas">Medalhas</span></button>
      <button data-view="perfil"><i>👤</i><span data-i18n="view.perfil">Perfil</span></button>
      <button data-view="premium" class="nav-premium"><i>⭐</i><span data-i18n="view.premium">Premium</span></button>
      <button data-view="definicoes"><i>⚙️</i><span data-i18n="view.definicoes">Definições</span></button>
    </div>

    <div class="nav-foot">
      <div class="wallet"><span>🐟</span><b id="navScales">0</b> <span data-i18n="nav.scales">escamas</span></div>
      <button class="me-chip" data-view="perfil"><span id="navAvatar" class="avatar"></span><span id="navName"></span></button>
    </div>
  </aside>
  <div id="navShade" class="shade hidden"></div>

  <!-- CONTEÚDO -->
  <div class="content">
    <header class="topbar">
      <button id="navOpen" class="icon-btn menu-btn" data-i18n-aria="aria.openMenu">☰</button>
      <div class="top-title">
        <h1 id="viewTitle"></h1>
        <div id="roomChips" class="chips hidden">
          <span id="roomTitle" class="chip strong"></span>
          <button id="copyCode" class="chip code" data-i18n-title="copyCode"></button>
          <span id="leagueBadge" class="chip"></span>
          <span id="streakBadge" class="chip"></span>
        </div>
      </div>
      <div class="wallet top-wallet"><span>🐟</span><b id="topScales">0</b></div>
    </header>

    <div id="testBanner" class="banner hidden"></div>

    <main>
      <!-- INÍCIO -->
      <section id="view-inicio" class="view">
        <div class="hero card">
          <img src="icons/icon.svg" alt="" class="hero-logo">
          <div>
            <h2 id="hello"></h2>
            <p class="muted" data-i18n="home.intro"></p>
          </div>
        </div>

        <div id="planToday" class="card plan-today"></div>

        <div id="joinBox" class="grid-2">
          <div class="card">
            <label for="name" data-i18n="home.yourName"></label>
            <input id="name" maxlength="20" data-i18n-ph="ph.name" autocomplete="off">
            <div class="split">
              <div class="stack">
                <h3 data-i18n="home.create"></h3>
                <input id="roomName" maxlength="40" data-i18n-ph="ph.roomName">
                <button id="create" data-i18n="btn.create"></button>
              </div>
              <div class="stack">
                <h3 data-i18n="home.join"></h3>
                <input id="code" maxlength="6" data-i18n-ph="ph.code" autocomplete="off">
                <button id="join" data-i18n="btn.join"></button>
              </div>
            </div>
            <p id="homeError" class="error"></p>
            <p class="muted small" data-i18n="home.privacy"></p>
          </div>
          <div class="card">
            <h3 data-i18n="home.recent"></h3>
            <div id="recent"></div>
          </div>
        </div>

        <div id="roomHome" class="grid-2 hidden">
          <div class="card room-card">
            <h3><span data-i18n="home.inRoom"></span> <span id="roomHomeName"></span></h3>
            <p class="muted small" data-i18n="home.share"></p>
            <div class="row wrap">
              <button data-go="estudar" data-i18n="btn.studyNow"></button>
              <button data-go="duelos" class="ghost" data-i18n="btn.duel"></button>
              <button data-go="salachat" class="ghost" data-i18n="btn.chat"></button>
              <button id="leave2" class="ghost danger" data-i18n="btn.leave"></button>
            </div>
          </div>
          <div class="card">
            <h3 data-i18n="home.today"></h3>
            <div id="roomHomeStats" class="mini-stats"></div>
          </div>
        </div>

        <h3 class="section-title" data-i18n="home.progress"></h3>
        <div id="myStats" class="stat-row"></div>
      </section>

      <!-- CHAT COM O TUTOR (principal, não precisa de sala) -->
      <section id="view-chat" class="view hidden">
        <div class="card tutor-card">
          <div class="tutor-head">
            <img src="icons/icon.svg" alt="" class="tutor-logo">
            <div><b data-i18n="tutor.name"></b><span class="muted small" data-i18n="tutor.sub"></span></div>
            <button id="tutorNew" class="ghost small-btn" data-i18n="tutor.new"></button>
          </div>
          <ul id="tutorLog" class="messages tutor-log"></ul>
          <div id="tutorChips" class="tutor-chips"></div>
          <div id="tutorImg" class="tutor-img hidden"><img alt=""><button class="icon-btn" id="tutorImgX" data-i18n-aria="aria.close">✕</button></div>
          <form id="tutorForm" class="tutor-form">
            <label class="icon-btn tutor-photo" data-i18n-title="tutor.photo">📷<input id="tutorPhoto" type="file" accept="image/*" hidden></label>
            <textarea id="tutorInput" rows="1" maxlength="2000" data-i18n-ph="tutor.ph"></textarea>
            <button id="tutorSend" data-i18n="btn.send"></button>
          </form>
          <p id="tutorInfo" class="muted small tutor-info"></p>
        </div>
      </section>

      <!-- O MEU PLANO -->
      <section id="view-plano" class="view hidden">
        <div class="card plan-head">
          <div>
            <h2 data-i18n="plan.title"></h2>
            <p id="planSummary" class="muted"></p>
            <div class="progress"><div id="planBar" style="width:0%"></div></div>
            <p id="planProgress" class="muted small"></p>
          </div>
          <button id="redoPlan" class="ghost" data-i18n="plan.redo"></button>
        </div>
        <p id="planNeedRoom" class="banner soft hidden" data-i18n="plan.needRoom"></p>
        <div id="planWeek" class="plan-week"></div>
        <div class="card">
          <h3 data-i18n="plan.tips"></h3>
          <ul id="planTips" class="tips"></ul>
        </div>
      </section>

      <!-- ESTUDAR -->
      <section id="view-estudar" class="view hidden" data-needs-room>
        <div class="grid-study">
          <div class="card">
            <div id="timerBox" class="timer idle">
              <div id="timerLabel" class="timer-label"></div>
              <div id="timerClock" class="timer-clock">25:00</div>
              <div class="timer-controls">
                <select id="focusMin" aria-label="min">
                  <option value="15">15 min</option>
                  <option value="25" selected>25 min</option>
                  <option value="45">45 min</option>
                  <option value="60">60 min</option>
                </select>
                <button id="timerStart" data-i18n="btn.startFocus"></button>
                <button id="timerStop" class="ghost hidden" data-i18n="btn.stop"></button>
              </div>
              <div class="reactions">
                <button data-react="🔥">🔥</button><button data-react="💪">💪</button><button data-react="👏">👏</button>
                <button data-react="🤯">🤯</button><button data-react="😴">😴</button><button data-react="☕">☕</button>
              </div>
              <p class="muted small" data-i18n="study.warn"></p>
            </div>
            <div class="ambience">
              <label for="ambience" class="small" data-i18n="study.sound"></label>
              <div class="row">
                <select id="ambience">
                  <option value="none" data-i18n="amb.none"></option>
                  <option value="chuva" data-i18n="amb.chuva"></option>
                  <option value="cafe" data-i18n="amb.cafe"></option>
                  <option value="lofi" data-i18n="amb.lofi"></option>
                  <option value="biblioteca" data-i18n="amb.biblioteca"></option>
                </select>
              </div>
              <button id="soundUnlock" class="ghost small-btn hidden" data-i18n="btn.enableSound"></button>
            </div>
          </div>
          <div class="stack-cards">
            <div class="card">
              <h3 data-i18n="study.flame"></h3>
              <div id="streakBox"></div>
            </div>
            <div class="card">
              <h3 data-i18n="study.members"></h3>
              <ul id="members" class="members"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- CHAT DA SALA -->
      <section id="view-salachat" class="view hidden" data-needs-room>
        <div class="card chat-card">
          <ul id="messages" class="messages"></ul>
          <form id="chatForm" class="row">
            <input id="chatInput" maxlength="500" data-i18n-ph="ph.message" autocomplete="off">
            <button data-i18n="btn.send"></button>
          </form>
        </div>
      </section>

      <!-- DUELOS -->
      <section id="view-duelos" class="view hidden" data-needs-room>
        <div class="card">
          <div id="duelArea" class="duel hidden"></div>
          <div id="quizSetup">
            <div class="duel-start">
              <p><b id="qCount">0</b> <span data-i18n="duel.inRoom"></span></p>
              <div class="row wrap">
                <select id="duelMode">
                  <option value="classico" data-i18n="mode.classic"></option>
                  <option value="eliminacao" data-i18n="mode.elim"></option>
                </select>
                <button id="duelStart" data-i18n="btn.startDuel"></button>
              </div>
            </div>
            <p id="quizError" class="error"></p>

            <div class="ai-box">
              <b data-i18n="ai.qTitle"></b>
              <p class="muted small" data-i18n="ai.qHelp"></p>
              <div class="row wrap">
                <label class="file-btn"><span data-i18n="btn.photo"></span><input id="aiPhoto" type="file" accept="image/*" capture="environment" hidden></label>
                <button id="aiTextToggle" class="ghost" data-i18n="btn.pasteText"></button>
                <span id="aiQuota" class="muted small"></span>
              </div>
              <div id="aiTextBox" class="stack hidden">
                <textarea id="aiText" rows="4" maxlength="8000" data-i18n-ph="ph.aiText"></textarea>
                <button id="aiFromText" class="ai-btn" data-i18n="btn.makeQuestions"></button>
              </div>
              <p id="aiStatus" class="muted small"></p>
            </div>

            <details id="qDetails">
              <summary data-i18n="q.manual"></summary>
              <form id="qForm" class="stack">
                <input id="qText" maxlength="200" data-i18n-ph="ph.q">
                <div class="options">
                  <label><input type="radio" name="right" value="0" checked><input class="opt" maxlength="80" data-i18n-ph="ph.optA"></label>
                  <label><input type="radio" name="right" value="1"><input class="opt" maxlength="80" data-i18n-ph="ph.optB"></label>
                  <label><input type="radio" name="right" value="2"><input class="opt" maxlength="80" data-i18n-ph="ph.optC"></label>
                  <label><input type="radio" name="right" value="3"><input class="opt" maxlength="80" data-i18n-ph="ph.optD"></label>
                </div>
                <div class="row wrap">
                  <input id="qTopic" maxlength="40" data-i18n-ph="ph.topic">
                  <select id="qDiff" data-i18n-aria="diff.title">
                    <option value="1" data-i18n="diff.1"></option><option value="2" selected data-i18n="diff.2"></option><option value="3" data-i18n="diff.3"></option>
                  </select>
                </div>
                <p class="muted small" data-i18n="q.markRight"></p>
                <button data-i18n="btn.addQuestion"></button>
              </form>
            </details>
            <ul id="questions" class="questions"></ul>
          </div>
        </div>
      </section>

      <!-- APONTAMENTOS -->
      <section id="view-apontamentos" class="view hidden" data-needs-room>
        <div class="grid-2 wide-left">
          <div class="card">
            <div class="ai-box">
              <div class="row between wrap">
                <div><b data-i18n="ai.sTitle"></b><br><span class="muted small" data-i18n="ai.sHelp"></span></div>
                <button id="aiSummary" class="ai-btn" data-i18n="btn.makeSummary"></button>
              </div>
              <div id="summary"></div>
            </div>
            <ul id="notes" class="notes"></ul>
          </div>
          <div class="card">
            <h3 data-i18n="notes.new"></h3>
            <form id="noteForm" class="stack">
              <input id="noteTitle" maxlength="60" data-i18n-ph="ph.noteTitle">
              <textarea id="noteText" rows="6" maxlength="4000" data-i18n-ph="ph.noteText"></textarea>
              <button data-i18n="btn.shareNote"></button>
            </form>
          </div>
        </div>
      </section>

      <!-- CALENDÁRIO -->
      <section id="view-calendario" class="view hidden" data-needs-room>
        <div class="grid-2">
          <div class="card">
            <h3 data-i18n="cal.upcoming"></h3>
            <ul id="tests" class="tests"></ul>
          </div>
          <div class="card">
            <h3 data-i18n="cal.add"></h3>
            <form id="testForm" class="stack">
              <input id="testSubject" maxlength="40" data-i18n-ph="ph.subject">
              <input id="testDate" type="date" data-i18n-aria="aria.testDate">
              <button data-i18n="btn.markTest"></button>
            </form>
            <p id="testError" class="error small"></p>
            <p class="muted small" data-i18n="cal.help"></p>
          </div>
        </div>
      </section>

      <!-- LIGA -->
      <section id="view-liga" class="view hidden" data-needs-room>
        <div class="grid-2">
          <div class="card">
            <div id="leagueHead" class="league-head"></div>
            <div class="table-wrap">
              <table class="ranking">
                <thead><tr><th>#</th><th data-i18n="th.room"></th><th data-i18n="th.minWeek"></th></tr></thead>
                <tbody id="leagueBody"></tbody>
              </table>
            </div>
          </div>
          <div class="card">
            <h3 data-i18n="league.inRoom"></h3>
            <div class="table-wrap">
              <table class="ranking">
                <thead><tr><th>#</th><th data-i18n="th.name"></th><th data-i18n="th.min"></th><th data-i18n="th.sessions"></th><th data-i18n="th.wins"></th></tr></thead>
                <tbody id="rankingBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <!-- LOJA -->
      <section id="view-loja" class="view hidden">
        <div class="card shop-head">
          <div class="wallet big-wallet"><span>🐟</span><b id="shopScales">0</b><small data-i18n="nav.scales"></small></div>
          <div>
            <h3 data-i18n="shop.howEarn"></h3>
            <ul id="earnList" class="earn"></ul>
          </div>
        </div>
        <p class="muted small" data-i18n="shop.note"></p>
        <div id="shopGrid" class="shop-grid"></div>
      </section>

      <!-- MEDALHAS -->
      <section id="view-medalhas" class="view hidden">
        <div class="card">
          <h3 data-i18n="medals.yours"></h3>
          <p class="muted small" data-i18n="medals.tap"></p>
          <div id="ownedMedals" class="owned"></div>
        </div>
        <h3 class="section-title"><span data-i18n="medals.ach"></span> <span id="achCount" class="muted small"></span></h3>
        <div id="achievements" class="achievements"></div>
      </section>

      <!-- PERFIL -->
      <section id="view-perfil" class="view hidden">
        <div class="card profile-head">
          <span id="profileAvatar" class="avatar huge"></span>
          <div>
            <h2 id="profileName"></h2>
            <p id="profileMedal" class="muted"></p>
          </div>
        </div>
        <div id="profileStats" class="stat-row"></div>
        <div class="grid-2">
          <div class="card"><h3 data-i18n="profile.avatar"></h3><div id="avatarGrid" class="grid"></div></div>
          <div class="card"><h3 data-i18n="profile.frame"></h3><div id="frameGrid" class="grid"></div></div>
        </div>
        <div class="card" data-room-only>
          <div class="ai-box">
            <div class="row between wrap">
              <div><b data-i18n="grade.title"></b><br><span class="muted small" data-i18n="grade.help"></span></div>
              <div class="row">
                <select id="gradeTest" data-i18n-aria="aria.test"></select>
                <button id="aiGrade" class="ai-btn" data-i18n="btn.predict"></button>
              </div>
            </div>
            <div id="grade"></div>
          </div>
        </div>
      </section>

      <!-- PREMIUM -->
      <section id="view-premium" class="view hidden">
        <div class="prem-head">
          <h2 data-i18n="prem.title"></h2>
          <p class="muted" data-i18n="prem.sub"></p>
          <div class="seg" role="radiogroup">
            <button data-billing="month" class="active" data-i18n="prem.monthly"></button>
            <button data-billing="year"><span data-i18n="prem.yearly"></span> <em id="saveTag" class="save"></em></button>
          </div>
        </div>
        <div id="planCards" class="plan-cards"></div>
        <p class="fair">⚖️ <span data-i18n="prem.fair"></span></p>
        <p class="muted small center" data-i18n="prem.soon"></p>
        <div id="askBox" class="card ask hidden">
          <h3 data-i18n="prem.askTitle"></h3>
          <p class="muted small" data-i18n="prem.askHelp"></p>
          <textarea id="askMsg" rows="3" readonly></textarea>
          <button id="copyAsk" data-i18n="btn.copy"></button>
        </div>
        <div class="card faq">
          <h3 data-i18n="prem.faq"></h3>
          <details><summary data-i18n="prem.q1"></summary><p data-i18n="prem.a1"></p></details>
          <details><summary data-i18n="prem.q2"></summary><p data-i18n="prem.a2"></p></details>
          <details><summary data-i18n="prem.q3"></summary><p data-i18n="prem.a3"></p></details>
        </div>
      </section>

      <!-- DEFINIÇÕES -->
      <section id="view-definicoes" class="view hidden">
        <div class="grid-2">
          <div class="card stack">
            <h3 data-i18n="set.language"></h3>
            <div id="langPicker" class="lang-picker"></div>
          </div>
          <div class="card stack">
            <h3 data-i18n="set.plan"></h3>
            <p class="muted small" data-i18n="set.planHelp"></p>
            <button id="redoPlan2" class="ghost" data-i18n="btn.redoPlan"></button>
          </div>
          <div class="card stack">
            <h3 data-i18n="set.sound"></h3>
            <label for="volume" class="small" data-i18n="set.volume"></label>
            <input id="volume" type="range" min="0" max="1" step="0.05" value="0.5">
            <label class="check"><input id="mute" type="checkbox"> <span data-i18n="set.mute"></span></label>
          </div>
          <div class="card stack">
            <h3 data-i18n="set.theme"></h3>
            <div class="seg" role="radiogroup">
              <button data-theme-set="system" data-i18n="theme.system"></button>
              <button data-theme-set="light" data-i18n="theme.light"></button>
              <button data-theme-set="dark" data-i18n="theme.dark"></button>
            </div>
          </div>
          <div class="card stack">
            <h3 data-i18n="set.room"></h3>
            <p class="muted small" id="settingsRoom"></p>
            <button id="leave" class="ghost danger" data-i18n="btn.leave"></button>
          </div>
          <div class="card stack">
            <h3 data-i18n="set.data"></h3>
            <p class="muted small" data-i18n="set.dataHelp"></p>
            <button id="wipe" class="ghost danger" data-i18n="btn.wipe"></button>
          </div>
        </div>
      </section>

      <!-- precisa de sala -->
      <div id="noRoom" class="card empty hidden">
        <span class="empty-icon">🐟</span>
        <h3 data-i18n="empty.title"></h3>
        <p class="muted" data-i18n="empty.text"></p>
        <button data-go="inicio" data-i18n="btn.goHome"></button>
      </div>
    </main>
  </div>

  <!-- barra de baixo (telemóvel) -->
  <nav class="bottombar">
    <button data-view="chat"><i>🤖</i><span data-i18n="view.chat"></span></button>
    <button data-view="plano"><i>🗓️</i><span data-i18n="view.plano"></span></button>
    <button id="addBtn2" class="bottom-add" data-i18n-aria="aria.add">＋</button>
    <button data-view="inicio"><i>🏠</i><span data-i18n="view.inicio"></span><em id="chatDot2" class="dot hidden"></em></button>
    <button id="moreBtn"><i>☰</i><span data-i18n="nav.more"></span></button>
  </nav>
</div>
